name: One-shot Voxy P0 post-merge preflight

on:
  push:
    branches:
      - docs/governance-ssot-sync-05
    paths:
      - .github/workflows/opentasks-voxy-p0-postmerge-preflight.yml

permissions:
  contents: write

concurrency:
  group: governance-ssot-writer
  cancel-in-progress: false

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout carrier branch
        uses: actions/checkout@v4
        with:
          ref: docs/governance-ssot-sync-05
          path: carrier
          fetch-depth: 2
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          path: mainrepo
          fetch-depth: 1
      - name: Verify exact main and run both task preflights
        shell: bash
        run: |
          set -euo pipefail
          expected="b79782f6835574ffdba9b4d54e5a50ea79039ed9"
          actual="$(git -C mainrepo rev-parse HEAD)"
          test "$actual" = "$expected"
          test "$(git -C mainrepo branch --show-current)" = "main"
          test -z "$(git -C mainrepo status --porcelain)"
          (
            cd mainrepo
            node scripts/codex-task-preflight.mjs VOXY-EDITORIAL-COUNCIL-FAIL-CLOSED-01 | tee /tmp/975.json
            node scripts/codex-task-preflight.mjs VOXY-RENDER-APPROVAL-FRESHNESS-01 | tee /tmp/976.json
          )
          node - <<'NODE'
          const fs=require('fs');
          for (const [file,id] of [['/tmp/975.json','VOXY-EDITORIAL-COUNCIL-FAIL-CLOSED-01'],['/tmp/976.json','VOXY-RENDER-APPROVAL-FRESHNESS-01']]) {
            const p=JSON.parse(fs.readFileSync(file,'utf8'));
            if (p.taskId!==id) throw new Error(`unexpected taskId: ${p.taskId}`);
            if (p.status!=='codex_ready') throw new Error(`${id}: status=${p.status}`);
            if (p.executable!==true) throw new Error(`${id}: executable != true`);
            if (p.branchCreationAllowed!==true) throw new Error(`${id}: branch creation not allowed`);
          }
          NODE
      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd carrier
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/opentasks-voxy-p0-postmerge-preflight.yml
          git commit -m "ci(governance): remove voxy p0 postmerge preflight"
          git push origin HEAD:docs/governance-ssot-sync-05
