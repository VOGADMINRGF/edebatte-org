name: Voxy EU24 Slice B CI writer

on:
  push:
    branches:
      - feat/voxy-eu24-language-variant-02

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/voxy-eu24-language-variant-02
          fetch-depth: 0
      - name: Extend existing Voxy runtime gate only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "54f1dc9bba6f0052481b3e40360d858355e93102"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/voxy-local-composition-runtime.yml')
          text = path.read_text(encoding='utf-8')
          path_anchor = '      - "apps/web/src/features/voxyVideo/editorialEvidenceWindow.ts"\n'
          path_insert = path_anchor + '      - "apps/web/src/features/voxyVideo/editorialLanguageVariant.ts"\n'
          assert text.count(path_anchor) == 1, 'path_anchor_count'
          assert 'apps/web/src/features/voxyVideo/editorialLanguageVariant.ts' not in text, 'module_path_already_present'
          text = text.replace(path_anchor, path_insert, 1)

          test_anchor = '      - "apps/web/tests/voxy-editorial-story-plan.contract.test.ts"\n'
          test_insert = test_anchor + '      - "apps/web/tests/voxy-editorial-language-variant.contract.test.ts"\n'
          assert text.count(test_anchor) == 1, 'test_path_anchor_count'
          assert 'apps/web/tests/voxy-editorial-language-variant.contract.test.ts' not in text, 'test_path_already_present'
          text = text.replace(test_anchor, test_insert, 1)

          cmd_anchor = 'tests/voxy-editorial-evidence-window.contract.test.ts tests/voxy-editorial-story-plan.contract.test.ts '
          cmd_insert = 'tests/voxy-editorial-evidence-window.contract.test.ts tests/voxy-editorial-story-plan.contract.test.ts tests/voxy-editorial-language-variant.contract.test.ts '
          assert text.count(cmd_anchor) == 1, 'command_anchor_count'
          text = text.replace(cmd_anchor, cmd_insert, 1)
          path.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --name-only)" = ".github/workflows/voxy-local-composition-runtime.yml"
      - name: Commit CI convergence and self-delete writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/voxy-local-composition-runtime.yml
          git commit -m 'ci(voxy): gate language variant revision contract'
          git rm .github/workflows/voxy-eu24-slice-b-ci-writer.yml
          git commit -m 'chore(voxy): remove Slice B CI writer'
          git diff origin/main..HEAD --check
          git push origin HEAD:feat/voxy-eu24-language-variant-02
