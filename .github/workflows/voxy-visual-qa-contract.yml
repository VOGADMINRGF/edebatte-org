name: Voxy Visual QA Contract

on:
  pull_request:
    paths:
      - "apps/web/src/features/voxyVideo/**"
      - "apps/web/src/app/admin/review/**"
      - "apps/web/scripts/capture-voxy-200pct-evidence.ts"
      - "apps/web/scripts/rebind-voxy-200pct-semantic-regions.ts"
      - "apps/web/scripts/render-voxy-final-canon-review-surfaces.ts"
      - "apps/web/scripts/bind-voxy-final-canon-hand-visibility.ts"
      - "apps/web/scripts/render-voxy-homepage-multiformat-previews.ts"
      - "apps/web/scripts/render-voxy-head-alpha-compositing-proofs.ts"
      - "apps/web/tests/voxy-final-canon-hand-visibility.contract.test.ts"
      - "apps/web/tests/voxy-visual-qa-checkpoint.contract.test.ts"
      - "apps/web/tests/voxy-visual-qa-review-decision-bridge.contract.test.ts"
      - "apps/web/tests/voxy-visual-qa-human-review-command.contract.test.ts"
      - "apps/web/tests/voxy-visual-detector-license-contract.test.ts"
      - "apps/web/tests/voxy-final-canon-lock.contract.test.ts"
      - "apps/web/THIRD_PARTY_NOTICES.voxy-visual-detector.md"
      - "apps/web/public/brands/voxy/**"
      - "docs/E150/VOXY-200PCT-VISUAL-QA-CHECKPOINT-01_2026-08-05.md"
      - ".github/workflows/voxy-visual-qa-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  VOXY_QA_INTEGRATION_SHA: ${{ github.sha }}
  VOXY_PR_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  contract-and-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Verify tested integration revision
        run: test "$(git rev-parse HEAD)" = "$VOXY_QA_INTEGRATION_SHA"

      - name: Require V3.10.5 final canon before any visual capture
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const path = 'apps/web/src/features/voxyVideo/finalCanon.ts';
          if (!fs.existsSync(path)) throw new Error('voxy_v3_10_5_final_canon_module_missing');
          const source = fs.readFileSync(path, 'utf8');
          const required = [
            'canonId: "VOXY-V3.10.5-HUMAN-FINAL"',
            'sourcePullRequest: 624',
            'referenceRenderHeadSha: "00ff10e80dc8985da1df64de8e9a6df23b9d13e5"',
            'humanAcceptanceManifestHeadSha: "c94edbcf5135ee717ac64d9da5db05c09e076c22"',
            'allowLegacyVisualReferenceAsCurrentCanon: false',
            'supersededCharacterReferencePullRequests: [589]',
          ];
          for (const needle of required) {
            if (!source.includes(needle)) throw new Error(`voxy_final_canon_binding_missing:${needle}`);
          }
          NODE

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm -C apps/web exec playwright install chromium

      - name: Install system FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Run focused contract tests
        run: |
          pnpm -C apps/web exec vitest run \
            tests/voxy-final-canon-hand-visibility.contract.test.ts \
            tests/voxy-visual-detector-license-contract.test.ts \
            tests/voxy-visual-qa-checkpoint.contract.test.ts \
            tests/voxy-visual-qa-review-decision-bridge.contract.test.ts \
            tests/voxy-visual-qa-human-review-command.contract.test.ts \
            tests/voxy-final-canon-lock.contract.test.ts

      - name: Seed detector and negative-fixture evidence
        env:
          VOXY_EVIDENCE_COMMIT_SHA: ${{ env.VOXY_QA_INTEGRATION_SHA }}
        run: pnpm -w exec tsx apps/web/scripts/capture-voxy-200pct-evidence.ts --output=artifacts/voxy-200pct-visual-qa

      - name: Replace human review surfaces with V3.10.5 final-canon renderer
        env:
          VOXY_EVIDENCE_COMMIT_SHA: ${{ env.VOXY_QA_INTEGRATION_SHA }}
        run: pnpm -w exec tsx apps/web/scripts/render-voxy-final-canon-review-surfaces.ts --output=artifacts/voxy-200pct-visual-qa --bind-evidence=true

      - name: Bind final-canon hand visibility and social-layout occlusion
        run: pnpm -w exec tsx apps/web/scripts/bind-voxy-final-canon-hand-visibility.ts --output=artifacts/voxy-200pct-visual-qa

      - name: Render V3.10.5 canonical compositing proof
        run: pnpm -w exec tsx apps/web/scripts/render-voxy-head-alpha-compositing-proofs.ts --output=/tmp/voxy-v3-10-5-proof

      - name: Bind V3.10.5 proof into review artifact
        run: |
          mkdir -p artifacts/voxy-200pct-visual-qa/v3-10-5-proof
          cp -R /tmp/voxy-v3-10-5-proof/. artifacts/voxy-200pct-visual-qa/v3-10-5-proof/

      - name: Verify final human evidence is production-renderer canon
        env:
          VOXY_EVIDENCE_COMMIT_SHA: ${{ env.VOXY_QA_INTEGRATION_SHA }}
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('artifacts/voxy-200pct-visual-qa/evidence-manifest.json','utf8'));
          const review = JSON.parse(fs.readFileSync('artifacts/voxy-200pct-visual-qa/final-canon-review-manifest.json','utf8'));
          const visibilityVersion = 'voxy-final-canon-hand-visibility-v1';
          const validClaspedHandQa = (value) => Boolean(
            value &&
            value.pose === 'clasped_hands_not_open_palm' &&
            value.detector588Applicable === false &&
            value.detector588Status === 'not_run_not_applicable' &&
            value.expectedFingerCountPerHand === 5 &&
            value.thresholdChanged === false &&
            value.generativeReconstructionUsed === false
          );
          const expectedHandVisibility = (format) => format === '9:16'
            ? { visible: false, reason: 'occluded_by_social_evidence_region', source: 'motion_v4_clasped_hand_location_layout_occluded' }
            : { visible: true, reason: 'visible_on_final_surface', source: 'motion_v4_clasped_hand_master_geometry_unclamped' };

          if (manifest.commitSha !== process.env.VOXY_EVIDENCE_COMMIT_SHA) throw new Error('evidence_integration_sha_mismatch');
          if (manifest.humanReview.status !== 'pending') throw new Error('human_review_must_remain_pending');
          if (manifest.humanReview.approvedCommitSha !== null) throw new Error('self_approval_forbidden');
          if (manifest.formats.length !== 3) throw new Error('three_formats_required');
          if (!manifest.validation.requiredDecisionGateId) throw new Error('revision_bound_human_gate_missing');
          if (manifest.validation.automatedPassed !== true) throw new Error('automated_visual_qa_must_pass_before_human_review');
          if (manifest.validation.productionEligible !== false) throw new Error('human_gate_must_block_production');
          if (manifest.handVisibility?.schemaVersion !== visibilityVersion) throw new Error('hand_visibility_contract_missing');
          if (!validClaspedHandQa(manifest.handVisibility?.handQa)) throw new Error('hand_visibility_clasped_hand_qa_missing');

          if (review.schemaVersion !== 'voxy-v3-10-5-final-canon-review-surfaces-v1') throw new Error('final_canon_review_manifest_schema_mismatch');
          if (review.exactHeadSha !== process.env.VOXY_EVIDENCE_COMMIT_SHA) throw new Error('final_canon_review_head_mismatch');
          if (review.canon?.canonId !== 'VOXY-V3.10.5-HUMAN-FINAL') throw new Error('final_canon_review_id_mismatch');
          if (review.canon?.sourcePullRequest !== 624) throw new Error('final_canon_review_source_pr_mismatch');
          if (!validClaspedHandQa(review.handQa)) throw new Error('final_canon_clasped_hand_qa_missing');
          if (review.handVisibility?.schemaVersion !== visibilityVersion) throw new Error('final_canon_hand_visibility_missing');
          if (!validClaspedHandQa(review.handVisibility?.handQa)) throw new Error('final_canon_hand_visibility_qa_missing');
          if (review.surfaces?.length !== 6) throw new Error('both_brands_three_formats_required');
          if (!review.surfaces.every((surface) => surface.canonicalAlphaCompositing === true)) throw new Error('canonical_alpha_surface_missing');
          if (!review.surfaces.every((surface) => surface.canonicalHeadLayer === 'canonical-alpha-head')) throw new Error('canonical_head_layer_missing');
          if (!review.surfaces.every((surface) => surface.canonicalHeadOutsideContribution === '0')) throw new Error('canonical_head_outside_contribution_must_be_zero');
          if (!review.surfaces.every((surface) => surface.canonicalBodyLayerCount >= 1 && surface.legacyNeckPlateCount === 0)) throw new Error('canonical_body_or_legacy_neck_gate_failed');
          if (!review.surfaces.every((surface) => validClaspedHandQa(surface.handQa))) throw new Error('surface_clasped_hand_qa_drift');
          for (const surface of review.surfaces) {
            const expected = expectedHandVisibility(surface.format);
            if (surface.handVisibility?.version !== visibilityVersion) throw new Error(`surface_hand_visibility_missing:${surface.filmId}:${surface.format}`);
            if (surface.handVisibility?.leftVisible !== expected.visible || surface.handVisibility?.rightVisible !== expected.visible) throw new Error(`surface_hand_visibility_mismatch:${surface.filmId}:${surface.format}`);
            if (surface.handVisibility?.reason !== expected.reason) throw new Error(`surface_hand_visibility_reason_mismatch:${surface.filmId}:${surface.format}`);
          }

          if (manifest.semanticRegionBinding?.version !== 'voxy-semantic-region-binding-v2-production') throw new Error('production_semantic_region_binding_missing');
          if (manifest.semanticRegionBinding?.commitSha !== process.env.VOXY_EVIDENCE_COMMIT_SHA) throw new Error('semantic_region_binding_revision_mismatch');
          if (!validClaspedHandQa(manifest.semanticRegionBinding?.handQa)) throw new Error('semantic_region_clasped_hand_qa_missing');
          if (!Array.isArray(manifest.semanticRegionBinding?.bindings) || manifest.semanticRegionBinding.bindings.length !== 30) throw new Error('production_semantic_region_bindings_incomplete');
          for (const format of ['16:9','9:16','1:1']) {
            const expectedVisibility = expectedHandVisibility(format);
            if (manifest.semanticRegionBinding?.microphoneApplicability?.[format] !== true) throw new Error(`microphone_semantics_missing:${format}`);
            const visibility = manifest.semanticRegionBinding?.handVisibility?.[format];
            if (visibility?.version !== visibilityVersion || visibility.leftVisible !== expectedVisibility.visible || visibility.rightVisible !== expectedVisibility.visible || visibility.reason !== expectedVisibility.reason) throw new Error(`semantic_hand_visibility_invalid:${format}`);
            for (const region of ['left_hand','right_hand']) {
              const binding = manifest.semanticRegionBinding.bindings.find((entry) => entry.format === format && entry.region === region);
              if (!binding || binding.source !== expectedVisibility.source) throw new Error(`clasped_hand_region_binding_invalid:${format}:${region}`);
              if (binding.visibility !== expectedVisibility.visible || binding.visibilityReason !== expectedVisibility.reason) throw new Error(`clasped_hand_region_visibility_invalid:${format}:${region}`);
            }
          }

          if (manifest.canonicalSurfaceBinding?.canonId !== 'VOXY-V3.10.5-HUMAN-FINAL') throw new Error('canonical_surface_binding_missing');
          if (manifest.canonicalSurfaceBinding?.sourcePullRequest !== 624) throw new Error('canonical_surface_pr_mismatch');
          if (manifest.canonicalSurfaceBinding?.cleanStudioRequired !== true) throw new Error('canonical_clean_studio_not_required');
          if (!validClaspedHandQa(manifest.canonicalSurfaceBinding?.handQa)) throw new Error('canonical_surface_clasped_hand_qa_missing');
          if (manifest.canonicalSurfaceBinding?.surfaces?.length !== 3) throw new Error('canonical_edebatte_surface_count_mismatch');

          const expectedDimensions = {
            '16:9': [1920,1080],
            '9:16': [1080,1920],
            '1:1': [1080,1080],
          };
          for (const snapshot of manifest.checkpoint.snapshots) {
            const expected = expectedDimensions[snapshot.format];
            const expectedVisibility = expectedHandVisibility(snapshot.format);
            if (!expected || snapshot.width !== expected[0] || snapshot.height !== expected[1]) throw new Error(`production_surface_dimensions_mismatch:${snapshot.format}`);
            if (!snapshot.assetVersion.includes('VOXY-V3.10.5-HUMAN-FINAL')) throw new Error(`production_surface_asset_version_mismatch:${snapshot.format}`);
            const pose = snapshot.poses?.[0];
            if (pose?.poseId !== 'v3_10_5_canonical_alpha_host') throw new Error(`production_surface_pose_mismatch:${snapshot.format}`);
            if (expectedVisibility.visible) {
              if (pose?.handCheckMode !== 'canonical_clasped_occlusion') throw new Error(`production_hand_check_mode_mismatch:${snapshot.format}`);
              if (!validClaspedHandQa(pose?.canonicalClaspedHandContract)) throw new Error(`production_clasped_hand_contract_mismatch:${snapshot.format}`);
              if (pose?.leftHandVisible !== true || pose?.rightHandVisible !== true) throw new Error(`production_clasped_hand_visibility_mismatch:${snapshot.format}`);
            } else {
              if (pose?.handCheckMode != null || pose?.canonicalClaspedHandContract != null) throw new Error(`occluded_hand_must_not_claim_visible_pose_contract:${snapshot.format}`);
              if (pose?.leftHandVisible !== false || pose?.rightHandVisible !== false) throw new Error(`occluded_hand_visibility_mismatch:${snapshot.format}`);
            }
            if (pose?.leftFingerCount !== null || pose?.rightFingerCount !== null) throw new Error(`fabricated_clasped_finger_count:${snapshot.format}`);
            if (pose?.leftHandDetection !== null || pose?.rightHandDetection !== null) throw new Error(`fabricated_clasped_hand_detection:${snapshot.format}`);
            const leftRegion = snapshot.regions.find((entry) => entry.region === 'left_hand');
            const rightRegion = snapshot.regions.find((entry) => entry.region === 'right_hand');
            const expectedNote = expectedVisibility.visible
              ? 'hand_visibility:visible_final_surface_canonical_clasped_pose'
              : 'hand_visibility:layout_occluded_by_social_evidence_region_not_anatomy_crop';
            if (!leftRegion?.notes?.includes(expectedNote) || !rightRegion?.notes?.includes(expectedNote)) throw new Error(`hand_visibility_review_note_missing:${snapshot.format}`);
          }

          const serialized = JSON.stringify(manifest);
          if (serialized.includes('voxy-standing-master.svg') || serialized.includes('"poseId":"standing_master"')) throw new Error('legacy_standing_master_leaked_into_human_evidence');
          if (manifest.negativeFixture?.source !== 'v3_10_5_final_canon_surface') throw new Error('negative_fixture_not_canon_derived');
          if (!manifest.negativeFixture?.sha256) throw new Error('negative_render_fixture_missing');
          if (manifest.negativeFixture.actualCrop !== true) throw new Error('negative_fixture_real_crop_not_observed');
          if (!String(manifest.negativeFixture.computedFilter).includes('blur')) throw new Error('negative_fixture_real_blur_not_observed');
          if (manifest.negativeFixture.mustNeverBeApproved !== true) throw new Error('negative_fixture_guard_missing');

          if (manifest.detector?.id !== 'voxy_raster_silhouette_hand_landmarker') throw new Error('local_hand_detector_missing');
          if (manifest.detector?.externalServiceRequired !== false) throw new Error('external_detector_forbidden');
          if (manifest.detector?.runtimeNetworkRequired !== false) throw new Error('detector_network_forbidden');
          if (!/^[a-f0-9]{64}$/.test(manifest.detector?.modelSha256 || '')) throw new Error('detector_model_hash_missing');
          if (manifest.detectorRotationFixtures?.length !== 4) throw new Error('rotated_positive_png_fixtures_missing');
          if (!manifest.detectorRotationFixtures.every((fixture) => fixture.detection?.fingerCount === 5 && fixture.detection?.normalizationApplied === true)) throw new Error('rotated_positive_png_fixture_not_normalized');
          if (manifest.detectorNegativeFixtures?.length !== 4) throw new Error('detector_negative_fixtures_missing');
          if (!manifest.detectorNegativeFixtures.every((fixture) => fixture.mustNeverBeApproved === true)) throw new Error('detector_negative_fixture_guard_missing');

          const proof = JSON.parse(fs.readFileSync('artifacts/voxy-200pct-visual-qa/v3-10-5-proof/head-alpha-proof-manifest.json','utf8'));
          if (proof.schemaVersion !== 'voxy-homepage-root-cause-compositing-proof-v3-10-5') throw new Error('v3_10_5_compositor_proof_schema_mismatch');
          if (proof.exactHeadSha !== process.env.VOXY_EVIDENCE_COMMIT_SHA) throw new Error('v3_10_5_compositor_proof_revision_mismatch');
          NODE

      - name: Typecheck
        run: pnpm -C apps/web run typecheck

      - name: Diff check
        run: git diff --check

      - name: Upload revision-bound review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: voxy-200pct-visual-qa-integration-${{ env.VOXY_QA_INTEGRATION_SHA }}
          path: artifacts/voxy-200pct-visual-qa/**
          if-no-files-found: error
          retention-days: 14
