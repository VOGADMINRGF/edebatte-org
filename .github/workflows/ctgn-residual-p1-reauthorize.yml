name: CTGN residual P1 diagnostic

on:
  push:
    branches:
      - docs/ctgn-residual-p1-reauthorization-01

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/ctgn-residual-p1-reauthorization-01
      - name: Capture current repair rows and preflights
        shell: bash
        run: |
          set -u
          OUT=ctgn-residual-p1-diagnostic.txt
          : > "$OUT"
          printf 'main=%s\n' "$(git rev-parse origin/main 2>/dev/null || true)" >> "$OUT"
          grep -n '^| NEWSLETTER-DELIVERY-SEND-TIME-SAFETY-01 |' docs/E150/OpenTasks.md >> "$OUT" || true
          grep -n '^| DOSSIER-REVISION-ATOMIC-WRITER-01 |' docs/E150/OpenTasks.md >> "$OUT" || true
          printf '\nnewsletter preflight:\n' >> "$OUT"
          node scripts/codex-task-preflight.mjs NEWSLETTER-DELIVERY-SEND-TIME-SAFETY-01 >> "$OUT" 2>&1 || true
          printf '\ndossier preflight:\n' >> "$OUT"
          node scripts/codex-task-preflight.mjs DOSSIER-REVISION-ATOMIC-WRITER-01 >> "$OUT" 2>&1 || true
          git config user.name 'VOGADMINRGF'
          git config user.email 'rgf@voiceopengov.de'
          git add "$OUT"
          git commit -m 'chore(governance): capture residual P1 diagnostic'
          git push origin HEAD:docs/ctgn-residual-p1-reauthorization-01
