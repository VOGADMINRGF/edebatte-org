name: Voxy review consistency Slice C product writer

on:
  push:
    branches:
      - ops/voxy-review-consistency-c-preflight-01

permissions:
  contents: write

jobs:
  preflight-and-build-slice-c:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Exact task preflight on current main
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          node scripts/codex-task-preflight.mjs VOXY-STUDIO-REVIEW-CONSISTENCY-01 | tee /tmp/preflight.json
          grep -q '"status": "codex_ready"' /tmp/preflight.json
          grep -q '"executable": true' /tmp/preflight.json
          grep -q '"branchCreationAllowed": true' /tmp/preflight.json

      - name: Create bounded Slice C product branch
        shell: bash
        run: |
          set -euo pipefail
          git switch -c fix/voxy-studio-review-consistency-c-01

      - name: Wire critical Voxy contracts and repair stale locale test oracle
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          workflow = Path(".github/workflows/voxy-local-composition-runtime.yml")
          text = workflow.read_text(encoding="utf-8")

          replacements = [
              (
                  '      - "apps/web/src/features/voxyVideo/editorialCompositionHtml.ts"\n      - "apps/web/src/features/voxyVideo/editorialRenderEvidence.ts"',
                  '      - "apps/web/src/features/voxyVideo/editorialCompositionHtml.ts"\n      - "apps/web/src/features/voxyVideo/editorialEvidenceWindow.ts"\n      - "apps/web/src/features/voxyVideo/editorialRenderEvidence.ts"',
              ),
              (
                  '      - "apps/web/src/features/voxyVideo/studioDossierEvidenceAuthority.ts"\n      - "apps/web/src/features/voxyVideo/studioLayoutSafety.ts"',
                  '      - "apps/web/src/features/voxyVideo/studioDossierEvidenceAuthority.ts"\n      - "apps/web/src/features/voxyVideo/studioEvidenceReview.ts"\n      - "apps/web/src/features/voxyVideo/studioLayoutSafety.ts"',
              ),
              (
                  '      - "apps/web/src/features/voxyVideo/studioProductionContext.ts"\n      - "apps/web/src/features/voxyVideo/studioRenderBindingGuard.ts"',
                  '      - "apps/web/src/features/voxyVideo/studioProductionContext.ts"\n      - "apps/web/src/features/voxyVideo/studioPreviewReview.ts"\n      - "apps/web/src/features/voxyVideo/studioRenderBindingGuard.ts"',
              ),
              (
                  '      - "apps/web/tests/voxy-editorial-composition-html.contract.test.ts"\n      - "apps/web/tests/voxy-editorial-agent-council.contract.test.ts"',
                  '      - "apps/web/tests/voxy-editorial-composition-html.contract.test.ts"\n      - "apps/web/tests/voxy-editorial-evidence-window.contract.test.ts"\n      - "apps/web/tests/voxy-editorial-story-plan.contract.test.ts"\n      - "apps/web/tests/voxy-editorial-agent-council.contract.test.ts"',
              ),
              (
                  '      - "apps/web/tests/voxy-studio-draft-service.contract.test.ts"\n      - "apps/web/tests/voxy-studio-frame-preview.contract.test.ts"',
                  '      - "apps/web/tests/voxy-studio-draft-service.contract.test.ts"\n      - "apps/web/tests/voxy-studio-evidence-review.contract.test.ts"\n      - "apps/web/tests/voxy-studio-frame-preview.contract.test.ts"',
              ),
              (
                  '      - "apps/web/tests/voxy-studio-persistence-boundary.contract.test.ts"\n      - "apps/web/tests/voxy-studio-production-context.contract.test.ts"',
                  '      - "apps/web/tests/voxy-studio-persistence-boundary.contract.test.ts"\n      - "apps/web/tests/voxy-studio-preview-review.contract.test.ts"\n      - "apps/web/tests/voxy-studio-production-context.contract.test.ts"',
              ),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit(f"workflow anchor drift: {old!r}")
              text = text.replace(old, new, 1)

          old_cmd = '          pnpm -C apps/web exec vitest run tests/voxy-editorial-audio-motion.contract.test.ts tests/voxy-editorial-composition-html.contract.test.ts tests/voxy-studio-admin-auth.contract.test.ts tests/voxy-studio-audio-motion-preview.contract.test.ts tests/voxy-studio-dossier-auto-intake.contract.test.ts tests/voxy-studio-draft-service.contract.test.ts tests/voxy-studio-frame-preview.contract.test.ts tests/voxy-studio-immutable-render-binding.contract.test.ts tests/voxy-studio-layout-approval.contract.test.ts tests/voxy-studio-layout-safety.contract.test.ts tests/voxy-studio-locale-review-matrix.contract.test.ts tests/voxy-studio-operator-edit.contract.test.ts tests/voxy-studio-persistence-boundary.contract.test.ts tests/voxy-studio-production-context.contract.test.ts tests/voxy-studio-render-handoff.contract.test.ts tests/voxy-editorial-agent-council.contract.test.ts tests/voxy-editorial-agent-learning.contract.test.ts'
          new_cmd = '          pnpm -C apps/web exec vitest run tests/voxy-editorial-audio-motion.contract.test.ts tests/voxy-editorial-composition-html.contract.test.ts tests/voxy-editorial-evidence-window.contract.test.ts tests/voxy-editorial-story-plan.contract.test.ts tests/voxy-studio-admin-auth.contract.test.ts tests/voxy-studio-audio-motion-preview.contract.test.ts tests/voxy-studio-dossier-auto-intake.contract.test.ts tests/voxy-studio-draft-service.contract.test.ts tests/voxy-studio-evidence-review.contract.test.ts tests/voxy-studio-frame-preview.contract.test.ts tests/voxy-studio-immutable-render-binding.contract.test.ts tests/voxy-studio-layout-approval.contract.test.ts tests/voxy-studio-layout-safety.contract.test.ts tests/voxy-studio-locale-review-matrix.contract.test.ts tests/voxy-studio-operator-edit.contract.test.ts tests/voxy-studio-persistence-boundary.contract.test.ts tests/voxy-studio-preview-review.contract.test.ts tests/voxy-studio-production-context.contract.test.ts tests/voxy-studio-render-handoff.contract.test.ts tests/voxy-editorial-agent-council.contract.test.ts tests/voxy-editorial-agent-learning.contract.test.ts'
          if text.count(old_cmd) != 1:
              raise SystemExit("contract command anchor drift")
          workflow.write_text(text.replace(old_cmd, new_cmd, 1), encoding="utf-8")

          test = Path("apps/web/tests/voxy-editorial-story-plan.contract.test.ts")
          test_text = test.read_text(encoding="utf-8")
          stale = '''    expect(VOXY_EDITORIAL_SUPPORTED_LOCALES).toEqual([\n      "de",\n      "en",\n      "fr",\n      "pl",\n      "es",\n      "it",\n      "tr",\n      "ar",\n      "ru",\n      "zh",\n      "nl",\n      "pt",\n      "fi",\n      "sv",\n      "no",\n      "cs",\n      "hi",\n      "ro",\n      "el",\n      "uk",\n    ]);\n'''
          if test_text.count(stale) != 1:
              raise SystemExit("stale 20-locale oracle not found exactly once")
          test_text = test_text.replace(stale, "", 1)
          if 'expect(VOXY_EDITORIAL_SUPPORTED_LOCALES).toEqual(SUPPORTED_LOCALES);' not in test_text:
              raise SystemExit("canonical locale SSOT assertion missing")
          test.write_text(test_text, encoding="utf-8")
          PY
          git diff --check

      - name: Install and verify bounded Slice C
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm -C apps/web exec vitest run \
            tests/voxy-studio-preview-review.contract.test.ts \
            tests/voxy-studio-evidence-review.contract.test.ts \
            tests/voxy-editorial-story-plan.contract.test.ts \
            tests/voxy-editorial-evidence-window.contract.test.ts
          pnpm -C apps/web run typecheck
          git diff --check

      - name: Commit and push product branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            .github/workflows/voxy-local-composition-runtime.yml \
            apps/web/tests/voxy-editorial-story-plan.contract.test.ts
          git commit -m "ci(voxy): cover critical review contracts"
          git push origin HEAD:fix/voxy-studio-review-consistency-c-01
