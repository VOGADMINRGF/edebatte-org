name: apply-create-ssr-performance-01

on:
  push:
    branches:
      - perf/create-ssr-performance-01

permissions:
  contents: write

concurrency:
  group: create-ssr-performance-01
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout product branch
        uses: actions/checkout@v4
        with:
          ref: perf/create-ssr-performance-01
          fetch-depth: 0

      - name: Guard authorized base and temporary-only delta
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git merge-base HEAD origin/main)" = "eec9f6e56b52936d3548268864d847411eb605a9"
          git diff --name-only origin/main...HEAD | sort > /tmp/actual-before
          printf '%s\n' \
            '.github/scripts/apply-create-ssr-performance-01.py' \
            '.github/workflows/apply-create-ssr-performance-01.yml' \
            | sort > /tmp/expected-before
          diff -u /tmp/expected-before /tmp/actual-before

      - name: Apply bounded Create SSR patch
        run: python3 .github/scripts/apply-create-ssr-performance-01.py

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Focused Create SSR contracts
        run: >-
          pnpm -C apps/web exec vitest run
          tests/create-ssr-performance.contract.test.ts
          tests/no-internal-query-leak-in-create-ui.test.ts
          tests/runden-context-human-readable-only.test.ts

      - name: Current Create page bootstrap smoke
        run: >-
          pnpm -C apps/web exec vitest run
          tests/create-mode.page.test.ts
          -t "does not leak raw query intent/source flags into visible UI"

      - name: Typecheck
        run: pnpm -C apps/web run typecheck

      - name: Restore generated Prisma artifacts
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=origin/main --worktree -- \
            packages/db-web/src/generated/edge.js \
            packages/db-web/src/generated/index.js \
            packages/db-web/src/generated/wasm.js

      - name: Repository integrity
        run: node scripts/ci/check-repository-integrity-guards.mjs --base origin/main

      - name: Diff check
        run: git diff --check

      - name: Guard product scope
        shell: bash
        run: |
          set -euo pipefail
          {
            git diff --name-only origin/main
            git ls-files --others --exclude-standard
          } \
            | grep -v -E '^\.github/(scripts/apply-create-ssr-performance-01\.py|workflows/apply-create-ssr-performance-01\.yml)$' \
            | sort -u > /tmp/actual
          printf '%s\n' \
            'apps/web/src/app/create/CreateClient.tsx' \
            'apps/web/src/app/create/page.tsx' \
            'apps/web/src/lib/server/entitlements/createEntitlements.ts' \
            'apps/web/tests/create-mode.page.test.ts' \
            'apps/web/tests/create-ssr-performance.contract.test.ts' \
            'apps/web/tests/no-duplicate-primary-worksurface-on-create.test.ts' \
            'apps/web/tests/no-internal-query-leak-in-create-ui.test.ts' \
            'apps/web/tests/runden-context-human-readable-only.test.ts' \
            'features/account/service.ts' \
            'features/account/types.ts' \
            | sort > /tmp/expected
          diff -u /tmp/expected /tmp/actual

      - name: Commit product slice and self-delete helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm \
            .github/scripts/apply-create-ssr-performance-01.py \
            .github/workflows/apply-create-ssr-performance-01.yml
          git add \
            features/account/types.ts \
            features/account/service.ts \
            apps/web/src/lib/server/entitlements/createEntitlements.ts \
            apps/web/src/app/create/page.tsx \
            apps/web/src/app/create/CreateClient.tsx \
            apps/web/tests/create-mode.page.test.ts \
            apps/web/tests/no-duplicate-primary-worksurface-on-create.test.ts \
            apps/web/tests/no-internal-query-leak-in-create-ui.test.ts \
            apps/web/tests/runden-context-human-readable-only.test.ts \
            apps/web/tests/create-ssr-performance.contract.test.ts
          git commit -m 'perf(create): slim authenticated SSR account context'
          git push origin HEAD:perf/create-ssr-performance-01
