name: Newsletter closeout delta 02

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Implement F3 F1 F4 on existing newsletter owners
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected exactly one anchor, got {count}")
              return text.replace(old, new, 1)

          runtime_path = Path('apps/web/src/features/newsletter/newsletterRuntime.ts')
          runtime = runtime_path.read_text()
          runtime = replace_once(
              runtime,
              'import { coreCol, getCol } from "@core/db/triMongo";',
              'import { coreCol, getCol, getDb } from "@core/db/triMongo";',
              'newsletter runtime getDb import',
          )
          runtime = replace_once(
              runtime,
              '''  dossierId?: string | null;\n  sourceCreatedByUserId?: string | null;\n};''',
              '''  dossierId?: string | null;\n  sourceCreatedByUserId?: string | null;\n  sourceDistributionPostId?: string | null;\n  sourceRevisionHash?: string | null;\n};''',
              'candidate source binding fields',
          )
          runtime = replace_once(
              runtime,
              '''type SubscriberDoc = {\n  email: string;''',
              '''type SubscriberDoc = {\n  _id?: ObjectId | string;\n  email: string;''',
              'subscriber id',
          )
          runtime = replace_once(
              runtime,
              '''  lastCandidateIds?: string[] | null;\n  updatedAt?: Date | null;\n};''',
              '''  lastCandidateIds?: string[] | null;\n  lastDeliveryBoundaryAt?: Date | null;\n  updatedAt?: Date | null;\n};''',
              'subscriber handoff boundary field',
          )
          runtime = replace_once(
              runtime,
              '''type SocialDistributionPostDoc = {\n  _id?: string;''',
              '''type SocialDistributionPostDoc = {\n  _id?: string;\n  lastNewsletterDeliveryBoundaryAt?: Date | null;''',
              'social boundary field',
          )

          safe_date_anchor = '''function safeDate(value: unknown): Date | null {\n  if (value instanceof Date && !Number.isNaN(value.getTime())) return value;\n  if (typeof value !== "string") return null;\n  const date = new Date(value);\n  return Number.isNaN(date.getTime()) ? null : date;\n}\n'''
          safety_helpers = safe_date_anchor + '''\nfunction newsletterSourceRevisionHash(doc: SocialDistributionPostDoc) {\n  const post = doc.post;\n  return digest(\n    JSON.stringify({\n      id: normalize(post?.id) ?? normalize(doc._id),\n      status: normalize(post?.status),\n      publicBrand: normalize(post?.publicBrand),\n      sourceState: normalize(post?.sourceState),\n      title: normalize(post?.title),\n      channels: post?.channels ?? [],\n      newsletterText: normalize(post?.channelTexts?.newsletter_draft),\n      newsletterNote: normalize(post?.channelNotes?.newsletter_draft),\n      newsletterAssets: (post?.assets ?? [])\n        .filter((entry) => entry.kind === "newsletter_draft" || entry.channel === "newsletter_draft")\n        .map((entry) => ({\n          kind: normalize(entry.kind),\n          channel: normalize(entry.channel),\n          href: normalize(entry.href),\n          text: normalize(entry.text),\n          verificationLabel: normalize(entry.verificationLabel),\n        })),\n      approval: post?.approval ?? null,\n      sourceSummary: normalize(post?.sourceSummary),\n      limitations: post?.limitations ?? [],\n      noAutoPublish: post?.noAutoPublish === true,\n      noAutoPublicationApproved: post?.noAutoPublicationApproved === true,\n      postUpdatedAt: safeDate(post?.updatedAt)?.toISOString() ?? null,\n      documentUpdatedAt: safeDate(doc.updatedAt)?.toISOString() ?? null,\n    }),\n  );\n}\n\nfunction isNewsletterSourceEligible(doc: SocialDistributionPostDoc, now: Date) {\n  const post = doc.post;\n  if (!post) return false;\n  if (!(post.channels ?? []).includes("newsletter_draft")) return false;\n  if (!APPROVED_SOCIAL_STATUSES.has(String(post.status ?? ""))) return false;\n  if (post.publicBrand && post.publicBrand !== "edebatte") return false;\n  if (post.sourceState !== "approved_context") return false;\n  if (post.noAutoPublish !== true || post.noAutoPublicationApproved !== true) return false;\n  if (post.approval?.reviewRequired !== false && !post.approval?.approvedAt) return false;\n  if (!normalize(post.title)) return false;\n  const newsletterAsset = post.assets?.find(\n    (entry) => entry.kind === "newsletter_draft" || entry.channel === "newsletter_draft",\n  );\n  if (!(normalize(post.channelTexts?.newsletter_draft) ?? normalize(newsletterAsset?.text) ?? normalize(post.sourceSummary))) {\n    return false;\n  }\n  const maxAgeDays = Math.max(1, Math.min(90, Number(process.env.NEWSLETTER_CANDIDATE_MAX_AGE_DAYS || 21)));\n  const cutoff = now.getTime() - maxAgeDays * 24 * 60 * 60 * 1000;\n  const updatedAt = safeDate(post.updatedAt) ?? safeDate(doc.updatedAt);\n  return !updatedAt || updatedAt.getTime() >= cutoff;\n}\n\nfunction subscriberDeliveryFingerprint(subscriber: SubscriberDoc) {\n  return digest(\n    JSON.stringify({\n      email: subscriber.email.trim().toLowerCase(),\n      userId: subscriber.userId ?? null,\n      status: subscriber.status,\n      consentVersion: subscriber.consentVersion,\n      locale: subscriber.locale ?? null,\n      audienceTier: subscriber.audienceTier ?? null,\n      preferences: subscriber.preferences ?? null,\n      preferenceCenter: subscriber.preferenceCenter ?? null,\n      confirmedAt: safeDate(subscriber.confirmedAt)?.toISOString() ?? null,\n      updatedAt: safeDate(subscriber.updatedAt)?.toISOString() ?? null,\n    }),\n  );\n}\n'''
          runtime = replace_once(runtime, safe_date_anchor, safety_helpers, 'newsletter safety helpers')

          eligible_pattern = re.compile(
              r'''  const eligibleDocs = docs\.filter\(\(doc\) => \{.*?\n  \}\);\n\n  const dossierIds''',
              re.S,
          )
          matches = list(eligible_pattern.finditer(runtime))
          if len(matches) != 1:
              raise SystemExit(f'eligible filter: expected one block, got {len(matches)}')
          runtime = eligible_pattern.sub(
              '  const eligibleDocs = docs.filter((doc) => isNewsletterSourceEligible(doc, now));\n\n  const dossierIds',
              runtime,
              count=1,
          )
          runtime = replace_once(
              runtime,
              '''      dossierId,\n      sourceCreatedByUserId: normalize(post.createdByUserId),''',
              '''      dossierId,\n      sourceCreatedByUserId: normalize(post.createdByUserId),\n      sourceDistributionPostId: normalize(doc._id) ?? id,\n      sourceRevisionHash: newsletterSourceRevisionHash(doc),''',
              'candidate binding assignment',
          )

          reservation_anchor = '''function mailResultFailure(result: SendMailResult) {\n  return result.ok\n    ? null\n    : {\n        category: result.category,\n        retryable: result.retryable,\n      };\n}\n'''
          reservation_code = reservation_anchor + '''\ntype NewsletterHandoffReservation =\n  | { ok: true; subscriber: SubscriberDoc }\n  | { ok: false; status: "blocked" | "skipped"; reason: string };\n\nclass NewsletterHandoffAbort extends Error {\n  constructor(readonly result: Exclude<NewsletterHandoffReservation, { ok: true }>) {\n    super(`newsletter_handoff_abort:${result.reason}`);\n  }\n}\n\nasync function reserveNewsletterExternalHandoff(input: {\n  subscriber: SubscriberDoc;\n  subscriberFingerprint: string;\n  candidates: NewsletterDigestCandidate[];\n  candidateIds: string[];\n  ledger: Awaited<ReturnType<typeof ensureDeliveryIndexes>>;\n  deliveryId: string;\n  preview: NewsletterDigestPreview;\n  now: Date;\n}): Promise<NewsletterHandoffReservation> {\n  const selected = input.candidateIds.map((candidateId) =>\n    input.candidates.find((candidate) => candidate.id === candidateId),\n  );\n  if (\n    selected.some(\n      (candidate) =>\n        !candidate?.sourceDistributionPostId || !candidate?.sourceRevisionHash,\n    )\n  ) {\n    return { ok: false, status: "blocked", reason: "candidate_state_unavailable" };\n  }\n\n  const db = await getDb("core");\n  const client = (db as any)?.client;\n  if (!client?.startSession) {\n    return { ok: false, status: "blocked", reason: "handoff_transaction_unavailable" };\n  }\n\n  const session = client.startSession();\n  let reservedSubscriber: SubscriberDoc | null = null;\n  try {\n    await session.withTransaction(async () => {\n      const subscribers = await coreCol<SubscriberDoc>(SUBSCRIBERS_COLLECTION);\n      const sources = await coreCol<SocialDistributionPostDoc>(SOCIAL_POSTS_COLLECTION);\n      const email = input.subscriber.email.trim().toLowerCase();\n      const canonicalSubscriber = input.subscriber.userId\n        ? await subscribers.findOne({ userId: input.subscriber.userId } as never, { session })\n        : await subscribers.findOne({ email } as never, { session });\n      const currentSubscriber =\n        canonicalSubscriber ??\n        (input.subscriber.userId\n          ? await subscribers.findOne({ email } as never, { session })\n          : null);\n      if (!currentSubscriber) {\n        throw new NewsletterHandoffAbort({ ok: false, status: "blocked", reason: "subscriber_not_found" });\n      }\n      if (subscriberDeliveryFingerprint(currentSubscriber) !== input.subscriberFingerprint) {\n        throw new NewsletterHandoffAbort({ ok: false, status: "skipped", reason: "subscriber_state_changed" });\n      }\n\n      const subscriberSelector = currentSubscriber._id\n        ? { _id: currentSubscriber._id }\n        : currentSubscriber.userId\n          ? { userId: currentSubscriber.userId }\n          : { email: currentSubscriber.email.trim().toLowerCase() };\n      const subscriberBoundary = await subscribers.updateOne(\n        subscriberSelector as never,\n        { $set: { lastDeliveryBoundaryAt: input.now } },\n        { session },\n      );\n      if (subscriberBoundary.matchedCount !== 1) {\n        throw new NewsletterHandoffAbort({ ok: false, status: "skipped", reason: "subscriber_state_changed" });\n      }\n\n      for (const candidate of selected) {\n        const sourceId = candidate!.sourceDistributionPostId!;\n        const source = await sources.findOne({ _id: sourceId } as never, { session });\n        if (\n          !source ||\n          !isNewsletterSourceEligible(source, input.now) ||\n          newsletterSourceRevisionHash(source) !== candidate!.sourceRevisionHash\n        ) {\n          throw new NewsletterHandoffAbort({ ok: false, status: "skipped", reason: "candidate_state_changed" });\n        }\n        const sourceBoundary = await sources.updateOne(\n          { _id: sourceId } as never,\n          { $set: { lastNewsletterDeliveryBoundaryAt: input.now } },\n          { session },\n        );\n        if (sourceBoundary.matchedCount !== 1) {\n          throw new NewsletterHandoffAbort({ ok: false, status: "skipped", reason: "candidate_state_changed" });\n        }\n      }\n\n      const existing = await input.ledger.findOne({ _id: input.deliveryId }, { session });\n      if (existing?.status === "sent") {\n        throw new NewsletterHandoffAbort({ ok: false, status: "skipped", reason: "already_sent" });\n      }\n      if (existing?.status === "sending") {\n        throw new NewsletterHandoffAbort({ ok: false, status: "skipped", reason: "ambiguous_previous_attempt" });\n      }\n      if (existing?.status === "failed" && existing.retryable === false) {\n        throw new NewsletterHandoffAbort({ ok: false, status: "skipped", reason: "non_retryable_previous_failure" });\n      }\n\n      await input.ledger.updateOne(\n        { _id: input.deliveryId },\n        {\n          $setOnInsert: {\n            _id: input.deliveryId,\n            recipientHash: recipientHash(input.preview.email),\n            userId: currentSubscriber.userId ?? null,\n            digestKey: input.preview.digestKey!,\n            candidateIds: input.preview.candidateIds,\n            audienceTier: input.preview.audienceTier,\n            frequency: input.preview.frequency,\n            createdAt: input.now,\n          },\n          $set: {\n            status: "sending",\n            retryable: false,\n            externalAttemptBoundaryAt: input.now,\n            externalAttemptId: crypto.randomUUID(),\n            updatedAt: input.now,\n          },\n          $unset: { failureCategory: "" },\n          $inc: { attemptCount: 1 },\n        },\n        { upsert: true, session },\n      );\n      reservedSubscriber = currentSubscriber;\n    });\n  } catch (error) {\n    if (error instanceof NewsletterHandoffAbort) return error.result;\n    return { ok: false, status: "blocked", reason: "handoff_transaction_failed" };\n  } finally {\n    await session.endSession();\n  }\n\n  return reservedSubscriber\n    ? { ok: true, subscriber: reservedSubscriber }\n    : { ok: false, status: "blocked", reason: "handoff_transaction_failed" };\n}\n'''
          runtime = replace_once(runtime, reservation_anchor, reservation_code, 'handoff reservation helper')

          runtime = replace_once(
              runtime,
              '''  const preview = await buildNewsletterDigestPreviewForSubscriber(currentSubscriber, {\n    now,\n    candidates: options.candidates,\n  });''',
              '''  const candidates = options.candidates ?? await loadNewsletterCandidates(now);\n  const preview = await buildNewsletterDigestPreviewForSubscriber(currentSubscriber, {\n    now,\n    candidates,\n  });''',
              'single candidate snapshot',
          )

          ledger_write_pattern = re.compile(
              r'''\n  await ledger\.updateOne\(\n    \{ _id: id \},\n    \{\n      \$setOnInsert: \{.*?\n    \{ upsert: true \},\n  \);\n''',
              re.S,
          )
          ledger_matches = list(ledger_write_pattern.finditer(runtime))
          if len(ledger_matches) != 1:
              raise SystemExit(f'ledger boundary write: expected one block, got {len(ledger_matches)}')
          reservation_call = '''\n  const reservation = await reserveNewsletterExternalHandoff({\n    subscriber: currentSubscriber,\n    subscriberFingerprint: subscriberDeliveryFingerprint(currentSubscriber),\n    candidates,\n    candidateIds: preview.candidateIds,\n    ledger,\n    deliveryId: id,\n    preview,\n    now,\n  });\n  if (!reservation.ok) {\n    return { ok: reservation.status === "skipped", status: reservation.status, reason: reservation.reason, preview };\n  }\n  currentSubscriber = reservation.subscriber;\n'''
          runtime = ledger_write_pattern.sub(reservation_call, runtime, count=1)
          runtime_path.write_text(runtime)

          adapter_path = Path('features/notifications/newsletterAccountSubscriptionAdapter.ts')
          adapter_path.write_text('''import { coreCol } from "@core/db/triMongo";\n\nconst SUBSCRIBERS_COLLECTION = "public_updates_subscribers";\nconst REQUIRED_CONSENT_VERSION = process.env.UPDATES_CONSENT_VERSION || "updates_v1";\n\ntype CanonicalNewsletterSubscriber = {\n  _id?: unknown;\n  email: string;\n  userId?: string | null;\n  status?: "pending" | "active" | "unsubscribed" | "suppressed" | null;\n  consentVersion?: string | null;\n  unsubscribedAt?: Date | null;\n  updatedAt?: Date | null;\n};\n\nfunction normalizedEmail(value?: string | null) {\n  return String(value ?? "").trim().toLowerCase();\n}\n\nasync function findCanonicalSubscriber(input: { userId: string; email?: string | null }) {\n  const subscribers = await coreCol<CanonicalNewsletterSubscriber>(SUBSCRIBERS_COLLECTION);\n  const byUserId = await subscribers.findOne({ userId: input.userId } as never);\n  if (byUserId) return { subscribers, subscriber: byUserId };\n  const email = normalizedEmail(input.email);\n  if (!email) return { subscribers, subscriber: null };\n  return { subscribers, subscriber: await subscribers.findOne({ email } as never) };\n}\n\nfunction isActiveCanonicalSubscription(subscriber: CanonicalNewsletterSubscriber | null) {\n  return Boolean(\n    subscriber &&\n      subscriber.status === "active" &&\n      subscriber.consentVersion === REQUIRED_CONSENT_VERSION,\n  );\n}\n\nexport async function readCanonicalNewsletterOptIn(input: { userId: string; email?: string | null }) {\n  const { subscriber } = await findCanonicalSubscriber(input);\n  return isActiveCanonicalSubscription(subscriber);\n}\n\nexport async function applyAccountNewsletterPreference(input: {\n  userId: string;\n  email?: string | null;\n  optIn: boolean;\n  now?: Date;\n}) {\n  const { subscribers, subscriber } = await findCanonicalSubscriber(input);\n  const active = isActiveCanonicalSubscription(subscriber);\n\n  if (input.optIn) {\n    return {\n      active,\n      reconfirmationRequired: !active,\n      changed: false,\n    };\n  }\n\n  if (!subscriber || subscriber.status === "suppressed") {\n    return { active: false, reconfirmationRequired: false, changed: false };\n  }\n\n  const now = input.now ?? new Date();\n  const selector = subscriber._id\n    ? { _id: subscriber._id }\n    : { email: normalizedEmail(subscriber.email), status: { $ne: "suppressed" } };\n  const result = await subscribers.updateOne(\n    selector as never,\n    {\n      $set: {\n        status: "unsubscribed",\n        unsubscribedAt: now,\n        updatedAt: now,\n      },\n    },\n  );\n  return { active: false, reconfirmationRequired: false, changed: result.matchedCount === 1 };\n}\n''')

          account_path = Path('features/account/service.ts')
          account = account_path.read_text()
          account = replace_once(
              account,
              'import { loadOptionalAccountData } from "./optionalAccountData";',
              'import { loadOptionalAccountData } from "./optionalAccountData";\nimport { applyAccountNewsletterPreference, readCanonicalNewsletterOptIn } from "@features/notifications/newsletterAccountSubscriptionAdapter";',
              'account canonical newsletter import',
          )
          account = replace_once(
              account,
              '''    factcheckJobs,\n    userScopedRuntimeLinkages,\n  ] = await Promise.all([''',
              '''    factcheckJobs,\n    userScopedRuntimeLinkages,\n    canonicalNewsletterOptIn,\n  ] = await Promise.all([''',
              'account overview destructuring',
          )
          account = replace_once(
              account,
              '''    loadOptionalAccountData({\n      source: "user_scoped_runtime_linkages",\n      fallback: [],\n      load: () => loadAccountUserScopedRuntimeLinkage(accountUserId, 8),\n    }),\n  ]);''',
              '''    loadOptionalAccountData({\n      source: "user_scoped_runtime_linkages",\n      fallback: [],\n      load: () => loadAccountUserScopedRuntimeLinkage(accountUserId, 8),\n    }),\n    loadOptionalAccountData({\n      source: "canonical_newsletter_subscription",\n      fallback: false,\n      load: () => readCanonicalNewsletterOptIn({ userId: accountUserId, email: doc.email ?? null }),\n    }),\n  ]);''',
              'account overview canonical load',
          )
          account = replace_once(
              account,
              '    newsletterOptIn: doc.settings?.newsletterOptIn ?? false,',
              '    newsletterOptIn: canonicalNewsletterOptIn,',
              'account overview canonical projection',
          )
          account = replace_once(
              account,
              '''  if (typeof patch.newsletterOptIn === "boolean") {\n    setOps["settings.newsletterOptIn"] = patch.newsletterOptIn;\n  }''',
              '''  if (typeof patch.newsletterOptIn === "boolean") {\n    const Users = await getCol<UserDoc>("users");\n    const current = await Users.findOne({ _id: oid }, { projection: { email: 1 } });\n    if (!current) return null;\n    const canonical = await applyAccountNewsletterPreference({\n      userId: String(oid),\n      email: current.email ?? null,\n      optIn: patch.newsletterOptIn,\n    });\n    // The legacy settings mirror follows canonical truth. A true toggle may never\n    // reactivate an inactive subscriber without the existing double-opt-in path.\n    setOps["settings.newsletterOptIn"] = canonical.active;\n  }''',
              'account update canonical adapter',
          )
          account_path.write_text(account)
          PY

          cat > apps/web/tests/newsletter-account-subscription-adapter.test.ts <<'EOF'
          import { beforeEach, describe, expect, it, vi } from "vitest";

          const mocks = vi.hoisted(() => ({
            findOne: vi.fn(),
            updateOne: vi.fn(),
          }));

          vi.mock("@core/db/triMongo", () => ({
            coreCol: vi.fn(async () => ({
              findOne: (...args: unknown[]) => mocks.findOne(...args),
              updateOne: (...args: unknown[]) => mocks.updateOne(...args),
            })),
          }));

          import {
            applyAccountNewsletterPreference,
            readCanonicalNewsletterOptIn,
          } from "@features/notifications/newsletterAccountSubscriptionAdapter";

          describe("account newsletter canonical subscription adapter", () => {
            beforeEach(() => {
              vi.clearAllMocks();
              process.env.UPDATES_CONSENT_VERSION = "updates_v1";
              mocks.updateOne.mockResolvedValue({ matchedCount: 1 });
            });

            it("turns account opt-out into a canonical unsubscribe", async () => {
              mocks.findOne.mockResolvedValueOnce({
                _id: "subscriber-1",
                email: "citizen@example.org",
                userId: "user-1",
                status: "active",
                consentVersion: "updates_v1",
              });
              const now = new Date("2026-09-25T15:15:00.000Z");
              const result = await applyAccountNewsletterPreference({
                userId: "user-1",
                email: "citizen@example.org",
                optIn: false,
                now,
              });
              expect(result.active).toBe(false);
              expect(result.changed).toBe(true);
              expect(mocks.updateOne).toHaveBeenCalledWith(
                { _id: "subscriber-1" },
                { $set: { status: "unsubscribed", unsubscribedAt: now, updatedAt: now } },
              );
            });

            it("never reactivates an inactive subscriber from the account toggle", async () => {
              mocks.findOne.mockResolvedValueOnce({
                _id: "subscriber-2",
                email: "citizen@example.org",
                userId: "user-1",
                status: "unsubscribed",
                consentVersion: "updates_v1",
              });
              const result = await applyAccountNewsletterPreference({
                userId: "user-1",
                email: "citizen@example.org",
                optIn: true,
              });
              expect(result).toEqual({ active: false, reconfirmationRequired: true, changed: false });
              expect(mocks.updateOne).not.toHaveBeenCalled();
            });

            it("reads only active current-consent canonical subscriptions as opted in", async () => {
              mocks.findOne.mockResolvedValueOnce({
                email: "citizen@example.org",
                userId: "user-1",
                status: "active",
                consentVersion: "updates_v1",
              });
              await expect(
                readCanonicalNewsletterOptIn({ userId: "user-1", email: "citizen@example.org" }),
              ).resolves.toBe(true);

              mocks.findOne.mockResolvedValueOnce({
                email: "citizen@example.org",
                userId: "user-1",
                status: "active",
                consentVersion: "old_consent",
              });
              await expect(
                readCanonicalNewsletterOptIn({ userId: "user-1", email: "citizen@example.org" }),
              ).resolves.toBe(false);
            });
          });
          EOF

          cat > apps/web/tests/newsletter-closeout-handoff.contract.test.ts <<'EOF'
          import { readFileSync } from "node:fs";
          import { describe, expect, it } from "vitest";

          const runtime = readFileSync(
            new URL("../src/features/newsletter/newsletterRuntime.ts", import.meta.url),
            "utf8",
          );
          const account = readFileSync(
            new URL("../../../features/account/service.ts", import.meta.url),
            "utf8",
          );

          describe("newsletter closeout handoff safety", () => {
            it("reserves subscriber, content revisions, and delivery ledger inside one transaction before SMTP", () => {
              expect(runtime).toContain('const db = await getDb("core")');
              expect(runtime).toContain("await session.withTransaction(async () => {");
              expect(runtime).toContain("lastDeliveryBoundaryAt: input.now");
              expect(runtime).toContain("lastNewsletterDeliveryBoundaryAt: input.now");
              expect(runtime).toContain("sourceRevisionHash");
              expect(runtime).toContain("newsletterSourceRevisionHash(source) !== candidate!.sourceRevisionHash");
              expect(runtime).toContain('reason: "candidate_state_changed"');
              expect(runtime).toContain("externalAttemptBoundaryAt: input.now");
              expect(runtime).toContain("const result = await sendMail({");
              expect(runtime.indexOf("reserveNewsletterExternalHandoff({")).toBeLessThan(
                runtime.indexOf("const result = await sendMail({"),
              );
            });

            it("fails closed when transaction or canonical state cannot be established", () => {
              expect(runtime).toContain('reason: "handoff_transaction_unavailable"');
              expect(runtime).toContain('reason: "handoff_transaction_failed"');
              expect(runtime).toContain('reason: "subscriber_state_changed"');
              expect(runtime).toContain('reason: "candidate_state_unavailable"');
            });

            it("projects and mutates newsletter preference through the canonical subscription adapter", () => {
              expect(account).toContain("readCanonicalNewsletterOptIn");
              expect(account).toContain("applyAccountNewsletterPreference");
              expect(account).toContain("newsletterOptIn: canonicalNewsletterOptIn");
              expect(account).not.toContain("newsletterOptIn: doc.settings?.newsletterOptIn ?? false");
              expect(account).toContain('setOps["settings.newsletterOptIn"] = canonical.active');
            });
          });
          EOF

          git diff --check
          pnpm -C apps/web exec vitest run \
            tests/newsletter-account-subscription-adapter.test.ts \
            tests/newsletter-closeout-handoff.contract.test.ts \
            tests/newsletter-delivery-lifecycle.test.ts \
            tests/newsletter-n8-n9-acceptance.test.ts
          pnpm -C apps/web run typecheck
          pnpm lint
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/src/features/newsletter/newsletterRuntime.ts \
            features/notifications/newsletterAccountSubscriptionAdapter.ts \
            features/account/service.ts \
            apps/web/tests/newsletter-account-subscription-adapter.test.ts \
            apps/web/tests/newsletter-closeout-handoff.contract.test.ts
          git commit -m 'fix(newsletter): close consent and content handoff races'
          git push origin HEAD

          git rm .github/workflows/newsletter-closeout-delta-02.yml
          git commit -m 'chore(newsletter): remove closeout delta writer'
          git push origin HEAD
