name: Temporary close tools and authorize civic relevance

on:
  push:
    branches:
      - docs/voxy-civic-activity-relevance-01-ssot

permissions:
  contents: write

jobs:
  serialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/voxy-civic-activity-relevance-01-ssot
      - name: Fail closed and mutate only intended OpenTasks rows
        shell: bash
        env:
          EXPECTED_MAIN: 5807fb080bfca92ee6d2c9239acf30ffd2c434b3
          EXPECTED_OPENTASKS_BLOB: 5fbb19be98e4ca2afcc6ab87b7fce8e9092e01af
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          observed_main="$(git rev-parse origin/main)"
          test "$observed_main" = "$EXPECTED_MAIN" || { echo "main_drift:$observed_main"; exit 41; }
          observed_blob="$(git rev-parse origin/main:docs/E150/OpenTasks.md)"
          test "$observed_blob" = "$EXPECTED_OPENTASKS_BLOB" || { echo "opentasks_blob_drift:$observed_blob"; exit 42; }
          python - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('docs/E150/OpenTasks.md')
          text = p.read_text(encoding='utf-8')
          history_marker = '## Historischer Katalog und Evidenz'
          if history_marker not in text:
              raise SystemExit('history_marker_missing')
          head, history = text.split(history_marker, 1)
          history_hash_before = hashlib.sha256(history.encode()).hexdigest()

          tool_id = 'VOXY-TOOL-CAPABILITY-ADAPTERS-01'
          civic_id = 'VOXY-CIVIC-ACTIVITY-RELEVANCE-01'
          if head.count(tool_id) != 1:
              raise SystemExit(f'tool_task_count:{head.count(tool_id)}')
          if civic_id in head:
              raise SystemExit('civic_task_already_present')

          lines = head.splitlines(keepends=True)
          tool_index = next((i for i, line in enumerate(lines) if line.startswith(f'| {tool_id} |')), None)
          if tool_index is None:
              raise SystemExit('tool_row_missing')
          tool_line = lines[tool_index]
          if '| codex_ready | P0 |' not in tool_line:
              raise SystemExit('tool_status_not_codex_ready')
          tool_line = tool_line.replace('| codex_ready | P0 |', '| review | P0 |', 1)
          tool_line = tool_line.replace(
              'Issue `#1027`;',
              'Issue `#1027`; PR `#1051`; merge `5807fb080bfca92ee6d2c9239acf30ffd2c434b3`; Web CI `#3517` + Voxy canon lock `#359` green;',
              1,
          )
          lines[tool_index] = tool_line

          civic_row = "| VOXY-CIVIC-ACTIVITY-RELEVANCE-01 | codex_ready | P0 | Issue `#1050`; `PERSONAL-VOXY-CONSENTED-MEMORY-RUNTIME-01`; `VOXY-TOOL-CAPABILITY-ADAPTERS-01` merged via PR `#1051`; Issue `#586` Canonical Topic/UpdateEvent; Newsletter N3/N8 explainable relevance; existing Vote/Contribution/Round/Watchlist owners; Single-Writer `#447` | Transparente user-kontrollierte Civic-Activity-Projektion und `Warum fuer dich` auf kanonischen Domain-IDs: `observed_signal`, `confirmed_interest`, `explicit_participation`; intentionales Share-to-Voxy nur ueber bestehende sichere Source-/URL-Grenzen; keine zweite Activity-, Vote-, Topic-, Relevance- oder Memory-SSOT | Start nur nach positivem taskbezogenen Preflight; erster Slice auf typed Activity-Projection + RelevanceExplanation begrenzt; observed signals erzeugen keine politische Position; confirmed interests benoetigen bestehenden Memory-Consent; explicit participation bleibt an konkrete Frage/Aktion gebunden; keine Partei-/Ideologie-/Wahlabsichts-/Persuadability-Inferenz, keine Evidence-/Truth-Gewichtung, kein Ausblenden starker Gegenargumente, keine Auto-Abstimmung/Auto-Publish/Social-Account-Autonomie |\n"
          lines.insert(tool_index + 1, civic_row)
          new_head = ''.join(lines)
          new_text = new_head + history_marker + history
          if new_head.count(tool_id) != 1 or new_head.count(civic_id) != 1:
              raise SystemExit('post_mutation_task_count_invalid')
          history_hash_after = hashlib.sha256(history.encode()).hexdigest()
          if history_hash_before != history_hash_after:
              raise SystemExit('historical_tail_changed')
          p.write_text(new_text, encoding='utf-8')
          PY
          git diff --check
          changed_files="$(git diff --name-only)"
          test "$changed_files" = "docs/E150/OpenTasks.md" || { echo "$changed_files"; exit 43; }
          grep -q '^| VOXY-TOOL-CAPABILITY-ADAPTERS-01 | review | P0 |' docs/E150/OpenTasks.md
          grep -q '^| VOXY-CIVIC-ACTIVITY-RELEVANCE-01 | codex_ready | P0 |' docs/E150/OpenTasks.md
          rm .github/workflows/tmp-close-tools-authorize-civic-relevance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/E150/OpenTasks.md .github/workflows/tmp-close-tools-authorize-civic-relevance.yml
          git commit -m "docs(e150): close tools and authorize civic relevance"
          git push origin HEAD:docs/voxy-civic-activity-relevance-01-ssot
