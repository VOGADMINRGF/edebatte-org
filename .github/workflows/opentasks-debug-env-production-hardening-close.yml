name: OpenTasks debug env hardening close

on:
  push:
    branches:
      - docs/governance-ssot-sync-05

permissions:
  contents: write

concurrency:
  group: governance-ssot-writer
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/governance-ssot-sync-05
          fetch-depth: 0

      - name: Verify current authorization and serialize completed hardening to review
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "9b01fc00b3a4adeaf452a67501d31b97dd091c40"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          test "$(git diff --name-only origin/main..HEAD)" = ".github/workflows/opentasks-debug-env-production-hardening-close.yml"
          test "$(git rev-parse 'HEAD:docs/E150/OpenTasks.md')" = "42031e2418a4e3255e9a9d0f72646f886c49c0fd"
          test -z "$(git status --porcelain)"

          node scripts/codex-task-preflight.mjs DEBUG-ENV-PRODUCTION-HARDENING-01 | tee /tmp/preflight-before.txt
          grep -F '"status": "codex_ready"' /tmp/preflight-before.txt
          grep -F '"executable": true' /tmp/preflight-before.txt
          grep -F '"branchCreationAllowed": true' /tmp/preflight-before.txt

          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('docs/E150/OpenTasks.md')
          text = path.read_text(encoding='utf-8')
          start_marker = '## Kanonischer Operativteil'
          end_marker = '## Historischer Katalog und Evidenz'
          target = 'DEBUG-ENV-PRODUCTION-HARDENING-01'
          expected_tail_hash = '27b444dbc3d2d01e8d2c5f0a1426a0842abfdbc8fa08bd2f97d39c248e51a399'

          assert text.count(start_marker) == 1
          assert text.count(end_marker) == 1
          start = text.index(start_marker)
          end = text.index(end_marker)
          assert start < end
          operative = text[start:end]
          history = text[end:]
          assert hashlib.sha256(history.encode('utf-8')).hexdigest() == expected_tail_hash, 'historical_tail_hash_drift'

          lines = operative.splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if target in line]
          assert len(matches) == 1, f'operative_target_count={len(matches)}'
          idx = matches[0]
          old_line = lines[idx]
          assert '| codex_ready |' in old_line, 'target_not_codex_ready'
          assert 'Issue `#733`' in old_line, 'issue_binding_missing'
          assert 'öffentliche `/api/debug/env`' in old_line, 'scope_binding_missing'
          assert 'technischer Endstatus maximal `review`' in old_line, 'review_ceiling_missing'

          new_line = old_line.replace('| codex_ready |', '| review |', 1)
          assert new_line.replace('| review |', '| codex_ready |', 1) == old_line, 'non_status_mutation_detected'
          lines[idx] = new_line
          new_operative = ''.join(lines)
          new_text = text[:start] + new_operative + text[end:]
          new_end = start + len(new_operative)
          assert hashlib.sha256(new_text[new_end:].encode('utf-8')).hexdigest() == expected_tail_hash, 'historical_tail_mutated'
          assert new_text.count(target) == text.count(target), 'target_count_changed'
          path.write_text(new_text, encoding='utf-8')
          print('OLD_ROW=' + old_line.rstrip())
          print('NEW_ROW=' + new_line.rstrip())
          PY

          git diff --check
          test "$(git diff --numstat -- docs/E150/OpenTasks.md)" = $'1\t1\tdocs/E150/OpenTasks.md'
          test "$(git diff --name-only)" = "docs/E150/OpenTasks.md"

          set +e
          node scripts/codex-task-preflight.mjs DEBUG-ENV-PRODUCTION-HARDENING-01 > /tmp/preflight-after.txt 2>&1
          rc=$?
          set -e
          cat /tmp/preflight-after.txt
          test "$rc" -eq 1
          grep -F '"status": "review"' /tmp/preflight-after.txt
          grep -F '"executable": false' /tmp/preflight-after.txt
          grep -F '"reason": "task_status_not_executable:review"' /tmp/preflight-after.txt
          if grep -F 'branchCreationAllowed' /tmp/preflight-after.txt; then
            echo 'branchCreationAllowed unexpectedly present' >&2
            exit 1
          fi

      - name: Commit SSOT change and self-delete writer
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/opentasks-debug-env-production-hardening-close.yml
          git add docs/E150/OpenTasks.md
          test "$(git diff --cached --name-only | sort)" = $'.github/workflows/opentasks-debug-env-production-hardening-close.yml\ndocs/E150/OpenTasks.md'
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(governance): close debug env hardening authorization'
          git push origin HEAD:docs/governance-ssot-sync-05
