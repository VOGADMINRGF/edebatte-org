name: Voxy Ops Preflight

on:
  push:
    branches:
      - docs/voxy-ops-preflight-01

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Verify exact main and clean worktree
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "b96a28c75cb775ab2f578977e74ff473c0b9f3b3"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Run task preflight
        run: |
          set -euo pipefail
          node scripts/codex-task-preflight.mjs V3-AGENTIC-RUNTIME-ACTIVATION-CLOSURE-01 | tee /tmp/preflight.json
          grep -F '"status": "codex_ready"' /tmp/preflight.json
          grep -F '"executable": true' /tmp/preflight.json
          grep -F '"branchCreationAllowed": true' /tmp/preflight.json
