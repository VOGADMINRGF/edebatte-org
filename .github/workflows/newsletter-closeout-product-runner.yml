name: Newsletter closeout product runner

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  implement:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Execute validated product generator only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import textwrap

          source = Path('.github/workflows/newsletter-closeout-delta-02.yml').read_text()
          marker = '      - name: Implement F3 F1 F4 on existing newsletter owners\n        shell: bash\n        run: |\n'
          if source.count(marker) != 1:
              raise SystemExit(f'expected one generator run block, got {source.count(marker)}')
          block = source.split(marker, 1)[1]
          script = textwrap.dedent(block)
          old = r'''  if (!reservation.ok) {\n    return { ok: reservation.status === "skipped", status: reservation.status, reason: reservation.reason, preview };\n  }'''
          new = r'''  if ("status" in reservation) {\n    return { ok: reservation.status === "skipped", status: reservation.status, reason: reservation.reason, preview };\n  }'''
          if script.count(old) != 1:
              raise SystemExit(f'expected one generated narrowing anchor, got {script.count(old)}')
          script = script.replace(old, new, 1)
          commit_marker = "git config user.name 'github-actions[bot]'"
          if script.count(commit_marker) != 1:
              raise SystemExit(f'expected one commit marker, got {script.count(commit_marker)}')
          script = script.split(commit_marker, 1)[0].rstrip() + '\n'
          Path('/tmp/newsletter-closeout-product.sh').write_text(script)
          PY
          bash /tmp/newsletter-closeout-product.sh

          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/src/features/newsletter/newsletterRuntime.ts \
            features/notifications/newsletterAccountSubscriptionAdapter.ts \
            features/account/service.ts \
            apps/web/tests/newsletter-account-subscription-adapter.test.ts \
            apps/web/tests/newsletter-closeout-handoff.contract.test.ts
          git commit -m 'fix(newsletter): close consent and content handoff races'
          git push origin HEAD
