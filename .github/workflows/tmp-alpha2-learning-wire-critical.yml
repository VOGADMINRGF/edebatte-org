name: Temporary Alpha2 learning critical guardrail wiring

on:
  push:
    branches:
      - feat/alpha2-learning-evals-01-current-main

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/alpha2-learning-evals-01-current-main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Add existing learning regression to critical guardrails
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('apps/web/package.json')
          text = p.read_text()
          old = 'tests/alpha2-agent-fleet.contract.test.ts tests/alpha2-review-auth-boundary.contract.test.ts'
          new = 'tests/alpha2-agent-fleet.contract.test.ts tests/alpha2-learning-evals.contract.test.ts tests/alpha2-review-auth-boundary.contract.test.ts'
          if text.count(old) != 1:
            raise SystemExit(f'critical guardrail anchor count={text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
      - name: Commit wiring and self-delete
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/package.json
          git commit -m "test(alpha2): wire learning evals into critical guardrails"
          git rm .github/workflows/tmp-alpha2-learning-wire-critical.yml
          git commit -m "chore(alpha2): remove one-shot guardrail writer"
          git push origin HEAD:feat/alpha2-learning-evals-01-current-main
