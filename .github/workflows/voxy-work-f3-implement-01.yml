name: Voxy Work F3 implement

on:
  push:
    branches:
      - fix/voxy-work-f3-numeric-semantic-guard-01

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact authorized main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "6a9d291e0d66e8d30fa5a77dea4654c938b1905e"
          test "$(git merge-base HEAD origin/main)" = "6a9d291e0d66e8d30fa5a77dea4654c938b1905e"
      - name: Apply focused F3 repair and regressions
        shell: bash
        run: |
          set -euo pipefail
          python scripts/tmp-voxy-work-f3-patch.py
          python scripts/tmp-voxy-work-f3-fix-regex.py
      - run: git diff --check
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused F3 contracts
        run: pnpm -C apps/web exec vitest run tests/voxy-editorial-translation-semantic-guard.contract.test.ts tests/voxy-editorial-language-variant.contract.test.ts
      - name: Full web typecheck
        run: pnpm -C apps/web run typecheck
      - name: Commit validated product delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/features/voxyVideo/editorialTranslationSemanticGuard.ts apps/web/tests/voxy-editorial-translation-semantic-guard.contract.test.ts
          test "$(git diff --cached --name-only | wc -l | tr -d ' ')" = "2"
          git commit -m 'fix(voxy): preserve numeric semantics across locales'
          git push origin HEAD
