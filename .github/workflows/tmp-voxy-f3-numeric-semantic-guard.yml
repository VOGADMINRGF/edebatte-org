name: Temporary Voxy F3 numeric semantic repair

on:
  push:
    branches:
      - fix/voxy-f3-numeric-semantic-guard-01

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/voxy-f3-numeric-semantic-guard-01
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact authorization base
        env:
          EXPECTED_MAIN: 6a9d291e0d66e8d30fa5a77dea4654c938b1905e
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN"

      - name: Apply exact F3 repair
        run: |
          set -euo pipefail
          python3 scripts/tmp-voxy-f3-numeric-semantic-guard.py
          git diff --check
          test "$(git diff --name-only)" = $'apps/web/src/features/voxyVideo/editorialTranslationSemanticGuard.ts\napps/web/tests/voxy-editorial-translation-semantic-guard.contract.test.ts'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused semantic guard regression
        run: pnpm -C apps/web exec vitest run tests/voxy-editorial-translation-semantic-guard.contract.test.ts

      - name: Typecheck
        run: pnpm -C apps/web run typecheck

      - name: Commit repair and self-delete implementer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/voxyVideo/editorialTranslationSemanticGuard.ts apps/web/tests/voxy-editorial-translation-semantic-guard.contract.test.ts
          git commit -m "fix(voxy): preserve numeric semantics across locales"
          git rm .github/workflows/tmp-voxy-f3-numeric-semantic-guard.yml scripts/tmp-voxy-f3-numeric-semantic-guard.py
          git commit -m "chore(voxy): remove one-shot F3 implementer"
          test "$(git diff --name-only origin/main...HEAD)" = $'apps/web/src/features/voxyVideo/editorialTranslationSemanticGuard.ts\napps/web/tests/voxy-editorial-translation-semantic-guard.contract.test.ts'
          git diff --check origin/main...HEAD
          git push origin HEAD:fix/voxy-f3-numeric-semantic-guard-01
