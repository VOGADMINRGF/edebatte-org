name: Temporary Voxy F3 numeric semantic repair

on:
  push:
    branches:
      - fix/voxy-f3-numeric-semantic-guard-01

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/voxy-f3-numeric-semantic-guard-01
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact F3 repair
        env:
          EXPECTED_MAIN: 6a9d291e0d66e8d30fa5a77dea4654c938b1905e
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN"
          python3 - <<'PY'
          from pathlib import Path

          guard_path = Path('apps/web/src/features/voxyVideo/editorialTranslationSemanticGuard.ts')
          guard = guard_path.read_text()
          old_numeric = '''function numericTokens(value: string): string[] {
            const matches = value.match(/[-+]?\\d(?:[\\d\\s.,'’]*\\d)?/g) ?? [];
            return matches
              .map((token) => {
                const sign = token.trim().startsWith("-") ? "-" : "";
                const digits = token.replace(/\\D/g, "");
                return digits ? `${sign}${digits}` : "";
              })
              .filter(Boolean)
              .sort();
          }'''.replace('          ', '')
          new_numeric = r'''type NumericTokenAnalysis = {
  tokens: string[];
  ambiguous: boolean;
};

type NumericLocaleProfile = {
  locale: string;
  decimal: string;
  group: string;
  primaryGroupSize: number;
  secondaryGroupSize: number;
};

function normalizeNumericPunctuation(value: string): string {
  return value.replace(/’/g, "'").replace(/[\u00a0\u202f\s]+/gu, " ");
}

function numericLocaleProfile(language: string): NumericLocaleProfile | null {
  const locale = language.trim().replace(/_/g, "-") || "en";
  try {
    const fractionalFormatter = new Intl.NumberFormat(locale, {
      numberingSystem: "latn",
      useGrouping: true,
      minimumFractionDigits: 1,
      maximumFractionDigits: 1,
    });
    const fractionalParts = fractionalFormatter.formatToParts(12345.6);
    const decimal = normalizeNumericPunctuation(
      fractionalParts.find((part) => part.type === "decimal")?.value ?? "",
    );
    const group = normalizeNumericPunctuation(
      fractionalParts.find((part) => part.type === "group")?.value ?? "",
    );
    if (!decimal || !group || decimal === group) return null;

    const integerParts = new Intl.NumberFormat(locale, {
      numberingSystem: "latn",
      useGrouping: true,
      maximumFractionDigits: 0,
    })
      .formatToParts(123456789012345)
      .filter((part) => part.type === "integer")
      .map((part) => part.value);
    const primaryGroupSize = integerParts[integerParts.length - 1]?.length ?? 3;
    const secondaryGroupSize = integerParts[integerParts.length - 2]?.length ?? primaryGroupSize;

    return { locale, decimal, group, primaryGroupSize, secondaryGroupSize };
  } catch {
    return null;
  }
}

function ambiguousNumericToken(token: string, language: string): string {
  return `ambiguous:${languageKey(language)}:${normalizeNumericPunctuation(token.trim())}`;
}

function canonicalNumericToken(
  rawToken: string,
  language: string,
): { token: string; ambiguous: boolean } {
  const profile = numericLocaleProfile(language);
  if (!profile) {
    return { token: ambiguousNumericToken(rawToken, language), ambiguous: true };
  }

  const normalized = normalizeNumericPunctuation(rawToken.trim());
  const negative = normalized.startsWith("-");
  const body = normalized.replace(/^[-+]/, "");
  if (!body || !/^\d[\d.,' ٫٬]*$/u.test(body)) {
    return { token: ambiguousNumericToken(rawToken, language), ambiguous: true };
  }

  const punctuation = Array.from(body).filter((character) => !/\d/.test(character));
  if (punctuation.some((character) => character !== profile.decimal && character !== profile.group)) {
    return { token: ambiguousNumericToken(rawToken, language), ambiguous: true };
  }

  const decimalParts = body.split(profile.decimal);
  if (decimalParts.length > 2) {
    return { token: ambiguousNumericToken(rawToken, language), ambiguous: true };
  }
  const integerPart = decimalParts[0] ?? "";
  const fractionalPart = decimalParts[1] ?? null;
  if (fractionalPart !== null && (!/^\d+$/.test(fractionalPart) || fractionalPart.includes(profile.group))) {
    return { token: ambiguousNumericToken(rawToken, language), ambiguous: true };
  }

  const integerGroups = integerPart.split(profile.group);
  if (integerGroups.some((group) => !/^\d+$/.test(group))) {
    return { token: ambiguousNumericToken(rawToken, language), ambiguous: true };
  }
  if (integerGroups.length > 1) {
    const last = integerGroups[integerGroups.length - 1] ?? "";
    if (last.length !== profile.primaryGroupSize) {
      return { token: ambiguousNumericToken(rawToken, language), ambiguous: true };
    }
    for (let index = integerGroups.length - 2; index > 0; index -= 1) {
      if ((integerGroups[index] ?? "").length !== profile.secondaryGroupSize) {
        return { token: ambiguousNumericToken(rawToken, language), ambiguous: true };
      }
    }
    const firstLength = (integerGroups[0] ?? "").length;
    if (firstLength < 1 || firstLength > profile.secondaryGroupSize) {
      return { token: ambiguousNumericToken(rawToken, language), ambiguous: true };
    }
  }

  const integerDigits = integerGroups.join("").replace(/^0+(?=\d)/, "") || "0";
  const fractionDigits = (fractionalPart ?? "").replace(/0+$/, "");
  const zero = integerDigits === "0" && !fractionDigits;
  const sign = negative && !zero ? "-" : "";
  return {
    token: `${sign}${integerDigits}${fractionDigits ? `.${fractionDigits}` : ""}`,
    ambiguous: false,
  };
}

function numericTokens(value: string, language: string): NumericTokenAnalysis {
  const matches = value.match(/[-+]?\d(?:[\d\s.,'’٫٬]*\d)?/gu) ?? [];
  const normalized = matches.map((token) => canonicalNumericToken(token, language));
  return {
    tokens: normalized.map((result) => result.token).filter(Boolean).sort(),
    ambiguous: normalized.some((result) => result.ambiguous),
  };
}'''
          if guard.count(old_numeric) != 1:
            raise SystemExit(f'expected one numericTokens block, found {guard.count(old_numeric)}')
          guard = guard.replace(old_numeric, new_numeric, 1)

          old_compare = '''  compareTokenList(input.reviewFlags, input.path, "number", numericTokens(input.source), numericTokens(input.target));'''
          new_compare = '''  const sourceNumbers = numericTokens(input.source, input.sourceLanguage);\n  const targetNumbers = numericTokens(input.target, input.targetLanguage);\n  compareTokenList(input.reviewFlags, input.path, "number", sourceNumbers.tokens, targetNumbers.tokens);\n  if (sourceNumbers.ambiguous || targetNumbers.ambiguous) {\n    input.reviewFlags.push(`semantic_guard_number_ambiguous:${input.path}`);\n  }'''
          if guard.count(old_compare) != 1:
            raise SystemExit(f'expected one numeric compare call, found {guard.count(old_compare)}')
          guard = guard.replace(old_compare, new_compare, 1)
          guard_path.write_text(guard)

          test_path = Path('apps/web/tests/voxy-editorial-translation-semantic-guard.contract.test.ts')
          tests = test_path.read_text()
          helper_anchor = '''function bind(master: VoxyEditorialStoryPlan, translated: VoxyEditorialStoryPlan) {'''
          helper = '''function englishPlan(master: VoxyEditorialStoryPlan, narration: string) {\n  return frenchPlan(master, {\n    storyPlanId: "story-en-1",\n    locale: "en",\n    outputLanguage: "en",\n    title: "EU investment: 20 % for 10 km",\n    chapters: [\n      {\n        ...master.chapters[0]!,\n        headline: "EU invests 20 %",\n        narration,\n        consequences: [\n          {\n            ...master.chapters[0]!.consequences[0]!,\n            text: "“EU” could start 2 km later.",\n          },\n        ],\n      },\n    ],\n  });\n}\n\n'''
          if tests.count(helper_anchor) != 1:
            raise SystemExit('bind helper anchor not unique')
          tests = tests.replace(helper_anchor, helper + helper_anchor, 1)

          test_anchor = '''  it("treats source-pack translation review state as an existing fail-closed trust signal", () => {'''
          inserted = '''  it("detects decimal-comma magnitude drift instead of collapsing 1,5 and 15", () => {\n    const master = masterPlan({\n      chapters: [\n        {\n          ...masterPlan().chapters[0]!,\n          narration: "Die Strecke könnte 1,5 km lang sein.",\n        },\n      ],\n    });\n    const translated = englishPlan(master, "The distance could be 15 km long.");\n\n    const variant = bind(master, translated);\n    expect(variant.languageVariant.translationStatus).toBe("uncertain");\n    expect(variant.languageVariant.semanticGuard?.reviewFlags).toContain(\n      "semantic_guard_number_changed:chapter:chapter-1:narration",\n    );\n  });\n\n  it("accepts equivalent locale decimal and grouping renderings when they are unambiguous", () => {\n    const decimalMaster = masterPlan({\n      chapters: [\n        {\n          ...masterPlan().chapters[0]!,\n          narration: "Die Strecke könnte 1,5 km lang sein.",\n        },\n      ],\n    });\n    const decimalReport = evaluateVoxyEditorialTranslationSemanticGuard({\n      masterPlan: decimalMaster,\n      translatedPlan: englishPlan(decimalMaster, "The distance could be 1.5 km long."),\n    });\n    expect(decimalReport.reviewFlags).not.toContain(\n      "semantic_guard_number_changed:chapter:chapter-1:narration",\n    );\n    expect(decimalReport.reviewFlags).not.toContain(\n      "semantic_guard_number_ambiguous:chapter:chapter-1:narration",\n    );\n\n    const groupedMaster = masterPlan({\n      chapters: [\n        {\n          ...masterPlan().chapters[0]!,\n          narration: "Die Strecke könnte 1.500 km lang sein.",\n        },\n      ],\n    });\n    const groupedReport = evaluateVoxyEditorialTranslationSemanticGuard({\n      masterPlan: groupedMaster,\n      translatedPlan: englishPlan(groupedMaster, "The distance could be 1,500 km long."),\n    });\n    expect(groupedReport.reviewFlags).not.toContain(\n      "semantic_guard_number_changed:chapter:chapter-1:narration",\n    );\n    expect(groupedReport.reviewFlags).not.toContain(\n      "semantic_guard_number_ambiguous:chapter:chapter-1:narration",\n    );\n  });\n\n  it("fails closed on locale-ambiguous numeric separators", () => {\n    const master = masterPlan({\n      chapters: [\n        {\n          ...masterPlan().chapters[0]!,\n          narration: "Die Strecke könnte 1,5 km lang sein.",\n        },\n      ],\n    });\n    const report = evaluateVoxyEditorialTranslationSemanticGuard({\n      masterPlan: master,\n      translatedPlan: englishPlan(master, "The distance could be 1,5 km long."),\n    });\n\n    expect(report.reviewFlags).toContain(\n      "semantic_guard_number_ambiguous:chapter:chapter-1:narration",\n    );\n    expect(report.requiresReview).toBe(true);\n  });\n\n'''
          if tests.count(test_anchor) != 1:
            raise SystemExit('semantic guard test anchor not unique')
          tests = tests.replace(test_anchor, inserted + test_anchor, 1)
          test_path.write_text(tests)
          PY
          git diff --check
          changed="$(git diff --name-only)"
          test "$changed" = $'apps/web/src/features/voxyVideo/editorialTranslationSemanticGuard.ts\napps/web/tests/voxy-editorial-translation-semantic-guard.contract.test.ts'

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused semantic guard regression
        run: pnpm -C apps/web exec vitest run tests/voxy-editorial-translation-semantic-guard.contract.test.ts

      - name: Typecheck
        run: pnpm -C apps/web run typecheck

      - name: Commit repair and self-delete implementer
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/voxyVideo/editorialTranslationSemanticGuard.ts apps/web/tests/voxy-editorial-translation-semantic-guard.contract.test.ts
          git commit -m "fix(voxy): preserve numeric semantics across locales"
          git rm .github/workflows/tmp-voxy-f3-numeric-semantic-guard.yml
          git commit -m "chore(voxy): remove one-shot F3 implementer"
          test "$(git diff --name-only origin/main...HEAD)" = $'apps/web/src/features/voxyVideo/editorialTranslationSemanticGuard.ts\napps/web/tests/voxy-editorial-translation-semantic-guard.contract.test.ts'
          git diff --check origin/main...HEAD
          git push origin HEAD:fix/voxy-f3-numeric-semantic-guard-01
