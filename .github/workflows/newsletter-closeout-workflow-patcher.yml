name: Newsletter closeout writer patcher

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Patch writer narrowing and self-remove
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/newsletter-closeout-delta-02.yml')
          text = path.read_text()
          old = '''  if (!reservation.ok) {\n    return { ok: reservation.status === "skipped", status: reservation.status, reason: reservation.reason, preview };\n  }'''
          new = '''  if ("status" in reservation) {\n    return { ok: reservation.status === "skipped", status: reservation.status, reason: reservation.reason, preview };\n  }'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one narrowing anchor, got {text.count(old)}')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/newsletter-closeout-delta-02.yml
          git commit -m 'chore(newsletter): harden closeout writer narrowing'
          git rm .github/workflows/newsletter-closeout-workflow-patcher.yml
          git commit -m 'chore(newsletter): remove writer patcher'
          git push origin HEAD
