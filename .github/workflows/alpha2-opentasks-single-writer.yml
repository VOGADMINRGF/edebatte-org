name: Alpha2 OpenTasks single writer

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: alpha2-opentasks-single-writer-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Transactional CAS writer contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run Alpha2 OpenTasks single-writer contracts
        run: >-
          pnpm -C apps/web exec vitest run
          tests/alpha2-opentasks-single-writer.contract.test.ts
          tests/alpha2-opentasks-single-writer-review-evidence.contract.test.ts
