name: Voxy Work F3 preflight

on:
  push:
    branches:
      - ops/voxy-work-f3-preflight-01

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and checkout exact main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "6a9d291e0d66e8d30fa5a77dea4654c938b1905e"
          git checkout -B main origin/main
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
      - name: Canonical task preflight
        shell: bash
        run: |
          set -euo pipefail
          node scripts/codex-task-preflight.mjs VOXY-EU24-MULTILINGUAL-EDITORIAL-01 > /tmp/preflight.json 2>&1
          cat /tmp/preflight.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/preflight.json','utf8'));
          if (r.status !== 'codex_ready' || r.executable !== true || r.branchCreationAllowed !== true) {
            throw new Error(`preflight_not_executable:${JSON.stringify(r)}`);
          }
          NODE
