name: Voxy review consistency final closeout single writer

on:
  push:
    branches:
      - docs/voxy-review-consistency-final-closeout-01

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Verify exact source state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "07e602840c3f669cf7a3147758076e60cfa575e7"
          test "$(git hash-object docs/E150/OpenTasks.md)" = "6d3676de7edcb8859ec19a0709931a61058636d8"

      - name: Consume Slice C authorization atomically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/E150/OpenTasks.md")
          text = path.read_text(encoding="utf-8")
          prefix = "| VOXY-STUDIO-REVIEW-CONSISTENCY-01 |"
          lines = text.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one operative row, found {len(matches)}")

          old = lines[matches[0]]
          required = [
              "| codex_ready | P1 |",
              "**Slice C only:**",
              "voxy-studio-preview-review",
              "voxy-studio-evidence-review",
              "voxy-editorial-story-plan",
              "voxy-editorial-evidence-window",
          ]
          for token in required:
              if token not in old:
                  raise SystemExit(f"unexpected existing row; missing {token!r}")

          lines[matches[0]] = (
              "| VOXY-STUDIO-REVIEW-CONSISTENCY-01 | review | P1 | "
              "Issue `#977`; Slice A via PR `#1001` abgeschlossen; Slice B via PR `#1011` / Merge `6d8faf300f44f5a721ebfff5e6120d48e5cafdb7` abgeschlossen; Slice C via PR `#1013` / Merge `4575704ec69cb05d7ad866922e3027bbe74a7787` abgeschlossen; Exact-Head Voxy Runtime, Final Canon Lock und Web CI grün | "
              "**Final closeout:** keine ausführbare #977-Slice verbleibt. Die bestehende Studio-/Evidence-/Locale-/CI-Architektur ist maßgeblich; neue Arbeit nur bei neuem, konkret belegtem Delta und neuer SSOT-Autorisierung | "
              "Task-Preflight ist fail-closed (`review`, `executable=false`, keine Branch-Freigabe); kritische Preview-/Evidence-/Story-/Evidence-Window-Contracts sind im bestehenden Voxy Runtime-Gate verdrahtet; stale Evidence/Gate kann Locale-Approval nicht mehr als current-approved projizieren; keine zweite Queue/SSOT/CI-Pipeline, keine Provider-, Render-, Publish- oder Deployment-Side-Effects |"
          )
          path.write_text("\n".join(lines) + ("\n" if text.endswith("\n") else ""), encoding="utf-8")
          PY

          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          import { extractOperativeHead, parseOperativeTaskStatuses } from "./scripts/codex-task-preflight.mjs";
          const text = await fs.readFile("docs/E150/OpenTasks.md", "utf8");
          const statuses = parseOperativeTaskStatuses(extractOperativeHead(text));
          if (statuses.get("VOXY-STUDIO-REVIEW-CONSISTENCY-01") !== "review") {
            throw new Error("voxy_review_consistency_not_fail_closed");
          }
          NODE

          set +e
          PREFLIGHT="$(node scripts/codex-task-preflight.mjs VOXY-STUDIO-REVIEW-CONSISTENCY-01 2>&1)"
          PREFLIGHT_RC=$?
          set -e
          printf '%s\n' "$PREFLIGHT"
          test "$PREFLIGHT_RC" -ne 0
          printf '%s' "$PREFLIGHT" | grep -q '"status": "review"'
          printf '%s' "$PREFLIGHT" | grep -q '"executable": false'
          if printf '%s' "$PREFLIGHT" | grep -q '"branchCreationAllowed": true'; then
            echo "preflight unexpectedly allows branch creation" >&2
            exit 1
          fi
          git diff --check

      - name: Commit canonical SSOT delta and remove writer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/voxy-review-consistency-final-closeout-single-writer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/E150/OpenTasks.md .github/workflows/voxy-review-consistency-final-closeout-single-writer.yml
          git commit -m "docs(e150): close Voxy review consistency authorization"
          git push origin HEAD:docs/voxy-review-consistency-final-closeout-01
