name: Close Voxy P0 repair authorizations

on:
  push:
    branches:
      - docs/governance-ssot-sync-05
    paths:
      - .github/workflows/opentasks-voxy-p0-repairs-close.yml

permissions:
  contents: write

concurrency:
  group: governance-ssot-writer
  cancel-in-progress: false

jobs:
  close-authorizations:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/governance-ssot-sync-05
          fetch-depth: 0

      - name: Verify exact base and single-writer scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "5a19d0e7321a050f997ac77424e9eba4669bec8b"
          test "$(git merge-base HEAD origin/main)" = "5a19d0e7321a050f997ac77424e9eba4669bec8b"
          test "$(git rev-parse HEAD:docs/E150/OpenTasks.md)" = "275f45643a7814e11c8a2e3f4d0bf9e1f815b7ea"
          test "$(git diff --name-only origin/main...HEAD)" = ".github/workflows/opentasks-voxy-p0-repairs-close.yml"

      - name: Verify pre-write task preflights on exact main
        shell: bash
        run: |
          set -euo pipefail
          git switch -C main origin/main
          for task in VOXY-EDITORIAL-COUNCIL-FAIL-CLOSED-01 VOXY-RENDER-APPROVAL-FRESHNESS-01; do
            file="/tmp/pre-${task}.json"
            node scripts/codex-task-preflight.mjs "$task" > "$file"
            cat "$file"
            python - "$file" "$task" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          assert data["taskId"] == sys.argv[2], data
          assert data["status"] == "codex_ready", data
          assert data["executable"] is True, data
          assert data["branchCreationAllowed"] is True, data
          PY
          done

      - name: Produce exact status-only mutation and verify fail-closed preflight
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('docs/E150/OpenTasks.md')
          text = path.read_text()
          operative = '## Kanonischer Operativteil'
          history = '## Historischer Katalog und Evidenz'
          assert text.count(operative) == 1
          assert text.count(history) == 1
          assert text.index(operative) < text.index(history)
          historical_tail = text[text.index(history):]
          assert hashlib.sha256(historical_tail.encode()).hexdigest() == '27b444dbc3d2d01e8d2c5f0a1426a0842abfdbc8fa08bd2f97d39c248e51a399'

          targets = [
              'VOXY-EDITORIAL-COUNCIL-FAIL-CLOSED-01',
              'VOXY-RENDER-APPROVAL-FRESHNESS-01',
          ]
          lines = text.splitlines(keepends=True)
          for task in targets:
              hits = [i for i, line in enumerate(lines) if f'| {task} |' in line]
              assert len(hits) == 1, (task, hits)
              i = hits[0]
              line = lines[i]
              assert f'| {task} | codex_ready | P0 |' in line, line
              lines[i] = line.replace(f'| {task} | codex_ready |', f'| {task} | review |', 1)

          updated = ''.join(lines)
          assert updated.count('| VOXY-EDITORIAL-COUNCIL-FAIL-CLOSED-01 | review | P0 |') == 1
          assert updated.count('| VOXY-RENDER-APPROVAL-FRESHNESS-01 | review | P0 |') == 1
          assert '| VOXY-EDITORIAL-COUNCIL-FAIL-CLOSED-01 | codex_ready | P0 |' not in updated
          assert '| VOXY-RENDER-APPROVAL-FRESHNESS-01 | codex_ready | P0 |' not in updated
          assert hashlib.sha256(updated[updated.index(history):].encode()).hexdigest() == '27b444dbc3d2d01e8d2c5f0a1426a0842abfdbc8fa08bd2f97d39c248e51a399'
          path.write_text(updated)
          PY

          git diff --check -- docs/E150/OpenTasks.md
          test "$(git diff --numstat -- docs/E150/OpenTasks.md)" = $'2\t2\tdocs/E150/OpenTasks.md'
          for task in VOXY-EDITORIAL-COUNCIL-FAIL-CLOSED-01 VOXY-RENDER-APPROVAL-FRESHNESS-01; do
            file="/tmp/post-${task}.json"
            set +e
            node scripts/codex-task-preflight.mjs "$task" > "$file"
            rc=$?
            set -e
            test "$rc" -ne 0
            cat "$file"
            python - "$file" "$task" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          assert data["taskId"] == sys.argv[2], data
          assert data["status"] == "review", data
          assert data["executable"] is False, data
          assert data["reason"] == "task_status_not_executable:review", data
          assert "branchCreationAllowed" not in data, data
          PY
          done
          cp docs/E150/OpenTasks.md /tmp/OpenTasks.md
          git restore docs/E150/OpenTasks.md

      - name: Commit status-only SSOT convergence and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git switch docs/governance-ssot-sync-05
          cp /tmp/OpenTasks.md docs/E150/OpenTasks.md
          git rm .github/workflows/opentasks-voxy-p0-repairs-close.yml
          git diff --check
          test "$(git diff --numstat origin/main -- docs/E150/OpenTasks.md)" = $'2\t2\tdocs/E150/OpenTasks.md'
          test "$(git diff --name-only origin/main)" = "docs/E150/OpenTasks.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/E150/OpenTasks.md
          git commit -m 'docs(e150): close Voxy P0 repair authorizations'
          git push origin HEAD:docs/governance-ssot-sync-05
