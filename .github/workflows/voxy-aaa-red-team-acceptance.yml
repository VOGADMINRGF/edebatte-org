name: Voxy AAA red-team acceptance

on:
  push:
    branches: [ main ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: voxy-aaa-red-team-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  acceptance:
    name: AAA sovereignty and failure acceptance
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BROWSERSLIST_IGNORE_OLD_DATA: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: "pnpm"
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Run cross-contract AAA red-team suite
        run: >-
          pnpm -C apps/web exec vitest run
          tests/voxy-aaa-red-team-acceptance.contract.test.ts
