name: Verify #644 media source contract slice

on:
  push:
    branches:
      - feat/youtube-serverless-source-runtime-01
    paths:
      - .github/workflows/verify-youtube-serverless-source-runtime-slice1.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/youtube-serverless-source-runtime-01
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Focused media source contract
        run: pnpm -C apps/web exec vitest run tests/media-source-artifact.contract.test.ts
      - name: Typecheck
        run: pnpm -C apps/web run typecheck
      - name: Diff check
        run: git diff --check origin/main...HEAD
      - name: Remove temporary verification workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/verify-youtube-serverless-source-runtime-slice1.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(ci): remove one-shot #644 verification workflow'
          git push origin HEAD:feat/youtube-serverless-source-runtime-01
