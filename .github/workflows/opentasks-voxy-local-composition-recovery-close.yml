name: Close consumed Voxy local composition recovery authorization

on:
  push:
    branches:
      - docs/governance-ssot-sync-05

permissions:
  contents: write

concurrency:
  group: governance-ssot-writer
  cancel-in-progress: false

jobs:
  serialize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify writer base and current task authorization
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN='e83330663f28faced02b1e9d25df52065dc957e1'
          git fetch origin main docs/governance-ssot-sync-05
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN"
          test "$(git diff --name-only origin/main...HEAD | grep -v '^.github/workflows/opentasks-voxy-local-composition-recovery-close.yml$' | wc -l | tr -d ' ')" = '0'

          git worktree add --detach /tmp/main-preflight origin/main
          git -C /tmp/main-preflight checkout -b main
          node /tmp/main-preflight/scripts/codex-task-preflight.mjs VOXY-LOCAL-COMPOSITION-RECOVERY-01 > /tmp/preflight-before.json
          cat /tmp/preflight-before.json
          node <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/preflight-before.json', 'utf8'));
          if (r.status !== 'codex_ready') throw new Error(`unexpected before status: ${r.status}`);
          if (r.executable !== true) throw new Error(`before task not executable: ${JSON.stringify(r)}`);
          if (r.branchCreationAllowed !== true) throw new Error(`before branch not allowed: ${JSON.stringify(r)}`);
          NODE

      - name: Serialize exactly one consumed status
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import hashlib, re

          path = Path('docs/E150/OpenTasks.md')
          text = path.read_text(encoding='utf-8')
          operative_marker = '## Kanonischer Operativteil'
          historical_marker = '## Historischer Katalog und Evidenz'
          task = 'VOXY-LOCAL-COMPOSITION-RECOVERY-01'

          assert text.count(operative_marker) == 1, 'operative_marker_not_unique'
          assert text.count(historical_marker) == 1, 'historical_marker_not_unique'
          op_start = text.index(operative_marker)
          hist_start = text.index(historical_marker)
          assert op_start < hist_start, 'marker_order_invalid'

          operative = text[op_start:hist_start]
          historical = text[hist_start:]
          historical_hash_before = hashlib.sha256(historical.encode()).hexdigest()

          lines = operative.splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if task in line]
          assert len(matches) == 1, f'target_count:{len(matches)}'
          idx = matches[0]
          before_line = lines[idx]
          assert '| codex_ready |' in before_line, f'unexpected_target_status:{before_line!r}'
          after_line = before_line.replace('| codex_ready |', '| review |', 1)
          assert after_line != before_line
          lines[idx] = after_line
          new_operative = ''.join(lines)
          new_text = text[:op_start] + new_operative + historical

          def status_map(region: str):
              out = {}
              rx = re.compile(r'\|\s*([A-Z0-9][A-Z0-9_.:/-]+)\s*\|\s*(blocked|codex_ready|in_progress|review|manual_gate|done)\s*\|')
              for line in region.splitlines():
                  m = rx.search(line)
                  if m:
                      out.setdefault(m.group(1), []).append(m.group(2))
              return out

          before_statuses = status_map(operative)
          after_statuses = status_map(new_operative)
          all_ids = set(before_statuses) | set(after_statuses)
          changed = {k: (before_statuses.get(k), after_statuses.get(k)) for k in all_ids if before_statuses.get(k) != after_statuses.get(k)}
          assert changed == {task: (['codex_ready'], ['review'])}, f'unexpected_status_delta:{changed}'
          assert hashlib.sha256(new_text[new_text.index(historical_marker):].encode()).hexdigest() == historical_hash_before, 'historical_tail_changed'
          assert new_operative.count(task) == 1, 'target_not_unique_after'

          path.write_text(new_text, encoding='utf-8')
          print('before:', before_line.rstrip())
          print('after :', after_line.rstrip())
          print('historical_tail_sha256:', historical_hash_before)
          PY

          git diff --check -- docs/E150/OpenTasks.md
          test "$(git diff --numstat -- docs/E150/OpenTasks.md | awk '{print $1":"$2}')" = '1:1'
          git diff -- docs/E150/OpenTasks.md

      - name: Verify resulting task is fail-closed
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          text = Path('docs/E150/OpenTasks.md').read_text(encoding='utf-8')
          op = text[text.index('## Kanonischer Operativteil'):text.index('## Historischer Katalog und Evidenz')]
          lines = [line for line in op.splitlines() if 'VOXY-LOCAL-COMPOSITION-RECOVERY-01' in line]
          assert len(lines) == 1
          assert '| review |' in lines[0]
          assert '| codex_ready |' not in lines[0]
          print(lines[0])
          PY

      - name: Commit SSOT delta and self-delete writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/E150/OpenTasks.md
          git rm .github/workflows/opentasks-voxy-local-composition-recovery-close.yml
          mapfile -t CHANGED < <(git diff --cached --name-only | sort)
          EXPECTED=(
            '.github/workflows/opentasks-voxy-local-composition-recovery-close.yml'
            'docs/E150/OpenTasks.md'
          )
          printf '%s\n' "${CHANGED[@]}" > /tmp/changed.actual
          printf '%s\n' "${EXPECTED[@]}" | sort > /tmp/changed.expected
          diff -u /tmp/changed.expected /tmp/changed.actual
          git commit -m 'docs(e150): close #978 recovery authorization'
          git push origin HEAD:docs/governance-ssot-sync-05
