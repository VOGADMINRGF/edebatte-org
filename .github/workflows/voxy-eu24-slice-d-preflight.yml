name: Voxy EU24 Slice D preflight

on:
  push:
    branches:
      - docs/voxy-eu24-slice-d-authorization
    paths:
      - .github/workflows/voxy-eu24-slice-d-preflight.yml

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Checkout exact authorized main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin a54133d71a0b82e91ab3e854bfbc61a00974b252
          git checkout -B main a54133d71a0b82e91ab3e854bfbc61a00974b252
          test "$(git status --porcelain)" = ""
          test "$(git rev-parse HEAD)" = "a54133d71a0b82e91ab3e854bfbc61a00974b252"
      - name: Run task preflight
        run: node scripts/codex-task-preflight.mjs VOXY-EU24-MULTILINGUAL-EDITORIAL-01
