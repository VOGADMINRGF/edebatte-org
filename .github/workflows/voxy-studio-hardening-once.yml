name: One-shot Voxy Studio binding hardening

on:
  push:
    branches:
      - feat/voxy-admin-video-studio-01
    paths:
      - .github/workflows/voxy-studio-hardening-once.yml

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/voxy-admin-video-studio-01
          fetch-depth: 0
      - name: Harden revision binding and audit idempotency
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          service = Path('apps/web/src/features/voxyVideo/studioDraftService.ts')
          text = service.read_text()
          needle = '''  const expectedGate = draft.renderApproval?.decisionGateId ?? null;\n  if (job.status !== "review_ready") errors.push("composition_job_not_review_ready");'''
          replacement = '''  const expectedGate = draft.renderApproval?.decisionGateId ?? null;\n  const expectedApprovalRef = draft.renderApproval?.reviewDecisionRecordId ?? null;\n  const expectedScriptVersion = `story-r${draft.storyPlan.revision}`;\n  if (job.status !== "review_ready") errors.push("composition_job_not_review_ready");\n  if (!expectedApprovalRef || job.approvalRef !== expectedApprovalRef) {\n    errors.push("composition_approval_ref_mismatch");\n  }\n  if (job.scriptVersion !== expectedScriptVersion) {\n    errors.push("composition_story_revision_mismatch");\n  }\n  if (job.locale !== draft.storyPlan.outputLanguage.toLowerCase()) {\n    errors.push("composition_locale_mismatch");\n  }'''
          if needle not in text:
              raise SystemExit('service binding anchor missing')
          service.write_text(text.replace(needle, replacement, 1))

          store = Path('apps/web/src/features/voxyVideo/studioDraftStore.ts')
          text = store.read_text()
          needle = '''      await col.insertOne({\n        _id: event.auditId,\n        draftId: event.draftId,\n        at: event.at,\n        event: clone(event),\n      });'''
          replacement = '''      await col.updateOne(\n        { _id: event.auditId },\n        {\n          $set: {\n            _id: event.auditId,\n            draftId: event.draftId,\n            at: event.at,\n            event: clone(event),\n          },\n        },\n        { upsert: true },\n      );'''
          if needle not in text:
              raise SystemExit('audit append anchor missing')
          store.write_text(text.replace(needle, replacement, 1))
          PY
          git diff --check
          git rm .github/workflows/voxy-studio-hardening-once.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/features/voxyVideo/studioDraftService.ts apps/web/src/features/voxyVideo/studioDraftStore.ts
          git commit -m 'fix(voxy): harden Studio revision binding'
          git push origin HEAD:feat/voxy-admin-video-studio-01
