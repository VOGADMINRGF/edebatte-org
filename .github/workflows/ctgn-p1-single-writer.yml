name: CTGN P1 SSOT single writer

on:
  push:
    branches:
      - docs/governance-ssot-sync-05

permissions:
  contents: write

concurrency:
  group: governance-ssot-writer
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Run bounded single writer
        run: node scripts/ci/ctgn-p1-ssot-single-writer.mjs
