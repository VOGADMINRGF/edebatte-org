name: CTGN P1 SSOT single writer

on:
  push:
    branches:
      - docs/governance-ssot-sync-05

permissions:
  contents: write

concurrency:
  group: governance-ssot-writer
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify writer base and consumed authorizations
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN='0154522b4d6565278cfedf48511c58bd8512ef33'
          WORKFLOW='.github/workflows/ctgn-p1-single-writer.yml'
          git fetch origin main docs/governance-ssot-sync-05
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN"
          test "$(git diff --name-only origin/main...HEAD | grep -v "^${WORKFLOW}$" | wc -l | tr -d ' ')" = '0'
          cmp docs/E150/OpenTasks.md <(git show origin/main:docs/E150/OpenTasks.md)

          git worktree add --detach /tmp/preflight-before origin/main
          git -C /tmp/preflight-before checkout -b main
          for task in \
            QR-INTERNAL-REDIRECT-HARDENING-01 \
            CREATE-OPERATOR-NOTIFICATIONS-01 \
            CROSS-LINGUAL-MEDIA-EVENT-RESEARCH-INTAKE-01
          do
            node /tmp/preflight-before/scripts/codex-task-preflight.mjs "$task" > "/tmp/${task}.before.json"
            cat "/tmp/${task}.before.json"
          done
          node <<'NODE'
          const fs = require('node:fs');
          const ids = [
            'QR-INTERNAL-REDIRECT-HARDENING-01',
            'CREATE-OPERATOR-NOTIFICATIONS-01',
            'CROSS-LINGUAL-MEDIA-EVENT-RESEARCH-INTAKE-01',
          ];
          for (const id of ids) {
            const r = JSON.parse(fs.readFileSync(`/tmp/${id}.before.json`, 'utf8'));
            if (r.status !== 'codex_ready' || r.executable !== true || r.branchCreationAllowed !== true) {
              throw new Error(`unexpected_before_state:${id}:${JSON.stringify(r)}`);
            }
          }
          NODE

      - name: Serialize CTGN P1 repairs and close consumed authorizations
        shell: bash
        run: |
          set -euo pipefail
          python <<'PY'
          from pathlib import Path
          import hashlib, re

          path = Path('docs/E150/OpenTasks.md')
          text = path.read_text(encoding='utf-8')
          operative_marker = '## Kanonischer Operativteil'
          historical_marker = '## Historischer Katalog und Evidenz'

          assert text.count(operative_marker) == 1, 'operative_marker_not_unique'
          assert text.count(historical_marker) == 1, 'historical_marker_not_unique'
          op_start = text.index(operative_marker)
          hist_start = text.index(historical_marker)
          assert op_start < hist_start, 'marker_order_invalid'

          operative = text[op_start:hist_start]
          historical = text[hist_start:]
          historical_hash_before = hashlib.sha256(historical.encode()).hexdigest()

          status_rx = re.compile(r'\|\s*([A-Z0-9][A-Z0-9_.:/-]+)\s*\|\s*(blocked|codex_ready|in_progress|review|manual_gate|done)\s*\|')
          def status_map(region: str):
              out = {}
              for line in region.splitlines():
                  m = status_rx.search(line)
                  if m:
                      out.setdefault(m.group(1), []).append(m.group(2))
              return out

          before = status_map(operative)
          transitions = {
              'QR-INTERNAL-REDIRECT-HARDENING-01': ('codex_ready', 'review'),
              'CREATE-OPERATOR-NOTIFICATIONS-01': ('codex_ready', 'manual_gate'),
              'CROSS-LINGUAL-MEDIA-EVENT-RESEARCH-INTAKE-01': ('codex_ready', 'review'),
          }
          new_ids = [
              'NEWSLETTER-DELIVERY-SEND-TIME-SAFETY-01',
              'DOSSIER-REVISION-ATOMIC-WRITER-01',
          ]
          for task, (old, _) in transitions.items():
              assert before.get(task) == [old], f'unexpected_before_status:{task}:{before.get(task)}'
          for task in new_ids:
              assert task not in before, f'target_already_present:{task}'

          next_text = text
          for task, (old, new) in transitions.items():
              rx = re.compile(rf'(?m)^(\|\s*{re.escape(task)}\s*\|\s*){old}(\s*\|.*)$')
              next_text, count = rx.subn(rf'\g<1>{new}\g<2>', next_text)
              assert count == 1, f'transition_count:{task}:{count}'

          block = '''### C/T/G/N P1 Audit-Repairs — 2026-09-25

Dieser additive Block autorisiert ausschließlich zwei durch den unabhängigen Audit reproduzierte, eng begrenzte Repairs auf den bestehenden kanonischen Ownern. Er eröffnet keine neue Runtime, keinen Store, keine Queue und keine Provider-/Production-Aktivierung. Vor Produktcode bleibt der taskbezogene Preflight auf frischem `main` Pflicht.

| ID | Status | Priorität | Abhängigkeiten / Evidence | Scope / Ziel | Akzeptanz / Guardrails |
| --- | --- | --- | --- | --- | --- |
| NEWSLETTER-DELIVERY-SEND-TIME-SAFETY-01 | codex_ready | P1 | Issue `#865`; `docs/E150/CTGN_P1_REPAIR_INTAKE_2026-09-25.md`; bestehende N1–N9 Runtime, `public_updates_subscribers`, `newsletter_delivery_ledger`, bestehender Delivery-Lease; Authorization `preflight_only` | F1+F2 gemeinsam im bestehenden Newsletter-Sendepfad reparieren: nach Lease aktuelle Subscription-/Consent-/Preference-Truth erneut aus dem kanonischen Subscriber-SSOT lesen und unmittelbar vor externem Handoff fail-closed binden; im bestehenden Delivery-Ledger einen dauerhaften External-Attempt-/Ambiguous-Zustand so modellieren, dass ein unbekannt erfolgreicher Provider-Handoff niemals allein durch Zeitablauf automatisch erneut sendbar wird | Tests müssen Unsubscribe, Suppression, stale consent, Frequenz-/Cadence-Opt-out und Read-Failure zwischen Selection→Lease→Send sowie Crash vor Handoff, Crash nach Handoff, fehlgeschlagenen `sent`-Write, Lease-Expiry, unbekannten Provider-Timeout, Concurrent Recovery und Retry/Idempotenz abdecken; kein zweiter Subscriber-/Delivery-Store; keine Behauptung von Exactly-once ohne Provider-Nachweis; `NEWSLETTER_DELIVERY_ENABLED=false` bleibt Production-Default; keine echte Empfänger-/Provideraktivierung |
| DOSSIER-REVISION-ATOMIC-WRITER-01 | codex_ready | P1 | Issue `#787`; `docs/E150/CTGN_P1_REPAIR_INTAKE_2026-09-25.md`; bestehende Dossier-Owner `features/dossier/revisions.ts` + `features/dossier/db.ts`; bestehende Mongo-Transaction-Capability bestätigt; Authorization `preflight_only` | F4 ohne neue Collection konvergieren: genau einen gemeinsamen bestehenden Dossier-Revision-Writer herstellen; CAS-Erschöpfung muss vor unverketteter Revision hart fehlschlagen; Dossier-Head-Mutation und `dossier_revisions`-Insert müssen in einer DB-gestützten atomaren Grenze oder einem explizit recoverbaren, durch Tests bewiesenen Protokoll zusammengeführt werden | Pflichtregressionen: zwei konkurrierende Writer, exhausted CAS, Revision-Insert-Fehler nach Head-CAS, Retry/Idempotenz desselben Vorgangs, Recovery ohne orphan/unlinked Revision sowie beide bisherigen Call-Pfade; kein zweiter Dossier-/Revision-Store; keine T6-/T3–T8-Freigabe; keine Graph-/Truth-/Publish-Autorität |

'''
          assert '### C/T/G/N P1 Audit-Repairs — 2026-09-25' not in next_text, 'repair_block_already_present'
          insert_at = next_text.index(historical_marker)
          next_text = next_text[:insert_at] + block + next_text[insert_at:]

          next_hist_start = next_text.index(historical_marker)
          new_operative = next_text[next_text.index(operative_marker):next_hist_start]
          new_historical = next_text[next_hist_start:]
          assert new_historical == historical, 'historical_tail_changed'
          assert hashlib.sha256(new_historical.encode()).hexdigest() == historical_hash_before, 'historical_hash_changed'

          after = status_map(new_operative)
          changed_existing = {
              task: (before.get(task), after.get(task))
              for task in before
              if before.get(task) != after.get(task)
          }
          expected_changed = {
              task: ([old], [new])
              for task, (old, new) in transitions.items()
          }
          assert changed_existing == expected_changed, f'unexpected_existing_status_delta:{changed_existing}'
          for task in new_ids:
              assert after.get(task) == ['codex_ready'], f'new_task_bad_status:{task}:{after.get(task)}'
          for task, statuses in after.items():
              assert len(statuses) == 1, f'duplicate_task_id_after:{task}:{statuses}'

          path.write_text(next_text, encoding='utf-8')
          print('historical_tail_sha256:', historical_hash_before)
          print('transitions:', expected_changed)
          print('added:', new_ids)
          PY

          git diff --check -- docs/E150/OpenTasks.md
          git diff -- docs/E150/OpenTasks.md

      - name: Commit candidate, verify preflights, and self delete writer
        shell: bash
        run: |
          set -euo pipefail
          WORKFLOW='.github/workflows/ctgn-p1-single-writer.yml'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/E150/OpenTasks.md
          git rm "$WORKFLOW"
          mapfile -t CHANGED < <(git diff --cached --name-only | sort)
          EXPECTED=(
            '.github/workflows/ctgn-p1-single-writer.yml'
            'docs/E150/OpenTasks.md'
          )
          printf '%s\n' "${CHANGED[@]}" > /tmp/changed.actual
          printf '%s\n' "${EXPECTED[@]}" | sort > /tmp/changed.expected
          diff -u /tmp/changed.expected /tmp/changed.actual
          git commit -m 'docs(e150): serialize CTGN P1 repair authorizations'

          CANDIDATE="$(git rev-parse HEAD)"
          test "$(git status --porcelain)" = ''
          test "$(git diff --name-only origin/main...HEAD | sed '/^$/d')" = 'docs/E150/OpenTasks.md'

          git branch -f main "$CANDIDATE"
          git worktree add /tmp/preflight-after main
          (
            cd /tmp/preflight-after
            node scripts/codex-task-preflight.mjs NEWSLETTER-DELIVERY-SEND-TIME-SAFETY-01 > /tmp/newsletter-after.json
            node scripts/codex-task-preflight.mjs DOSSIER-REVISION-ATOMIC-WRITER-01 > /tmp/dossier-after.json
            cat /tmp/newsletter-after.json
            cat /tmp/dossier-after.json
            node --input-type=module <<'NODE'
            import fs from 'node:fs';
            import { getTaskStatus } from './scripts/codex-task-preflight.mjs';
            for (const file of ['/tmp/newsletter-after.json', '/tmp/dossier-after.json']) {
              const r = JSON.parse(fs.readFileSync(file, 'utf8'));
              if (r.status !== 'codex_ready' || r.executable !== true || r.branchCreationAllowed !== true) {
                throw new Error(`new_task_not_executable:${JSON.stringify(r)}`);
              }
            }
            const expected = new Map([
              ['QR-INTERNAL-REDIRECT-HARDENING-01', 'review'],
              ['CREATE-OPERATOR-NOTIFICATIONS-01', 'manual_gate'],
              ['CROSS-LINGUAL-MEDIA-EVENT-RESEARCH-INTAKE-01', 'review'],
            ]);
            for (const [id, status] of expected) {
              const actual = await getTaskStatus(id);
              if (actual !== status) throw new Error(`${id}:${actual}!=${status}`);
              console.log(`${id}=${actual}`);
            }
            NODE
            git diff --check
          )
          git worktree remove /tmp/preflight-after
          git push origin HEAD:docs/governance-ssot-sync-05
