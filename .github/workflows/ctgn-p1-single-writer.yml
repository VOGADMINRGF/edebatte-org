name: CTGN P1 SSOT single writer

on:
  push:
    branches:
      - docs/governance-ssot-sync-05
    paths:
      - .github/workflows/ctgn-p1-single-writer.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/governance-ssot-sync-05

      - name: Reconcile bounded CTGN P1 repair authorizations
        shell: bash
        env:
          EXPECTED_MAIN: 0154522b4d6565278cfedf48511c58bd8512ef33
          EXPECTED_OPEN_TASKS_BLOB: faaafc47a966b78a5d247436de47aebd3455d6b9
          WORKFLOW_PATH: .github/workflows/ctgn-p1-single-writer.yml
        run: |
          set -euo pipefail

          git config user.name "VOGADMINRGF"
          git config user.email "rgf@voiceopengov.de"
          git fetch origin main

          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse origin/main:docs/E150/OpenTasks.md)" = "$EXPECTED_OPEN_TASKS_BLOB"
          test "$(git rev-parse HEAD:docs/E150/OpenTasks.md)" = "$EXPECTED_OPEN_TASKS_BLOB"

          changed_before="$(git diff --name-only "$EXPECTED_MAIN"...HEAD | sed '/^$/d')"
          test "$changed_before" = "$WORKFLOW_PATH"

          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = 'docs/E150/OpenTasks.md';
          const historyMarker = '## Historischer Katalog und Evidenz';
          const operativeMarker = '## Kanonischer Operativteil';
          const text = fs.readFileSync(path, 'utf8');

          const historyIndex = text.indexOf(historyMarker);
          const operativeIndex = text.indexOf(operativeMarker);
          if (operativeIndex < 0 || historyIndex < 0 || historyIndex <= operativeIndex) {
            throw new Error('open_tasks_structure_unclear');
          }
          if (text.indexOf(historyMarker, historyIndex + historyMarker.length) !== -1) {
            throw new Error('duplicate_history_marker');
          }
          if (text.indexOf(operativeMarker, operativeIndex + operativeMarker.length) !== -1) {
            throw new Error('duplicate_operative_marker');
          }

          const beforeHistory = text.slice(historyIndex);
          const historyHash = crypto.createHash('sha256').update(beforeHistory).digest('hex');
          const beforeHead = text.slice(operativeIndex, historyIndex);

          function rowMap(head) {
            const map = new Map();
            for (const line of head.split(/\r?\n/)) {
              const trimmed = line.trim();
              if (!trimmed.startsWith('|')) continue;
              const cells = trimmed.split('|').slice(1, -1).map((cell) => cell.trim());
              if (cells.length < 2 || cells[0] === 'ID' || cells.every((cell) => /^:?-{3,}:?$/.test(cell))) continue;
              const id = cells[0];
              if (!id) continue;
              if (map.has(id)) throw new Error(`duplicate_task_id_before:${id}`);
              map.set(id, line);
            }
            return map;
          }

          const beforeRows = rowMap(beforeHead);
          const transitions = new Map([
            ['QR-INTERNAL-REDIRECT-HARDENING-01', ['codex_ready', 'review']],
            ['CREATE-OPERATOR-NOTIFICATIONS-01', ['codex_ready', 'manual_gate']],
            ['CROSS-LINGUAL-MEDIA-EVENT-RESEARCH-INTAKE-01', ['codex_ready', 'review']],
          ]);
          const newIds = [
            'NEWSLETTER-DELIVERY-SEND-TIME-SAFETY-01',
            'DOSSIER-REVISION-ATOMIC-WRITER-01',
          ];

          for (const id of newIds) {
            if (beforeRows.has(id)) throw new Error(`target_task_already_exists:${id}`);
          }

          let next = text;
          for (const [id, [from, to]] of transitions) {
            const escaped = id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
            const re = new RegExp(`^(\\|\\s*${escaped}\\s*\\|\\s*)${from}(\\s*\\|.*)$`, 'gm');
            let count = 0;
            next = next.replace(re, (...args) => {
              count += 1;
              return `${args[1]}${to}${args[2]}`;
            });
            if (count !== 1) throw new Error(`status_transition_not_unique:${id}:${count}`);
          }

          const block = `### C/T/G/N P1 Audit-Repairs — 2026-09-25\n\nDieser additive Block autorisiert ausschließlich zwei durch den unabhängigen Audit reproduzierte, eng begrenzte Repairs auf den bestehenden kanonischen Ownern. Er eröffnet keine neue Runtime, keinen Store, keine Queue und keine Provider-/Production-Aktivierung. Vor Produktcode bleibt der taskbezogene Preflight auf frischem \`main\` Pflicht.\n\n| ID | Status | Priorität | Abhängigkeiten / Evidence | Scope / Ziel | Akzeptanz / Guardrails |\n| --- | --- | --- | --- | --- | --- |\n| NEWSLETTER-DELIVERY-SEND-TIME-SAFETY-01 | codex_ready | P1 | Issue \`#865\`; \`docs/E150/CTGN_P1_REPAIR_INTAKE_2026-09-25.md\`; bestehende N1–N9 Runtime, \`public_updates_subscribers\`, \`newsletter_delivery_ledger\`, bestehender Delivery-Lease; Authorization \`preflight_only\` | F1+F2 gemeinsam im bestehenden Newsletter-Sendepfad reparieren: nach Lease aktuelle Subscription-/Consent-/Preference-Truth erneut aus dem kanonischen Subscriber-SSOT lesen und unmittelbar vor externem Handoff fail-closed binden; im bestehenden Delivery-Ledger einen dauerhaften External-Attempt-/Ambiguous-Zustand so modellieren, dass ein unbekannt erfolgreicher Provider-Handoff niemals allein durch Zeitablauf automatisch erneut sendbar wird | Tests müssen Unsubscribe, Suppression, stale consent, Frequenz-/Cadence-Opt-out und Read-Failure zwischen Selection→Lease→Send sowie Crash vor Handoff, Crash nach Handoff, fehlgeschlagenen \`sent\`-Write, Lease-Expiry, unbekannten Provider-Timeout, Concurrent Recovery und Retry/Idempotenz abdecken; kein zweiter Subscriber-/Delivery-Store; keine Behauptung von Exactly-once ohne Provider-Nachweis; \`NEWSLETTER_DELIVERY_ENABLED=false\` bleibt Production-Default; keine echte Empfänger-/Provideraktivierung |\n| DOSSIER-REVISION-ATOMIC-WRITER-01 | codex_ready | P1 | Issue \`#787\`; \`docs/E150/CTGN_P1_REPAIR_INTAKE_2026-09-25.md\`; bestehende Dossier-Owner \`features/dossier/revisions.ts\` + \`features/dossier/db.ts\`; bestehende Mongo-Transaction-Capability bestätigt; Authorization \`preflight_only\` | F4 ohne neue Collection konvergieren: genau einen gemeinsamen bestehenden Dossier-Revision-Writer herstellen; CAS-Erschöpfung muss vor unverketteter Revision hart fehlschlagen; Dossier-Head-Mutation und \`dossier_revisions\`-Insert müssen in einer DB-gestützten atomaren Grenze oder einem explizit recoverbaren, durch Tests bewiesenen Protokoll zusammengeführt werden | Pflichtregressionen: zwei konkurrierende Writer, exhausted CAS, Revision-Insert-Fehler nach Head-CAS, Retry/Idempotenz desselben Vorgangs, Recovery ohne orphan/unlinked Revision sowie beide bisherigen Call-Pfade; kein zweiter Dossier-/Revision-Store; keine T6-/T3–T8-Freigabe; keine Graph-/Truth-/Publish-Autorität |\n\n`;

          if (next.includes('### C/T/G/N P1 Audit-Repairs — 2026-09-25')) {
            throw new Error('repair_block_already_present');
          }
          const insertAt = next.indexOf(historyMarker);
          next = next.slice(0, insertAt) + block + next.slice(insertAt);

          const nextHistoryIndex = next.indexOf(historyMarker);
          const afterHistory = next.slice(nextHistoryIndex);
          const afterHistoryHash = crypto.createHash('sha256').update(afterHistory).digest('hex');
          if (afterHistoryHash !== historyHash || afterHistory !== beforeHistory) {
            throw new Error('historical_tail_changed');
          }

          const afterHead = next.slice(next.indexOf(operativeMarker), nextHistoryIndex);
          const afterRows = rowMap(afterHead);
          for (const [id, line] of beforeRows) {
            if (transitions.has(id)) continue;
            if (afterRows.get(id) !== line) throw new Error(`preexisting_task_row_changed:${id}`);
          }
          for (const [id, [, to]] of transitions) {
            const row = afterRows.get(id);
            if (!row || !new RegExp(`^\\|\\s*${id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s*\\|\\s*${to}\\s*\\|`).test(row.trim())) {
              throw new Error(`transition_verification_failed:${id}`);
            }
          }
          for (const id of newIds) {
            const row = afterRows.get(id);
            if (!row || !new RegExp(`^\\|\\s*${id.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')}\\s*\\|\\s*codex_ready\\s*\\|`).test(row.trim())) {
              throw new Error(`new_task_verification_failed:${id}`);
            }
          }
          if (afterRows.size !== beforeRows.size + newIds.length) {
            throw new Error(`unexpected_task_count_delta:${beforeRows.size}->${afterRows.size}`);
          }

          fs.writeFileSync(path, next);
          console.log(JSON.stringify({
            historyHash,
            beforeTaskCount: beforeRows.size,
            afterTaskCount: afterRows.size,
            transitions: Object.fromEntries(transitions),
            added: newIds,
          }, null, 2));
          NODE

          git diff --check

          rm "$WORKFLOW_PATH"
          git add docs/E150/OpenTasks.md "$WORKFLOW_PATH"
          git commit -m "docs(e150): serialize CTGN P1 repair authorizations"

          candidate_sha="$(git rev-parse HEAD)"
          test "$(git status --porcelain)" = ""
          changed_after="$(git diff --name-only "$EXPECTED_MAIN"...HEAD | sed '/^$/d')"
          test "$changed_after" = "docs/E150/OpenTasks.md"

          git branch -f main "$candidate_sha"
          git worktree add /tmp/ctgn-preflight main
          (
            cd /tmp/ctgn-preflight
            node scripts/codex-task-preflight.mjs NEWSLETTER-DELIVERY-SEND-TIME-SAFETY-01
            node scripts/codex-task-preflight.mjs DOSSIER-REVISION-ATOMIC-WRITER-01
            node --input-type=module <<'NODE'
            import { getTaskStatus } from './scripts/codex-task-preflight.mjs';
            const expected = new Map([
              ['QR-INTERNAL-REDIRECT-HARDENING-01', 'review'],
              ['CREATE-OPERATOR-NOTIFICATIONS-01', 'manual_gate'],
              ['CROSS-LINGUAL-MEDIA-EVENT-RESEARCH-INTAKE-01', 'review'],
            ]);
            for (const [id, status] of expected) {
              const actual = await getTaskStatus(id);
              if (actual !== status) throw new Error(`${id}:${actual}!=${status}`);
              console.log(`${id}=${actual}`);
            }
            NODE
            git diff --check
          )
          git worktree remove /tmp/ctgn-preflight

          git push origin HEAD:docs/governance-ssot-sync-05
