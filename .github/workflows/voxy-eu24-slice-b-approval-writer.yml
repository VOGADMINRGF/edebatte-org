name: Voxy EU24 Slice B approval convergence

on:
  push:
    branches:
      - feat/voxy-eu24-language-variant-02

permissions:
  contents: write

jobs:
  converge:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/voxy-eu24-language-variant-02
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm
      - name: Converge onto current main and bind approval validation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main --no-tags
          BASE_SHA="$(git rev-parse origin/main)"
          echo "Converging Slice B onto main@${BASE_SHA}"
          git merge --no-edit "$BASE_SHA"
          python3 - <<'PY'
          from pathlib import Path

          path = Path('apps/web/src/features/voxyVideo/editorialStoryPlan.ts')
          text = path.read_text(encoding='utf-8')
          import_anchor = 'import type { VoxyVideoFormat } from "./modernCharacterContracts";\n'
          variant_import = '''import {\n  getVoxyEditorialLanguageVariantBinding,\n  validateVoxyEditorialLanguageVariantBinding,\n  type VoxyEditorialLanguageVariantBinding,\n} from "./editorialLanguageVariant";\n'''
          assert text.count(import_anchor) == 1
          assert 'VoxyEditorialLanguageVariantBinding' not in text
          text = text.replace(import_anchor, import_anchor + variant_import, 1)

          field_anchor = '  derivedFromRevision: number | null;\n  reviewRequired: true;\n'
          field_insert = '  derivedFromRevision: number | null;\n  languageVariant?: VoxyEditorialLanguageVariantBinding | null;\n  reviewRequired: true;\n'
          assert text.count(field_anchor) == 1
          text = text.replace(field_anchor, field_insert, 1)

          guard_anchor = '''  if (plan.reviewRequired !== true || plan.autoRender !== false || plan.autoPublish !== false) {\n    pushUnique(result.errors, "review_first_guardrails_broken");\n  }\n'''
          assert text.count(guard_anchor) == 1
          guard_insert = guard_anchor + '''  const languageVariant = getVoxyEditorialLanguageVariantBinding(plan);\n  for (const error of validateVoxyEditorialLanguageVariantBinding(plan)) {\n    pushUnique(result.errors, error);\n  }\n  if (languageVariant) {\n    if (languageVariant.translationStatus !== "approved") {\n      pushUnique(\n        result.approvalBlockers,\n        `language_variant_translation_not_approved:${languageVariant.translationStatus}`,\n      );\n    }\n    if (languageVariant.evidenceSourcePackId !== context.sourcePack.sourcePackId) {\n      pushUnique(result.approvalBlockers, "language_variant_evidence_fingerprint_changed");\n    }\n  }\n'''
          text = text.replace(guard_anchor, guard_insert, 1)
          path.write_text(text, encoding='utf-8')

          test_path = Path('apps/web/tests/voxy-editorial-language-variant.contract.test.ts')
          test = test_path.read_text(encoding='utf-8')
          test_import_anchor = 'import type { VoxyEditorialStoryPlan } from "@/features/voxyVideo/editorialStoryPlan";\n'
          test_import = 'import { validateVoxyEditorialStoryPlan, type VoxyEditorialStoryPlan } from "@/features/voxyVideo/editorialStoryPlan";\n'
          assert test.count(test_import_anchor) == 1
          test = test.replace(test_import_anchor, test_import, 1)
          legacy_anchor = '''  it("preserves the legacy script version for non-translated master plans", () => {\n'''
          assert test.count(legacy_anchor) == 1
          extra = '''  it("blocks editorial approval when translation review or evidence binding is stale", () => {\n    const variant = frenchVariant();\n    const pending = {\n      ...variant,\n      languageVariant: { ...variant.languageVariant, translationStatus: "needs_review" as const },\n    };\n    const context = {\n      sourcePack: { sourcePackId: "source-pack-new", sources: [], openGaps: [], reviewRequired: true, autoPublish: false },\n      claims: [],\n      findings: [],\n      openQuestions: [],\n    } as any;\n    const validation = validateVoxyEditorialStoryPlan(pending, context);\n    expect(validation.approvalBlockers).toEqual(\n      expect.arrayContaining([\n        "language_variant_translation_not_approved:needs_review",\n        "language_variant_evidence_fingerprint_changed",\n      ]),\n    );\n    expect(validation.renderEligible).toBe(false);\n  });\n\n'''
          test = test.replace(legacy_anchor, extra + legacy_anchor, 1)
          test_path.write_text(test, encoding='utf-8')
          PY
          git diff --check
      - name: Validate current-main convergence
        run: |
          pnpm install --frozen-lockfile
          pnpm -C apps/web exec vitest run tests/voxy-editorial-language-variant.contract.test.ts tests/voxy-editorial-story-plan.contract.test.ts tests/voxy-local-composition-runtime.contract.test.ts tests/voxy-local-composition-freshness.contract.test.ts tests/voxy-studio-locale-review-matrix.contract.test.ts tests/voxy-studio-render-handoff.contract.test.ts
          pnpm -C apps/web run typecheck
          git diff --check
      - name: Commit convergence, remove writer and push
        shell: bash
        run: |
          set -euo pipefail
          git add apps/web/src/features/voxyVideo/editorialStoryPlan.ts apps/web/tests/voxy-editorial-language-variant.contract.test.ts
          git rm .github/workflows/voxy-eu24-slice-b-approval-writer.yml
          git commit -m 'fix(voxy): converge Slice B approval on current main'
          git diff origin/main..HEAD --check
          git push origin HEAD:feat/voxy-eu24-language-variant-02
