name: CTGN P1 delta reauthorization

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  reconcile:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Reauthorize exact existing repair tasks
        shell: bash
        run: |
          set -euo pipefail
          FILE=docs/E150/OpenTasks.md
          python - <<'PY'
          from pathlib import Path

          p = Path('docs/E150/OpenTasks.md')
          lines = p.read_text().splitlines(keepends=True)
          replacements = {
            'NEWSLETTER-DELIVERY-SEND-TIME-SAFETY-01': {
              'required': ['| review |','Issue `#865`','Authorization `preflight_only`','`public_updates_subscribers`','`newsletter_delivery_ledger`'],
              'scope': 'Closeout-Delta F3/F1/F4 im bestehenden Newsletter-Owner schließen: Account-`newsletterOptIn=false` als Adapter an `public_updates_subscribers` binden, ohne Re-Opt-in/Double-opt-in zu umgehen; Consent/Suppression/Preferences unmittelbar vor External-Handoff fail-closed aus dem kanonischen Subscriber-SSOT revalidieren; ausgewählte Newsletter-Kandidaten an den aktuellen kanonischen Social-Post-/Freigabezustand binden und gesperrte, zurückgezogene oder materiell geänderte Inhalte vor Provider-Handoff ausschließen; bestehende External-Attempt-/Ambiguous-Replay-Grenze unverändert erhalten',
              'acceptance': 'Pflichtregressionen für Account-Abwahl gegen aktive Subscription, Re-Opt-in ohne Consent-Bypass, Abmeldung/Suppression/Preference-Änderung nach früherem Subscriber-Reload, Subscriber-Read-Failure an der finalen Handoff-Grenze sowie Content `approved→blocked`/withdrawn/geändert nach Candidate-Selection; kein zweiter Subscriber-/Delivery-/Content-Store, keine neue Queue, kein Provider-/Secret-/Production-Enablement; `NEWSLETTER_DELIVERY_ENABLED=false` bleibt Default',
            },
            'DOSSIER-REVISION-ATOMIC-WRITER-01': {
              'required': ['| review |','Issue `#787`','Authorization `preflight_only`','`features/dossier/revisions.ts`','`features/dossier/db.ts`'],
              'scope': 'Closeout-Delta F2 im bestehenden Dossier-Owner schließen: die kanonische Revisionstransaktion so bis zu den aufrufenden Fachmutationen erweitern, dass Claim-/Dossier-Mutation, Dossier-Head und `dossier_revisions` gemeinsam committen oder gemeinsam zurückrollen; mindestens `claims/upsert`, `ensureDossier` und `updateDossierCounts` auf dieselbe atomare/recoverbare Grenze ziehen, ohne neuen Writer oder Store',
              'acceptance': 'Pflichtregressionen: Claim-Mutation + Revisionsfehler rollt vollständig zurück; `ensureDossier` und `updateDossierCounts` hinterlassen bei Revisions-/Transaktionsfehler keine unrevidierte Fachänderung; bestehende Concurrent-Writer-, CAS-Exhaustion-, Insert-Rollback-, Retry-/Idempotenz- und Hash-Chain-Verträge bleiben grün; kein zweiter Dossier-/Revision-Store, keine T3–T9-/Graph-/Truth-/Publish-Autorität',
            },
          }
          changed = []
          for task_id, cfg in replacements.items():
              matches = [i for i, line in enumerate(lines) if task_id in line and line.lstrip().startswith('|')]
              if len(matches) != 1:
                  raise SystemExit(f'{task_id}: expected exactly one table row, got {len(matches)}')
              i = matches[0]
              before = lines[i]
              for token in cfg['required']:
                  if token not in before:
                      raise SystemExit(f'{task_id}: missing required token {token!r}')
              cells = before.rstrip('\n').split(' | ')
              if len(cells) != 6:
                  raise SystemExit(f'{task_id}: unexpected table shape with {len(cells)} cells')
              cells[1] = 'codex_ready'
              cells[4] = cfg['scope']
              cells[5] = cfg['acceptance'] + ' |'
              after = ' | '.join(cells) + ('\n' if before.endswith('\n') else '')
              lines[i] = after
              changed.append((task_id, before.rstrip(), after.rstrip()))
          p.write_text(''.join(lines))
          for task_id, before, after in changed:
              print(f'[{task_id}]')
              print('BEFORE:', before)
              print('AFTER :', after)
          PY
          test "$(git diff --name-only)" = "$FILE"
          test "$(git diff --numstat -- "$FILE")" = $'2\t2\tdocs/E150/OpenTasks.md'
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$FILE"
          git commit -m 'docs(e150): reauthorize CTGN P1 delta repairs'
          git push origin HEAD
          git rm .github/workflows/ctgn-p1-delta-reauthorize.yml
          git commit -m 'chore(governance): remove CTGN P1 delta writer'
          git push origin HEAD
