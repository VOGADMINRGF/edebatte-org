      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Focused AAA1 contracts
        run: pnpm -C apps/web exec vitest run tests/voxy-language-variant-master-freshness.contract.test.ts
      - name: Typecheck
        run: pnpm -C apps/web run typecheck
      - name: Commit product delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "2"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/features/voxyVideo/studioLocalCompositionFreshness.ts apps/web/tests/voxy-language-variant-master-freshness.contract.test.ts
          git commit -m 'fix(voxy): enforce transitive language variant freshness'
          git push origin HEAD
