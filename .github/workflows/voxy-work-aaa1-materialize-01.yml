name: Voxy Work AAA1 materialize

on:
  push:
    branches:
      - fix/voxy-work-aaa1-transitive-freshness-01

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact authorized main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "bedd18db546279c6d4069d1d892e7516e420adbb"
          test "$(git merge-base HEAD origin/main)" = "bedd18db546279c6d4069d1d892e7516e420adbb"
          git checkout -B main origin/main
          node scripts/codex-task-preflight.mjs VOXY-EU24-MULTILINGUAL-EDITORIAL-01 > /tmp/preflight.json 2>&1
          cat /tmp/preflight.json
          grep -q '"status": "codex_ready"' /tmp/preflight.json
          grep -q '"executable": true' /tmp/preflight.json
          git checkout fix/voxy-work-aaa1-transitive-freshness-01
      - name: Apply transitive freshness repair
        run: python scripts/voxy-work-aaa1-materialize.py
      - name: Diff guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git diff --name-only | wc -l | tr -d ' ')" = "2"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Focused AAA1 contracts
        run: pnpm -C apps/web exec vitest run tests/voxy-language-variant-master-freshness.contract.test.ts
      - name: Typecheck
        run: pnpm -C apps/web run typecheck
      - name: Commit product delta
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add apps/web/src/features/voxyVideo/studioLocalCompositionFreshness.ts apps/web/tests/voxy-language-variant-master-freshness.contract.test.ts
          git commit -m 'fix(voxy): enforce transitive language variant freshness'
          git push origin HEAD
