name: OpenTasks YouTube runtime base audit

on:
  push:
    branches:
      - docs/youtube-serverless-runtime-serialize-01

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/youtube-serverless-runtime-serialize-01
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Audit exact current SSOT base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "19432c64120b874a4e0b8a5d2ddc52fedeacea8c"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          test "$(git diff --name-only origin/main..HEAD)" = ".github/workflows/opentasks-youtube-serverless-runtime-audit.yml"
          test "$(git rev-parse 'HEAD:docs/E150/OpenTasks.md')" = "1ec416ce8ebd4dbef6f2c34e4dba85d8de188c56"
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          import re

          path = Path('docs/E150/OpenTasks.md')
          text = path.read_text(encoding='utf-8')
          operative = '## Kanonischer Operativteil'
          history = '## Historischer Katalog und Evidenz'
          target = 'YOUTUBE-SERVERLESS-SOURCE-RUNTIME-01'

          def parse_statuses(region: str):
              statuses = {}
              active_header = None
              for raw_line in region.splitlines():
                  line = raw_line.strip()
                  if not line.startswith('|'):
                      continue
                  cells = [cell.strip() for cell in line.split('|')[1:-1]]
                  if not cells:
                      continue
                  if all(re.fullmatch(r':?-{3,}:?', cell or '') for cell in cells):
                      continue
                  if 'ID' in cells and 'Status' in cells:
                      active_header = cells
                      continue
                  if not active_header or len(cells) < len(active_header):
                      continue
                  row = dict(zip(active_header, cells))
                  row_id = row.get('ID', '')
                  status = row.get('Status', '')
                  if row_id and status:
                      if row_id in statuses:
                          raise SystemExit(f'STOP duplicate task {row_id}')
                      statuses[row_id] = status
              return statuses

          assert text.count(operative) == 1
          assert text.count(history) == 1
          op_index = text.index(operative)
          history_index = text.index(history)
          assert op_index < history_index
          region = text[op_index:history_index]
          tail = text[history_index:]
          statuses = parse_statuses(region)
          assert target not in region
          for required in (
              'CROSS-LINGUAL-MEDIA-EVENT-RESEARCH-INTAKE-01',
              'GLOBAL-TOPIC-INTELLIGENCE-VERIFICATION-ORCHESTRATION-01',
              'PROVENANCE-EVIDENCE-LINEAGE-CROSS-LINGUAL-TOPIC-GRAPH-01',
              'VOXY-EU24-MULTILINGUAL-EDITORIAL-01',
              'VOXY-200PCT-VISUAL-QA-CHECKPOINT-01',
          ):
              assert required in statuses, f'missing={required}'
          print('OPENTASKS_BLOB=1ec416ce8ebd4dbef6f2c34e4dba85d8de188c56')
          print('HISTORICAL_TAIL_SHA256=' + sha256(tail.encode('utf-8')).hexdigest())
          for key in (
              'CROSS-LINGUAL-MEDIA-EVENT-RESEARCH-INTAKE-01',
              'GLOBAL-TOPIC-INTELLIGENCE-VERIFICATION-ORCHESTRATION-01',
              'PROVENANCE-EVIDENCE-LINEAGE-CROSS-LINGUAL-TOPIC-GRAPH-01',
              'VOXY-EU24-MULTILINGUAL-EDITORIAL-01',
              'VOXY-200PCT-VISUAL-QA-CHECKPOINT-01',
          ):
              print(f'{key}={statuses[key]}')
          PY
