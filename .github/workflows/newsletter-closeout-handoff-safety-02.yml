name: Newsletter closeout preflight diagnostic

on:
  push:
    branches:
      - fix/newsletter-closeout-handoff-safety-02

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/newsletter-closeout-handoff-safety-02
      - name: Capture clean preflight result
        shell: bash
        run: |
          set -u
          OUT=newsletter-closeout-preflight-diagnostic.txt
          : > "$OUT"
          printf 'main=%s\n' "$(git rev-parse origin/main 2>/dev/null || true)" >> "$OUT"
          printf 'status_before=%s\n' "$(git status --porcelain | wc -l)" >> "$OUT"
          node scripts/codex-task-preflight.mjs NEWSLETTER-DELIVERY-SEND-TIME-SAFETY-01 >> "$OUT" 2>&1 || true
          git config user.name 'VOGADMINRGF'
          git config user.email 'rgf@voiceopengov.de'
          git add "$OUT"
          git commit -m 'chore(newsletter): capture closeout preflight diagnostic'
          git push origin HEAD:fix/newsletter-closeout-handoff-safety-02
