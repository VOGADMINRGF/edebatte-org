name: Newsletter closeout handoff repair

on:
  push:
    branches:
      - fix/newsletter-closeout-handoff-safety-02

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/newsletter-closeout-handoff-safety-02
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Apply bounded F3 F1 F4 repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git merge-base HEAD origin/main)" = "14f2350dd53317088014ccd45ee3687cb117b111"
          python <<'PY'
          from pathlib import Path

          account = Path('features/account/service.ts')
          s = account.read_text()
          s = s.replace('import { ObjectId, getCol } from "@core/db/triMongo";', 'import { ObjectId, coreCol, getCol } from "@core/db/triMongo";', 1)
          marker = 'const RESEARCH_XP_AWARD = 25;\n'
          block = '''const RESEARCH_XP_AWARD = 25;\nconst NEWSLETTER_SUBSCRIBERS_COLLECTION = "public_updates_subscribers";\nconst REQUIRED_NEWSLETTER_CONSENT_VERSION = process.env.UPDATES_CONSENT_VERSION || "updates_v1";\n\ntype AccountNewsletterSubscriberDoc = {\n  email: string;\n  userId?: string | null;\n  status?: "pending" | "active" | "unsubscribed" | "suppressed";\n  consentVersion?: string | null;\n  unsubscribedAt?: Date | null;\n  updatedAt?: Date | null;\n};\n\nasync function loadCanonicalNewsletterOptIn(userId: string, email?: string | null) {\n  const normalizedEmail = String(email ?? "").trim().toLowerCase();\n  if (!normalizedEmail) return false;\n  const subscribers = await coreCol<AccountNewsletterSubscriberDoc>(NEWSLETTER_SUBSCRIBERS_COLLECTION);\n  const subscriber = await subscribers.findOne({ $or: [{ userId }, { email: normalizedEmail }] } as never);\n  return Boolean(subscriber?.status === "active" && subscriber?.consentVersion === REQUIRED_NEWSLETTER_CONSENT_VERSION);\n}\n\nasync function applyCanonicalNewsletterAccountPreference(userId: string, email: string, newsletterOptIn: boolean) {\n  if (newsletterOptIn) return;\n  const normalizedEmail = email.trim().toLowerCase();\n  if (!normalizedEmail) return;\n  const subscribers = await coreCol<AccountNewsletterSubscriberDoc>(NEWSLETTER_SUBSCRIBERS_COLLECTION);\n  const now = new Date();\n  await subscribers.updateOne(\n    { $or: [{ userId }, { email: normalizedEmail }], status: { $ne: "suppressed" } } as never,\n    { $set: { status: "unsubscribed", unsubscribedAt: now, updatedAt: now } },\n  );\n}\n'''
          if s.count(marker) != 1: raise SystemExit('account constant anchor mismatch')
          s = s.replace(marker, block, 1)
          marker = '  const accountUserId = String(doc._id);\n  const roles = deriveRoles(doc);\n'
          repl = '''  const accountUserId = String(doc._id);\n  let newsletterOptIn = false;\n  try {\n    newsletterOptIn = await loadCanonicalNewsletterOptIn(accountUserId, doc.email);\n  } catch {\n    newsletterOptIn = false;\n  }\n  const roles = deriveRoles(doc);\n'''
          if s.count(marker) != 1: raise SystemExit('account overview anchor mismatch')
          s = s.replace(marker, repl, 1)
          if s.count('    newsletterOptIn: doc.settings?.newsletterOptIn ?? false,') != 1: raise SystemExit('account legacy read anchor mismatch')
          s = s.replace('    newsletterOptIn: doc.settings?.newsletterOptIn ?? false,', '    newsletterOptIn,', 1)
          marker = '''export async function updateAccountSettings(\n  userId: string,\n  patch: AccountSettingsUpdate,\n): Promise<AccountOverview | null> {\n  const oid = parseObjectId(userId);\n  if (!oid) return null;\n\n  const setOps: Record<string, any> = {};'''
          repl = '''export async function updateAccountSettings(\n  userId: string,\n  patch: AccountSettingsUpdate,\n): Promise<AccountOverview | null> {\n  const oid = parseObjectId(userId);\n  if (!oid) return null;\n\n  if (typeof patch.newsletterOptIn === "boolean") {\n    const Users = await getCol<UserDoc>("users");\n    const user = await Users.findOne({ _id: oid }, { projection: { email: 1 } });\n    if (!user?.email) return null;\n    await applyCanonicalNewsletterAccountPreference(userId, user.email, patch.newsletterOptIn);\n  }\n\n  const setOps: Record<string, any> = {};'''
          if s.count(marker) != 1: raise SystemExit('account update anchor mismatch')
          s = s.replace(marker, repl, 1)
          legacy = '''  if (typeof patch.newsletterOptIn === "boolean") {\n    setOps["settings.newsletterOptIn"] = patch.newsletterOptIn;\n  }\n'''
          if s.count(legacy) != 1: raise SystemExit('legacy newsletter write anchor mismatch')
          s = s.replace(legacy, '', 1)
          account.write_text(s)

          runtime = Path('apps/web/src/features/newsletter/newsletterRuntime.ts')
          s = runtime.read_text()
          marker = '''  dossierId?: string | null;\n  sourceCreatedByUserId?: string | null;\n};'''
          repl = '''  dossierId?: string | null;\n  sourceCreatedByUserId?: string | null;\n  sourceRecordId?: string | null;\n  sourceRevision?: string | null;\n};'''
          if s.count(marker) != 1: raise SystemExit('candidate type anchor mismatch')
          s = s.replace(marker, repl, 1)
          marker = 'async function loadAnlassraumByDossierIds(dossierIds: string[]) {'
          helpers = '''function newsletterSourceRevision(doc: SocialDistributionPostDoc) {\n  const post = doc.post ?? null;\n  const asset = post?.assets?.find((entry) => entry.kind === "newsletter_draft" || entry.channel === "newsletter_draft") ?? null;\n  return digest(JSON.stringify({\n    recordId: normalize(doc._id),\n    id: normalize(post?.id),\n    status: normalize(post?.status),\n    sourceState: normalize(post?.sourceState),\n    channels: [...(post?.channels ?? [])].map(String).sort(),\n    text: normalize(post?.channelTexts?.newsletter_draft),\n    note: normalize(post?.channelNotes?.newsletter_draft),\n    asset: asset ? { kind: normalize(asset.kind), channel: normalize(asset.channel), href: normalize(asset.href), text: normalize(asset.text), verificationLabel: normalize(asset.verificationLabel) } : null,\n    approval: { reviewRequired: post?.approval?.reviewRequired ?? null, approvedAt: normalize(post?.approval?.approvedAt) },\n    noAutoPublish: post?.noAutoPublish === true,\n    noAutoPublicationApproved: post?.noAutoPublicationApproved === true,\n    updatedAt: safeDate(post?.updatedAt)?.toISOString() ?? safeDate(doc.updatedAt)?.toISOString() ?? null,\n  })).slice(0, 32);\n}\n\nfunction newsletterCandidateDocEligible(doc: SocialDistributionPostDoc, cutoff: number) {\n  const post = doc.post;\n  if (!post) return false;\n  if (!APPROVED_SOCIAL_STATUSES.has(String(post.status ?? ""))) return false;\n  if (post.publicBrand && post.publicBrand !== "edebatte") return false;\n  if (post.sourceState !== "approved_context") return false;\n  if (post.noAutoPublish !== true || post.noAutoPublicationApproved !== true) return false;\n  if (post.approval?.reviewRequired !== false && !post.approval?.approvedAt) return false;\n  const updatedAt = safeDate(post.updatedAt) ?? safeDate(doc.updatedAt);\n  return !updatedAt || updatedAt.getTime() >= cutoff;\n}\n\nasync function revalidateNewsletterCandidatesForHandoff(candidates: NewsletterDigestCandidate[], now: Date) {\n  if (!candidates.length || candidates.some((candidate) => !candidate.sourceRevision)) return false;\n  const postIds = unique(candidates.map((candidate) => candidate.id));\n  const col = await coreCol<SocialDistributionPostDoc>(SOCIAL_POSTS_COLLECTION);\n  const docs = await col.find({ "post.id": { $in: postIds } } as never).toArray();\n  const byPostId = new Map(docs.map((doc) => [normalize(doc.post?.id), doc] as const));\n  const maxAgeDays = Math.max(1, Math.min(90, Number(process.env.NEWSLETTER_CANDIDATE_MAX_AGE_DAYS || 21)));\n  const cutoff = now.getTime() - maxAgeDays * 24 * 60 * 60 * 1000;\n  return candidates.every((candidate) => {\n    const doc = byPostId.get(candidate.id) ?? null;\n    return Boolean(doc && newsletterCandidateDocEligible(doc, cutoff) && newsletterSourceRevision(doc) === candidate.sourceRevision);\n  });\n}\n\nasync function reserveCanonicalSubscriberExternalHandoff(subscriber: SubscriberDoc, input: { now: Date; handoffId: string }) {\n  const subscribers = await coreCol<SubscriberDoc>(SUBSCRIBERS_COLLECTION);\n  const filter: Record<string, unknown> = {\n    email: subscriber.email.trim().toLowerCase(),\n    status: "active",\n    consentVersion: REQUIRED_CONSENT_VERSION,\n  };\n  if (subscriber.userId) filter.userId = subscriber.userId;\n  const expectedUpdatedAt = safeDate(subscriber.updatedAt);\n  if (expectedUpdatedAt) filter.updatedAt = expectedUpdatedAt;\n  return subscribers.findOneAndUpdate(\n    filter as never,\n    { $set: { lastDeliveryHandoffAt: input.now, lastDeliveryHandoffId: input.handoffId } },\n    { returnDocument: "after" },\n  );\n}\n\n'''
          if s.count(marker) != 1: raise SystemExit('runtime helper anchor mismatch')
          s = s.replace(marker, helpers + marker, 1)
          old = '''  const eligibleDocs = docs.filter((doc) => {\n    const post = doc.post;\n    if (!post) return false;\n    if (!APPROVED_SOCIAL_STATUSES.has(String(post.status ?? ""))) return false;\n    if (post.publicBrand && post.publicBrand !== "edebatte") return false;\n    if (post.sourceState !== "approved_context") return false;\n    if (post.noAutoPublish !== true || post.noAutoPublicationApproved !== true) return false;\n    if (post.approval?.reviewRequired !== false && !post.approval?.approvedAt) return false;\n    const updatedAt = safeDate(post.updatedAt) ?? safeDate(doc.updatedAt);\n    return !updatedAt || updatedAt.getTime() >= cutoff;\n  });'''
          if s.count(old) != 1: raise SystemExit('candidate eligibility anchor mismatch')
          s = s.replace(old, '  const eligibleDocs = docs.filter((doc) => newsletterCandidateDocEligible(doc, cutoff));', 1)
          old = '''      dossierId,\n      sourceCreatedByUserId: normalize(post.createdByUserId),\n    } satisfies NewsletterDigestCandidate];'''
          new = '''      dossierId,\n      sourceCreatedByUserId: normalize(post.createdByUserId),\n      sourceRecordId: normalize(doc._id),\n      sourceRevision: newsletterSourceRevision(doc),\n    } satisfies NewsletterDigestCandidate];'''
          if s.count(old) != 1: raise SystemExit('candidate revision anchor mismatch')
          s = s.replace(old, new, 1)
          old = '  const now = options.now ?? new Date();\n  let currentSubscriber: SubscriberDoc | null;'
          new = '  const now = options.now ?? new Date();\n  const candidatePool = options.candidates ?? await loadNewsletterCandidates(now);\n  let currentSubscriber: SubscriberDoc | null;'
          if s.count(old) != 1: raise SystemExit('send start anchor mismatch')
          s = s.replace(old, new, 1)
          old = '''  const preview = await buildNewsletterDigestPreviewForSubscriber(currentSubscriber, {\n    now,\n    candidates: options.candidates,\n  });'''
          new = '''  const preview = await buildNewsletterDigestPreviewForSubscriber(currentSubscriber, {\n    now,\n    candidates: candidatePool,\n  });'''
          if s.count(old) != 1: raise SystemExit('preview anchor mismatch')
          s = s.replace(old, new, 1)
          marker = '''  if (existing?.status === "failed" && existing.retryable === false) {\n    return { ok: true as const, status: "skipped" as const, reason: "non_retryable_previous_failure", preview };\n  }\n\n  await ledger.updateOne('''
          repl = '''  if (existing?.status === "failed" && existing.retryable === false) {\n    return { ok: true as const, status: "skipped" as const, reason: "non_retryable_previous_failure", preview };\n  }\n\n  const selectedCandidates = preview.candidateIds\n    .map((candidateId) => candidatePool.find((candidate) => candidate.id === candidateId) ?? null)\n    .filter((candidate): candidate is NewsletterDigestCandidate => Boolean(candidate));\n  if (selectedCandidates.length !== preview.candidateIds.length) {\n    return { ok: true as const, status: "skipped" as const, reason: "candidate_state_changed", preview };\n  }\n  try {\n    if (!(await revalidateNewsletterCandidatesForHandoff(selectedCandidates, now))) {\n      return { ok: true as const, status: "skipped" as const, reason: "candidate_state_changed", preview };\n    }\n  } catch {\n    return { ok: false as const, status: "blocked" as const, reason: "candidate_state_unavailable", preview };\n  }\n\n  const externalAttemptId = crypto.randomUUID();\n  try {\n    const reservedSubscriber = await reserveCanonicalSubscriberExternalHandoff(currentSubscriber, { now, handoffId: externalAttemptId });\n    if (!reservedSubscriber) {\n      return { ok: true as const, status: "skipped" as const, reason: "subscriber_state_changed", preview };\n    }\n    currentSubscriber = reservedSubscriber;\n  } catch {\n    return { ok: false as const, status: "blocked" as const, reason: "subscriber_state_unavailable", preview };\n  }\n\n  await ledger.updateOne('''
          if s.count(marker) != 1: raise SystemExit('handoff boundary anchor mismatch')
          s = s.replace(marker, repl, 1)
          if s.count('        externalAttemptId: crypto.randomUUID(),') != 1: raise SystemExit('attempt id anchor mismatch')
          s = s.replace('        externalAttemptId: crypto.randomUUID(),', '        externalAttemptId,', 1)
          runtime.write_text(s)
          PY
          cat > apps/web/tests/newsletter-closeout-handoff-safety.contract.test.ts <<'EOF'
          import fs from "node:fs";
          import path from "node:path";
          import { describe, expect, it } from "vitest";

          const root = path.resolve(__dirname, "../../..");
          const account = fs.readFileSync(path.join(root, "features/account/service.ts"), "utf8");
          const runtime = fs.readFileSync(path.join(root, "apps/web/src/features/newsletter/newsletterRuntime.ts"), "utf8");

          describe("newsletter closeout handoff safety", () => {
            it("uses canonical subscription truth for account opt-out and readback", () => {
              expect(account).toContain('NEWSLETTER_SUBSCRIBERS_COLLECTION = "public_updates_subscribers"');
              expect(account).toContain("loadCanonicalNewsletterOptIn");
              expect(account).toContain("applyCanonicalNewsletterAccountPreference");
              expect(account).toContain('status: "unsubscribed"');
              expect(account).toContain("if (newsletterOptIn) return");
              expect(account).not.toContain('setOps["settings.newsletterOptIn"]');
            });

            it("revalidates content and subscriber revision before provider handoff", () => {
              const sendAt = runtime.indexOf("const result = await sendMail");
              expect(runtime).toContain("sourceRevision: newsletterSourceRevision(doc)");
              expect(runtime).toContain("revalidateNewsletterCandidatesForHandoff");
              expect(runtime).toContain("reserveCanonicalSubscriberExternalHandoff");
              expect(runtime).toContain('reason: "candidate_state_changed"');
              expect(runtime).toContain('reason: "subscriber_state_changed"');
              expect(runtime.indexOf("revalidateNewsletterCandidatesForHandoff(selectedCandidates, now)")).toBeLessThan(sendAt);
              expect(runtime.indexOf("reserveCanonicalSubscriberExternalHandoff(currentSubscriber")).toBeLessThan(sendAt);
            });
          });
          EOF
          pnpm install --frozen-lockfile
          pnpm -C apps/web exec vitest run tests/newsletter-closeout-handoff-safety.contract.test.ts tests/newsletter-n8-n9-acceptance.test.ts tests/newsletter-subscription-reconciliation.test.ts tests/newsletter-delivery-lifecycle.test.ts tests/newsletter-delivery-lease.test.ts
          pnpm -C apps/web run typecheck
          pnpm lint
          git diff --check
          git rm .github/workflows/newsletter-closeout-handoff-safety-02.yml
          git config user.name 'VOGADMINRGF'
          git config user.email 'rgf@voiceopengov.de'
          git add features/account/service.ts apps/web/src/features/newsletter/newsletterRuntime.ts apps/web/tests/newsletter-closeout-handoff-safety.contract.test.ts .github/workflows/newsletter-closeout-handoff-safety-02.yml
          git commit -m 'fix(newsletter): close final consent and content handoff races'
          git push origin HEAD:fix/newsletter-closeout-handoff-safety-02
