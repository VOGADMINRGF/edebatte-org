name: Newsletter closeout preflight witness

on:
  push:
    branches:
      - fix/newsletter-closeout-handoff-safety-02

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Verify exact main and executable task
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "14f2350dd53317088014ccd45ee3687cb117b111"
          test -z "$(git status --porcelain)"
          node scripts/codex-task-preflight.mjs NEWSLETTER-DELIVERY-SEND-TIME-SAFETY-01 > /tmp/preflight.json
          cat /tmp/preflight.json
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('/tmp/preflight.json', 'utf8'));
          if (p.status !== 'codex_ready' || p.executable !== true || p.branchCreationAllowed !== true) {
            console.error(p);
            process.exit(1);
          }
          NODE
