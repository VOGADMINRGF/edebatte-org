name: Voxy Work AAA1 authorize v2

on:
  push:
    branches:
      - docs/voxy-work-aaa1-cross-language-freshness-authorize-02

permissions:
  contents: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact main and OpenTasks blob
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "35d5aeba63e9f095665013b90a30953d07084c8b"
          test "$(git rev-parse origin/main:docs/E150/OpenTasks.md)" = "485d20a0d2e6efed3746aaef8f65584be7c3079c"
          test "$(git merge-base HEAD origin/main)" = "35d5aeba63e9f095665013b90a30953d07084c8b"
      - name: Authorize AAA1 losslessly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/E150/OpenTasks.md')
          text = p.read_text()
          old = '''| VOXY-EU24-MULTILINGUAL-EDITORIAL-01 | review | P2 | Issue `#969`; EU24 Slices A–E completed; F1 master-freshness repair via PR #1062; Work F3 numeric-semantic repair via PR #1083 / merge `a55ee8f04d45e67ce8074dc0093b54e1891d43a4`; exact-head Web CI, Local Composition Runtime, Visual QA, AAA red-team, Final Canon and Alpha2 adapter green | **Audit repairs consumed:** language-variant master freshness and locale-aware numeric semantic preservation are implemented on the existing multilingual Editorial/Evidence/Render architecture; no executable #969 repair remains from the audited F1/F3 set | Fail-closed `review`, no branch authorization; no second translation/story/evidence/review/render truth, no provider/model activation, upload, scheduling or publish. Further #969 product changes require a new concrete defect and fresh authorization |'''
          new = '''| VOXY-EU24-MULTILINGUAL-EDITORIAL-01 | codex_ready | P1 | Issue `#969`; EU24 Slices A–E completed; prior immediate-parent freshness via PR #1062; numeric semantic repair via PR #1083; holistic Work AAA closeout finding `AAA-1` reproduced on audited `main@4e0854a7d1bca7250800cb1e4b9d9b33c2b02e0e` and still present on current `main@35d5aeba63e9f095665013b90a30953d07084c8b` | **AAA-1 only — transitive language-variant ancestor freshness:** extend the existing `resolveVoxyStudioLanguageVariantFreshness()` path to validate the complete existing master/translation dependency chain, not only the immediate parent; missing, ambiguous, stale or cyclic ancestors must fail closed at the same release/worker freshness boundary; reuse existing draft repository + language-variant binding/freshness contracts, no new graph/store/translation truth | Regression must prove `de -> fr -> it`, then only `de` revision changes => both descendants stale and worker Executor Count `0`; unchanged chain remains current; missing parent, ambiguous parent and cycle block deterministically; focused contracts + current Web typecheck/build + existing Voxy runtime/canon/AAA gates. `AAA-2` Unicode-minus and `AAA-3` Realtime-session findings are explicitly not authorized by this row |'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exact old row once, got {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY
          git diff --check
          git diff --numstat origin/main -- docs/E150/OpenTasks.md | grep -Eq '^1[[:space:]]+1[[:space:]]+'
      - name: Commit, prove preflight and self-delete
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/E150/OpenTasks.md
          git commit -m 'docs(e150): authorize Voxy AAA1 ancestor freshness repair'
          git checkout -B main HEAD
          node scripts/codex-task-preflight.mjs VOXY-EU24-MULTILINGUAL-EDITORIAL-01 > /tmp/preflight.json 2>&1
          cat /tmp/preflight.json
          grep -q '"status": "codex_ready"' /tmp/preflight.json
          grep -q '"executable": true' /tmp/preflight.json
          grep -q '"branchCreationAllowed": true' /tmp/preflight.json
          rm .github/workflows/voxy-work-aaa1-authorize-02.yml
          git add .github/workflows/voxy-work-aaa1-authorize-02.yml
          git commit -m 'chore(governance): remove AAA1 authorization writer v2'
          test "$(git diff --name-only origin/main...HEAD | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only origin/main...HEAD)" = "docs/E150/OpenTasks.md"
          git push origin HEAD:docs/voxy-work-aaa1-cross-language-freshness-authorize-02
