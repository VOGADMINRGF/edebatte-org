name: One-shot Voxy council fail-closed verify

on:
  push:
    branches:
      - fix/voxy-editorial-council-fail-closed-01
    paths:
      - .github/workflows/voxy-editorial-council-fail-closed-verify.yml

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/voxy-editorial-council-fail-closed-01
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Focused council contract
        run: pnpm -C apps/web exec vitest run tests/voxy-editorial-agent-council.contract.test.ts
      - name: Typecheck
        run: pnpm -C apps/web run typecheck
      - name: Repository integrity
        run: node scripts/ci/check-repository-integrity-guards.mjs --base b79782f6835574ffdba9b4d54e5a50ea79039ed9
      - name: Diff check
        run: git diff --check b79782f6835574ffdba9b4d54e5a50ea79039ed9...HEAD
      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/voxy-editorial-council-fail-closed-verify.yml
          git commit -m "ci(voxy): remove council repair verifier"
          git push origin HEAD:fix/voxy-editorial-council-fail-closed-01
