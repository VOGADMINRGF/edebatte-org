name: Preflight Voxy Local Composition Recovery 01

on:
  push:
    branches:
      - fix/voxy-local-composition-recovery-01

permissions:
  contents: write

concurrency:
  group: preflight-voxy-local-composition-recovery-01
  cancel-in-progress: false

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify exact main and run canonical task preflight
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN='1341f14d0700f178fa6fd0a2fc1dbffc1403ae5a'
          git fetch origin main
          ACTUAL_MAIN="$(git rev-parse origin/main)"
          test "$ACTUAL_MAIN" = "$EXPECTED_MAIN"
          git checkout -B main origin/main
          node scripts/codex-task-preflight.mjs VOXY-LOCAL-COMPOSITION-RECOVERY-01 > /tmp/preflight.json
          cat /tmp/preflight.json
          node <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/preflight.json', 'utf8'));
          if (result.status !== 'codex_ready') throw new Error(`unexpected status: ${result.status}`);
          if (result.executable !== true) throw new Error(`task not executable: ${JSON.stringify(result)}`);
          if (result.branchCreationAllowed !== true) throw new Error(`branch creation not allowed: ${JSON.stringify(result)}`);
          NODE

      - name: Remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='fix/voxy-local-composition-recovery-01'
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/preflight-voxy-local-composition-recovery-01.yml
          git commit -m 'chore: remove #978 preflight workflow'
          git push origin "HEAD:$BRANCH"
