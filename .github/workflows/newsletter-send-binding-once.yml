name: Newsletter final send binding

on:
  push:
    branches:
      - fix/newsletter-delivery-send-time-safety-01

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/newsletter-delivery-send-time-safety-01
          fetch-depth: 0
      - name: Patch send binding and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "9c99d7fc557c4eac30121184888dd6ca4631f6b9"
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          runtime_path = Path("apps/web/src/features/newsletter/newsletterRuntime.ts")
          runtime = runtime_path.read_text()
          runtime = replace_once(
              runtime,
              '  options: { now?: Date; candidates?: NewsletterDigestCandidate[] } = {},\n',
              '  options: {\n    now?: Date;\n    candidates?: NewsletterDigestCandidate[];\n    expectedEmail?: string;\n    expectedDigestKey?: string;\n    expectedCandidateIds?: string[];\n  } = {},\n',
              "runtime send options",
          )
          anchor = '''  if (!preview.deliveryAllowed || !preview.digestKey || !preview.subject || !preview.html || !preview.text) {\n    return { ok: true as const, status: "skipped" as const, reason: preview.deliveryReason, preview };\n  }\n'''
          insert = anchor + '''  const expectedEmail = options.expectedEmail?.trim().toLowerCase();\n  if (\n    (expectedEmail && preview.email !== expectedEmail) ||\n    (options.expectedDigestKey && preview.digestKey !== options.expectedDigestKey) ||\n    (options.expectedCandidateIds &&\n      preview.candidateIds.join("|") !== options.expectedCandidateIds.join("|"))\n  ) {\n    return { ok: true as const, status: "skipped" as const, reason: "subscriber_state_changed", preview };\n  }\n'''
          runtime = replace_once(runtime, anchor, insert, "runtime expected snapshot binding")
          runtime_path.write_text(runtime)

          production_path = Path("apps/web/src/features/newsletter/newsletterProductionRuntime.ts")
          production = production_path.read_text()
          production = replace_once(
              production,
              '      const result = await sendNewsletterDigestForSubscriber(freshSubscriber, { now, candidates });\n',
              '''      const result = await sendNewsletterDigestForSubscriber(freshSubscriber, {\n        now,\n        candidates,\n        expectedEmail: freshPreview.email,\n        expectedDigestKey: freshPreview.digestKey,\n        expectedCandidateIds: freshPreview.candidateIds,\n      });\n''',
              "production bound send call",
          )
          production_path.write_text(production)

          acceptance_path = Path("apps/web/tests/newsletter-n8-n9-acceptance.test.ts")
          acceptance = acceptance_path.read_text()
          anchor = '    expect(runtime).toContain("reloadCanonicalSubscriberForSend");\n'
          addition = anchor + '    expect(runtime).toContain("expectedDigestKey");\n    expect(runtime).toContain("expectedCandidateIds");\n    expect(production).toContain("expectedDigestKey: freshPreview.digestKey");\n'
          acceptance = replace_once(acceptance, anchor, addition, "acceptance expected binding")
          acceptance_path.write_text(acceptance)
          PY
          rm -f .github/workflows/newsletter-send-binding-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/newsletter/newsletterRuntime.ts \
                  apps/web/src/features/newsletter/newsletterProductionRuntime.ts \
                  apps/web/tests/newsletter-n8-n9-acceptance.test.ts \
                  .github/workflows/newsletter-send-binding-once.yml
          git diff --cached --check
          git commit -m "fix(newsletter): bind lease to final subscriber snapshot"
          git push origin HEAD:fix/newsletter-delivery-send-time-safety-01
