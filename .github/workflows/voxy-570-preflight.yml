name: One-shot Voxy Admin Studio preflight

on:
  push:
    branches:
      - noop-temp-probe
    paths:
      - .github/workflows/voxy-570-preflight.yml

permissions:
  contents: write

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: noop-temp-probe
          fetch-depth: 0

      - name: Check exact clean main and run task preflight
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git switch -C main 942dce14415745ef2ab980fa373c4be64071d4b1
          test "$(git rev-parse HEAD)" = "942dce14415745ef2ab980fa373c4be64071d4b1"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          node scripts/codex-task-preflight.mjs VOXY-ADMIN-VIDEO-STUDIO-01 | tee /tmp/voxy-570-preflight.json
          node - <<'NODE'
          const fs = require('fs');
          const value = JSON.parse(fs.readFileSync('/tmp/voxy-570-preflight.json', 'utf8'));
          if (value.taskId !== 'VOXY-ADMIN-VIDEO-STUDIO-01') throw new Error('wrong_task');
          if (value.status !== 'codex_ready') throw new Error(`status:${value.status}`);
          if (value.executable !== true) throw new Error('not_executable');
          if (value.branchCreationAllowed !== true) throw new Error('branch_creation_not_allowed');
          NODE

      - name: Self-remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git switch -C noop-temp-probe origin/noop-temp-probe
          git rm .github/workflows/voxy-570-preflight.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(governance): remove Voxy Admin Studio preflight runner'
          git push origin HEAD:noop-temp-probe
