name: Temporary Voxy AAA red-team closeout
on:
  push:
    branches:
      - docs/voxy-aaa-red-team-closeout-01
permissions:
  contents: write
jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/voxy-aaa-red-team-closeout-01
      - name: Fail closed and close only AAA red-team row
        env:
          EXPECTED_MAIN: 416b41b80a87345044fc42e5d9e262e8ae2e8ec3
          EXPECTED_OPENTASKS_BLOB: 0ec14dcbb3b13f529fdf1c06dd83b152bd24cd5d
          BRANCH: docs/voxy-aaa-red-team-closeout-01
        run: |
          set -euo pipefail
          git fetch origin main
          observed_main="$(git rev-parse origin/main)"
          test "$observed_main" = "$EXPECTED_MAIN" || { echo "main_drift:$observed_main"; exit 41; }
          observed_blob="$(git rev-parse origin/main:docs/E150/OpenTasks.md)"
          test "$observed_blob" = "$EXPECTED_OPENTASKS_BLOB" || { echo "opentasks_blob_drift:$observed_blob"; exit 42; }
          git checkout origin/main -- docs/E150/OpenTasks.md
          cp docs/E150/OpenTasks.md /tmp/OpenTasks.before.md
          python - <<'PY'
          from pathlib import Path
          path=Path('docs/E150/OpenTasks.md')
          before=path.read_text().splitlines()
          task='VOXY-AAA-RED-TEAM-ACCEPTANCE-01'
          idx=[i for i,l in enumerate(before) if l.startswith(f'| {task} |')]
          if len(idx)!=1: raise SystemExit(f'task_count:{len(idx)}')
          i=idx[0]
          parts=before[i].split('|')
          if len(parts)<8 or parts[2].strip()!='codex_ready' or parts[3].strip()!='P0':
              raise SystemExit('unexpected_task_state')
          parts[2]=' review '
          evidence=parts[4].strip()
          suffix='PR `#1071`; merge `416b41b80a87345044fc42e5d9e262e8ae2e8ec3`; Voxy AAA red-team acceptance `#1`, Web CI `#3595`, Voxy final canon lock `#381` green'
          if suffix not in evidence:
              parts[4]=' '+evidence+'; '+suffix+' '
          after=before.copy(); after[i]='|'.join(parts)
          path.write_text('\n'.join(after)+'\n')
          # exact mutation proof
          check=path.read_text().splitlines()
          expected=before.copy(); expected[i]=check[i]
          if check != expected: raise SystemExit('unexpected_opentasks_mutation')
          if '| review | P0 |' not in check[i]: raise SystemExit('task_not_review')
          PY
          git diff --check
          git diff -- docs/E150/OpenTasks.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/E150/OpenTasks.md
          git commit -m "docs(e150): close Voxy AAA red-team acceptance"
          git rm .github/workflows/tmp-close-voxy-aaa-red-team.yml
          git commit -m "chore(governance): remove temporary Voxy AAA closeout writer"
          git push origin HEAD:"$BRANCH"
