name: Voxy F4 closeout single writer

on:
  push:
    branches: [ docs/voxy-f4-closeout-01 ]

permissions:
  contents: write

jobs:
  closeout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/voxy-f4-closeout-01
          fetch-depth: 0
      - name: Pin current main and mutate exactly one operative row
        env:
          EXPECTED_MAIN: f4abea97e21cdf48f498c68dcb04b36af50fc982
          EXPECTED_BLOB: f2c2fb7de06732ccbf3674dd7582c4e74c74a926
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN" || { echo main_drift; exit 41; }
          test "$(git rev-parse origin/main:docs/E150/OpenTasks.md)" = "$EXPECTED_BLOB" || { echo opentasks_drift; exit 42; }
          python - <<'PY'
          from pathlib import Path
          p=Path('docs/E150/OpenTasks.md')
          text=p.read_text()
          rows=text.splitlines()
          target='VOXY-STUDIO-REVIEW-CONSISTENCY-01'
          idx=[i for i,r in enumerate(rows) if r.startswith(f'| {target} |')]
          assert len(idx)==1, idx
          i=idx[0]
          before=rows[i]
          parts=before.split(' | ')
          assert parts[1]==target and parts[2]=='codex_ready' and parts[3]=='P2', parts[:4]
          parts[2]='review'
          evidence='PR #1087 merged as f4abea97e21cdf48f498c68dcb04b36af50fc982; exact-head Web CI, Voxy Local Composition Runtime, AAA red-team, Final Canon and Alpha2 gates green; 0 open review threads'
          parts[4]=parts[4] + '; ' + evidence
          rows[i]=' | '.join(parts)
          after='\n'.join(rows) + ('\n' if text.endswith('\n') else '')
          assert sum(1 for r in rows if r.startswith(f'| {target} |'))==1
          p.write_text(after)
          print(before)
          print(rows[i])
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "docs/E150/OpenTasks.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/E150/OpenTasks.md
          git commit -m 'docs(e150): close Voxy F4 to review'
          git rm .github/workflows/voxy-f4-closeout-single-writer.yml
          git commit -m 'chore(ci): remove Voxy F4 closeout writer'
          git push origin HEAD:docs/voxy-f4-closeout-01
