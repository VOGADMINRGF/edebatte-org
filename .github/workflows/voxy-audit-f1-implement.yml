name: Voxy audit F1 guarded implementation

on:
  push:
    branches:
      - fix/voxy-master-variant-freshness-01

permissions:
  contents: write

jobs:
  implement:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Verify base and apply F1 only
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "1a20e3391b151ca6fc29a890757750dd04d3f951"
          test "$(git merge-base HEAD origin/main)" = "1a20e3391b151ca6fc29a890757750dd04d3f951"
          python3 - <<'PY'
          from pathlib import Path
          v1 = Path("scripts/tmp-voxy-f1-apply.py").read_text()
          start_token = "test.write_text(dedent('''\\\n"
          end_token = "\n'''))\n\nworkflow ="
          start = v1.index(start_token) + len(start_token)
          end = v1.index(end_token, start)
          Path("apps/web/tests/voxy-language-variant-master-freshness.contract.test.ts").write_text(v1[start:end] + "\n")
          v2_path = Path("scripts/tmp-voxy-f1-apply-v2.py")
          v2 = v2_path.read_text()
          block_start = v2.index("# Reuse the already-staged canonical test body")
          block_end = v2.index('workflow = Path(".github/workflows/voxy-local-composition-runtime.yml")', block_start)
          v2_path.write_text(v2[:block_start] + v2[block_end:])
          PY
          python3 scripts/tmp-voxy-f1-apply-v2.py
      - name: Verify focused F1 contracts and exact product scope
        shell: bash
        run: |
          set -euo pipefail
          pnpm install --frozen-lockfile
          pnpm -C apps/web exec vitest run \
            tests/voxy-language-variant-master-freshness.contract.test.ts \
            tests/voxy-local-composition-freshness.contract.test.ts \
            tests/voxy-editorial-language-variant.contract.test.ts \
            tests/voxy-local-composition-runtime.contract.test.ts
          pnpm -C apps/web exec tsc --noEmit -p tsconfig.json --pretty false
          git restore -- \
            packages/db-web/src/generated/edge.js \
            packages/db-web/src/generated/index.js \
            packages/db-web/src/generated/wasm.js
          git add -N apps/web/tests/voxy-language-variant-master-freshness.contract.test.ts
          git diff --check
          mapfile -t files < <(git diff --name-only | sort | grep -v '^scripts/tmp-voxy-f1-apply.py$' | grep -v '^scripts/tmp-voxy-f1-fix-patcher.py$' | grep -v '^scripts/tmp-voxy-f1-apply-v2.py$' | grep -v '^.github/workflows/voxy-audit-f1-implement.yml$')
          echo "PRODUCT_DIFF_COUNT=${#files[@]}"
          printf 'PRODUCT_FILE=%s\n' "${files[@]}"
          test "${#files[@]}" -eq 4
          printf '%s\n' "${files[@]}" | grep -Fx '.github/workflows/voxy-local-composition-runtime.yml'
          printf '%s\n' "${files[@]}" | grep -Fx 'apps/web/src/features/voxyVideo/studioLocalCompositionFreshness.ts'
          printf '%s\n' "${files[@]}" | grep -Fx 'apps/web/src/app/api/admin/voxy-studio/[draftId]/render/route.ts'
          printf '%s\n' "${files[@]}" | grep -Fx 'apps/web/tests/voxy-language-variant-master-freshness.contract.test.ts'
      - name: Commit validated non-workflow product delta and remove helper scripts
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            apps/web/src/features/voxyVideo/studioLocalCompositionFreshness.ts \
            'apps/web/src/app/api/admin/voxy-studio/[draftId]/render/route.ts' \
            apps/web/tests/voxy-language-variant-master-freshness.contract.test.ts
          git rm -f \
            scripts/tmp-voxy-f1-apply.py \
            scripts/tmp-voxy-f1-fix-patcher.py \
            scripts/tmp-voxy-f1-apply-v2.py
          git commit -m "fix(voxy): invalidate variants on master drift"
          git push origin HEAD:fix/voxy-master-variant-freshness-01
