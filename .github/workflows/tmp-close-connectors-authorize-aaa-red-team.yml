name: Temporary close connectors and authorize AAA red-team
on:
  push:
    branches:
      - docs/voxy-aaa-red-team-acceptance-01-ssot
permissions:
  contents: write
jobs:
  serialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/voxy-aaa-red-team-acceptance-01-ssot
      - name: Fail closed and mutate only intended OpenTasks rows
        env:
          EXPECTED_MAIN: 9ee628161de93fe323829204f3b0a017ea6e5405
          EXPECTED_OPENTASKS_BLOB: 7a72568b7cd025cfab868394a3c0a38786f304db
          BRANCH: docs/voxy-aaa-red-team-acceptance-01-ssot
        run: |
          set -euo pipefail
          git fetch origin main
          observed_main="$(git rev-parse origin/main)"
          test "$observed_main" = "$EXPECTED_MAIN" || { echo "main_drift:$observed_main"; exit 41; }
          observed_blob="$(git rev-parse origin/main:docs/E150/OpenTasks.md)"
          test "$observed_blob" = "$EXPECTED_OPENTASKS_BLOB" || { echo "opentasks_blob_drift:$observed_blob"; exit 42; }
          git checkout origin/main -- docs/E150/OpenTasks.md
          cp docs/E150/OpenTasks.md /tmp/OpenTasks.before.md
          python - <<'PY'
          from pathlib import Path
          path=Path('docs/E150/OpenTasks.md')
          lines=path.read_text().splitlines()
          connector='VOXY-EXTERNAL-PERSONAL-CONNECTORS-01'
          red='VOXY-AAA-RED-TEAM-ACCEPTANCE-01'
          idx=[i for i,l in enumerate(lines) if l.startswith(f'| {connector} |')]
          if len(idx)!=1: raise SystemExit(f'connector_count:{len(idx)}')
          if any(l.startswith(f'| {red} |') for l in lines): raise SystemExit('red_team_already_present')
          i=idx[0]
          row=lines[i]
          parts=row.split('|')
          if len(parts)<8 or parts[2].strip()!='codex_ready' or parts[3].strip()!='P0':
              raise SystemExit('connector_row_not_expected_codex_ready_p0')
          parts[2]=' review '
          evidence=parts[4].strip()
          suffix='PR `#1067`; merge `9ee628161de93fe323829204f3b0a017ea6e5405`; Web CI `#3579` + Voxy canon lock `#374` green'
          if suffix not in evidence:
              parts[4]=' '+evidence+'; '+suffix+' '
          lines[i]='|'.join(parts)
          red_row=(
            '| VOXY-AAA-RED-TEAM-ACCEPTANCE-01 | codex_ready | P0 | Issue `#1056`; '
            '`SHARED-CONVERSATION-CONTRACT-01`; `PERSONAL-VOXY-CONSENTED-MEMORY-RUNTIME-01`; '
            '`VOXY-TOOL-CAPABILITY-ADAPTERS-01`; `VOXY-CIVIC-ACTIVITY-RELEVANCE-01`; '
            '`VOXY-REALTIME-CONVERSATION-VOICE-01`; `VOXY-PROACTIVE-WATCH-TASKS-01`; '
            '`VOXY-EXTERNAL-PERSONAL-CONNECTORS-01` via PR `#1067`; Alpha2 ledger/queue/recovery/risk/human gate/execution fence; Single-Writer `#447` '
            '| Deterministische cross-cutting AAA-Falsifikationssuite fuer Conversation, consentiertes Memory, Civic Relevance, Tool Capabilities, Realtime Voice, Proactive Watches und externe Connection-Grenzen; Replay/Crash/Revoke/stale context/secret leakage und menschliche Souveraenitaet auf aktuellem Exact Head pruefen; keine neue Runtime/Queue/Memory/Conversation/Truth-SSOT '
            '| Start nur nach positivem taskbezogenen Preflight; ausschliesslich gemergte kanonische Owner konsumieren; stale/revoked consent, do_not_remember rehydration, politische Profilinferenz, interim-voice actions, stale-generation/replay duplicate effects, human-gate downgrade, watch delivery trotz revoke/unsubscribe/quiet-hours, revoked connection use und Secret/Prompt/Raw-Audio/CoT in Trace muessen fail-closed bleiben; keine Auto-Abstimmung, politische Persuasion, Auto-Publish oder externe politische Aktion; reale Provider/OAuth/Mic/Device/Production-Gates bleiben manual/external solange nicht real belegt |'
          )
          lines.insert(i+1, red_row)
          path.write_text('\n'.join(lines)+'\n')
          PY
          python - <<'PY'
          from pathlib import Path
          before=Path('/tmp/OpenTasks.before.md').read_text().splitlines()
          after=Path('docs/E150/OpenTasks.md').read_text().splitlines()
          connector='VOXY-EXTERNAL-PERSONAL-CONNECTORS-01'
          red='VOXY-AAA-RED-TEAM-ACCEPTANCE-01'
          bi=[i for i,l in enumerate(before) if l.startswith(f'| {connector} |')]
          ai=[i for i,l in enumerate(after) if l.startswith(f'| {connector} |')]
          ri=[i for i,l in enumerate(after) if l.startswith(f'| {red} |')]
          if len(bi)!=len(ai)!=1 or len(ri)!=1: raise SystemExit('postcondition_counts_invalid')
          b=bi[0]; a=ai[0]; r=ri[0]
          if r != a+1: raise SystemExit('red_team_not_immediately_after_connector')
          expected=before[:b]+[after[a],after[r]]+before[b+1:]
          if after != expected: raise SystemExit('unexpected_opentasks_mutation')
          if '| review | P0 |' not in after[a]: raise SystemExit('connector_not_review')
          if '| codex_ready | P0 |' not in after[r]: raise SystemExit('red_team_not_codex_ready')
          PY
          git diff --check
          git diff -- docs/E150/OpenTasks.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/E150/OpenTasks.md
          git commit -m "docs(e150): close connectors and authorize AAA red-team"
          git rm .github/workflows/tmp-close-connectors-authorize-aaa-red-team.yml
          git commit -m "chore(governance): remove temporary AAA red-team writer"
          git push origin HEAD:"$BRANCH"
