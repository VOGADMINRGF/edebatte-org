name: Alpha2 close single writer and authorize orchestrator current

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - docs/alpha2-single-writer-close-orchestrator-authorize-current-01

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/alpha2-single-writer-close-orchestrator-authorize-current-01
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail-closed OpenTasks reconcile
        env:
          EXPECTED_MAIN: 0c77fe93f8253c13bc36cdd463e6913b927cd4aa
          EXPECTED_OPENTASKS_BLOB: 007ae1c0309810c60a8f7514cae48d9f43b42135
        run: |
          set -euo pipefail
          git fetch origin main
          observed_main="$(git rev-parse origin/main)"
          test "$observed_main" = "$EXPECTED_MAIN" || { echo "main_drift:$observed_main"; exit 41; }
          observed_blob="$(git rev-parse origin/main:docs/E150/OpenTasks.md)"
          test "$observed_blob" = "$EXPECTED_OPENTASKS_BLOB" || { echo "opentasks_blob_drift:$observed_blob"; exit 42; }
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/E150/OpenTasks.md')
          text = p.read_text()
          marker = '## Historischer Katalog und Evidenz'
          if text.count(marker) != 1:
              raise SystemExit(f'history_marker_count:{text.count(marker)}')
          head, tail = text.split(marker, 1)
          lines = head.splitlines(keepends=True)
          transitions = [
              ('ALPHA2-OPENTASKS-SINGLE-WRITER-01', 'codex_ready', 'review'),
              ('ALPHA2-ORCHESTRATOR-LOOP-01', 'blocked', 'codex_ready'),
          ]
          for task_id, old, new in transitions:
              prefix = f'| {task_id} | {old} |'
              hits = [i for i,l in enumerate(lines) if l.startswith(prefix)]
              if len(hits) != 1:
                  raise SystemExit(f'{task_id}_row_count:{len(hits)}')
              lines[hits[0]] = lines[hits[0]].replace(prefix, f'| {task_id} | {new} |', 1)
          updated = ''.join(lines) + marker + tail
          if updated.split(marker, 1)[1] != tail:
              raise SystemExit('historical_tail_changed')
          p.write_text(updated)
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "docs/E150/OpenTasks.md"
          stats="$(git diff --numstat -- docs/E150/OpenTasks.md)"
          test "$stats" = $'2\t2\tdocs/E150/OpenTasks.md' || { echo "unexpected_diff:$stats"; exit 43; }
          grep -Fq '| ALPHA2-OPENTASKS-SINGLE-WRITER-01 | review | P0 |' docs/E150/OpenTasks.md
          grep -Fq '| ALPHA2-ORCHESTRATOR-LOOP-01 | codex_ready | P0 |' docs/E150/OpenTasks.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/E150/OpenTasks.md
          git commit -m 'docs(alpha2): close single writer and authorize orchestrator'
          git push origin HEAD:docs/alpha2-single-writer-close-orchestrator-authorize-current-01
          git rm .github/workflows/alpha2-close-single-writer-authorize-orchestrator-current.yml
          git commit -m 'chore(alpha2): remove current one-shot reconciler'
          git push origin HEAD:docs/alpha2-single-writer-close-orchestrator-authorize-current-01
