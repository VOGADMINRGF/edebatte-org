name: Verify Voxy Local Composition Recovery 01

on:
  push:
    branches:
      - fix/voxy-local-composition-recovery-01

permissions:
  contents: write

concurrency:
  group: verify-voxy-local-composition-recovery-01
  cancel-in-progress: false

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Verify exact base and bounded diff
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MAIN='7dfe1ab2b44fa28a5a59c6d35b8e1f0d90efaac4'
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base HEAD origin/main)" = "$EXPECTED_MAIN"
          git diff --check origin/main...HEAD
          mapfile -t FILES < <(git diff --name-only origin/main...HEAD | grep -v '^.github/workflows/verify-voxy-local-composition-recovery-01.yml$' | sort)
          EXPECTED=(
            'apps/web/scripts/run-voxy-local-composition-worker.ts'
            'apps/web/src/features/voxyVideo/localCompositionRuntimeService.ts'
            'apps/web/tests/voxy-local-composition-recovery.contract.test.ts'
          )
          printf '%s\n' "${FILES[@]}" > /tmp/files.actual
          printf '%s\n' "${EXPECTED[@]}" | sort > /tmp/files.expected
          diff -u /tmp/files.expected /tmp/files.actual

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Focused recovery and runtime contracts
        run: pnpm --dir apps/web exec vitest run tests/voxy-local-composition-recovery.contract.test.ts tests/voxy-local-composition-runtime.contract.test.ts

      - name: Typecheck
        run: pnpm --dir apps/web run typecheck

      - name: Repository integrity guards
        run: pnpm --dir apps/web run test:repository-integrity-guards

      - name: Final diff check
        shell: bash
        run: |
          set -euo pipefail
          git diff --check origin/main...HEAD

      - name: Remove one-shot workflow
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          BRANCH='fix/voxy-local-composition-recovery-01'
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/verify-voxy-local-composition-recovery-01.yml
          git commit -m 'chore: remove #978 verify workflow'
          git push origin "HEAD:$BRANCH"
