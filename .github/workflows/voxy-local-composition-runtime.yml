name: Voxy Local Composition Runtime

on:
  pull_request:
    paths:
      - ".github/workflows/voxy-local-composition-runtime.yml"
      - "apps/web/package.json"
      - "apps/web/scripts/register-voxy-local-composition-audio.ts"
      - "apps/web/scripts/render-voxy-local-composition.ts"
      - "apps/web/scripts/render-voxy-local-composition-smoke.ts"
      - "apps/web/scripts/render-voxy-editorial-composition-smoke.ts"
      - "apps/web/src/app/api/admin/voxy-studio/**"
      - "apps/web/src/app/api/dossier/**/studio/workspace/route.ts"
      - "apps/web/src/app/admin/review/voxy-studio/**"
      - "apps/web/src/features/voxyVideo/editorialAgent*.ts"
      - "apps/web/src/features/voxyVideo/editorialAudioMotion.server.ts"
      - "apps/web/src/features/voxyVideo/editorialAutonomyStore.ts"
      - "apps/web/src/features/voxyVideo/editorialCompositionAssets.server.ts"
      - "apps/web/src/features/voxyVideo/editorialCompositionHtml.ts"
      - "apps/web/src/features/voxyVideo/editorialRenderEvidence.ts"
      - "apps/web/src/features/voxyVideo/editorialStoryPlan.ts"
      - "apps/web/src/features/voxyVideo/finalCanon.ts"
      - "apps/web/src/features/voxyVideo/headAlphaSilhouette.ts"
      - "apps/web/src/features/voxyVideo/motionV4Html.ts"
      - "apps/web/src/features/voxyVideo/localCompositionAudioAssetStore.ts"
      - "apps/web/src/features/voxyVideo/localCompositionRuntime.ts"
      - "apps/web/src/features/voxyVideo/localCompositionRuntimeService.ts"
      - "apps/web/src/features/voxyVideo/localCompositionRuntimeStore.ts"
      - "apps/web/src/features/voxyVideo/localCompositionProcessExecutor.ts"
      - "apps/web/src/features/voxyVideo/localCompositionReviewBridge.ts"
      - "apps/web/src/features/voxyVideo/studioDraft.ts"
      - "apps/web/src/features/voxyVideo/studioDraftService.ts"
      - "apps/web/src/features/voxyVideo/studioDraftStore.ts"
      - "apps/web/src/features/voxyVideo/studioDossierAutoIntake.ts"
      - "apps/web/src/features/voxyVideo/studioDossierEvidenceAuthority.ts"
      - "apps/web/src/features/voxyVideo/studioLayoutSafety.ts"
      - "apps/web/src/features/voxyVideo/studioLocalCompositionFreshness.ts"
      - "apps/web/src/features/voxyVideo/studioLocaleReviewMatrix.ts"
      - "apps/web/src/features/voxyVideo/studioOperatorEdit.ts"
      - "apps/web/src/features/voxyVideo/studioProductionContext.ts"
      - "apps/web/src/features/voxyVideo/studioRenderBindingGuard.ts"
      - "apps/web/src/features/voxyVideo/studioRenderHandoff.ts"
      - "apps/web/src/features/voxyVideo/studioStoryPlanBuilder.ts"
      - "apps/web/src/features/voxyVideo/index.ts"
      - "apps/web/tests/voxy-local-composition-runtime.contract.test.ts"
      - "apps/web/tests/voxy-local-composition-freshness.contract.test.ts"
      - "apps/web/tests/voxy-local-composition-review-bridge.contract.test.ts"
      - "apps/web/tests/voxy-editorial-audio-motion.contract.test.ts"
      - "apps/web/tests/voxy-editorial-composition-html.contract.test.ts"
      - "apps/web/tests/voxy-editorial-agent-council.contract.test.ts"
      - "apps/web/tests/voxy-editorial-agent-learning.contract.test.ts"
      - "apps/web/tests/voxy-studio-admin-auth.contract.test.ts"
      - "apps/web/tests/voxy-studio-audio-motion-preview.contract.test.ts"
      - "apps/web/tests/voxy-studio-dossier-auto-intake.contract.test.ts"
      - "apps/web/tests/voxy-studio-draft-service.contract.test.ts"
      - "apps/web/tests/voxy-studio-frame-preview.contract.test.ts"
      - "apps/web/tests/voxy-studio-immutable-render-binding.contract.test.ts"
      - "apps/web/tests/voxy-studio-layout-approval.contract.test.ts"
      - "apps/web/tests/voxy-studio-layout-safety.contract.test.ts"
      - "apps/web/tests/voxy-studio-locale-review-matrix.contract.test.ts"
      - "apps/web/tests/voxy-studio-operator-edit.contract.test.ts"
      - "apps/web/tests/voxy-studio-persistence-boundary.contract.test.ts"
      - "apps/web/tests/voxy-studio-production-context.contract.test.ts"
      - "apps/web/tests/voxy-studio-render-handoff.contract.test.ts"
      - "docs/E150/VOXY-LOCAL-COMPOSITION-RUNTIME-01_2026-09-21.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract-and-real-render:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium and FFmpeg
        run: |
          pnpm -C apps/web exec playwright install --with-deps chromium
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Runtime, editorial-canon and Studio contract tests
        run: |
          pnpm -C apps/web run test:voxy-local-composition-runtime
          pnpm -C apps/web exec vitest run tests/voxy-local-composition-freshness.contract.test.ts
          pnpm -C apps/web exec vitest run tests/voxy-editorial-audio-motion.contract.test.ts tests/voxy-editorial-composition-html.contract.test.ts tests/voxy-studio-admin-auth.contract.test.ts tests/voxy-studio-audio-motion-preview.contract.test.ts tests/voxy-studio-dossier-auto-intake.contract.test.ts tests/voxy-studio-draft-service.contract.test.ts tests/voxy-studio-frame-preview.contract.test.ts tests/voxy-studio-immutable-render-binding.contract.test.ts tests/voxy-studio-layout-approval.contract.test.ts tests/voxy-studio-layout-safety.contract.test.ts tests/voxy-studio-locale-review-matrix.contract.test.ts tests/voxy-studio-operator-edit.contract.test.ts tests/voxy-studio-persistence-boundary.contract.test.ts tests/voxy-studio-production-context.contract.test.ts tests/voxy-studio-render-handoff.contract.test.ts tests/voxy-editorial-agent-council.contract.test.ts tests/voxy-editorial-agent-learning.contract.test.ts

      - name: Typecheck and diff guard
        run: |
          pnpm -C apps/web run typecheck
          git diff --check

      - name: Real final-canon editorial frame smoke
        run: pnpm -C apps/web exec tsx scripts/render-voxy-editorial-composition-smoke.ts --output-root=../../artifacts/voxy-editorial-composition-smoke

      - name: Real three-format MP4/WebM composition and recovery smoke
        run: pnpm -C apps/web run render:voxy-local-composition-smoke -- --output-root=../../artifacts/voxy-local-composition-runtime-smoke

      - name: Upload revisions-bound render evidence
        uses: actions/upload-artifact@v4
        with:
          name: voxy-local-composition-runtime-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: |
            artifacts/voxy-editorial-composition-smoke/editorial-smoke-manifest.json
            artifacts/voxy-editorial-composition-smoke/editorial-16x9.png
            artifacts/voxy-editorial-composition-smoke/editorial-9x16.png
            artifacts/voxy-editorial-composition-smoke/editorial-1x1.png
            artifacts/voxy-local-composition-runtime-smoke/smoke-evidence.json
            artifacts/voxy-local-composition-runtime-smoke/voxy-local-job-*/master.mp4
            artifacts/voxy-local-composition-runtime-smoke/voxy-local-job-*/preview.webm
            artifacts/voxy-local-composition-runtime-smoke/voxy-local-job-*/captions.vtt
            artifacts/voxy-local-composition-runtime-smoke/voxy-local-job-*/captions.srt
            artifacts/voxy-local-composition-runtime-smoke/voxy-local-job-*/composition-manifest.json
