name: Voxy audit F2 preflight

on:
  push:
    branches:
      - ops/voxy-audit-f2-preflight-01

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "6d17563fd226edf87730a1ccb52405528f7ca73f"
          test "$(git merge-base HEAD origin/main)" = "6d17563fd226edf87730a1ccb52405528f7ca73f"
      - name: Canonical task preflight on main
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "6d17563fd226edf87730a1ccb52405528f7ca73f"
          node scripts/codex-task-preflight.mjs VOXY-LOCAL-COMPOSITION-RECOVERY-01 2>&1 | tee /tmp/preflight.json
          grep -q '"status": "codex_ready"' /tmp/preflight.json
          grep -q '"executable": true' /tmp/preflight.json
          grep -q '"branchCreationAllowed": true' /tmp/preflight.json
