name: Voxy audit F2 preflight

on:
  push:
    branches:
      - ops/voxy-audit-f2-preflight-01

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "386026ca5830f08d996a8c6e91f85d7e5367daf4"
          test "$(git merge-base HEAD origin/main)" = "386026ca5830f08d996a8c6e91f85d7e5367daf4"
      - name: Canonical task preflight on main
        shell: bash
        run: |
          set -euo pipefail
          git checkout -B main origin/main
          test "$(git rev-parse HEAD)" = "386026ca5830f08d996a8c6e91f85d7e5367daf4"
          node scripts/codex-task-preflight.mjs VOXY-LOCAL-COMPOSITION-RECOVERY-01 2>&1 | tee /tmp/preflight.json
          grep -q '"status": "codex_ready"' /tmp/preflight.json
          grep -q '"executable": true' /tmp/preflight.json
          grep -q '"branchCreationAllowed": true' /tmp/preflight.json
