name: Temporary close Personal Voxy memory

on:
  push:
    branches:
      - docs/voxy-civic-activity-relevance-01-ssot

permissions:
  contents: write

jobs:
  close-memory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/voxy-civic-activity-relevance-01-ssot
      - name: Fail closed and close only Personal Voxy memory task
        shell: bash
        env:
          EXPECTED_MAIN: 5807fb080bfca92ee6d2c9239acf30ffd2c434b3
          EXPECTED_BRANCH_OPENTASKS_BLOB: 716d6c2c2216a9a799764904701891238b192de3
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN" || { echo "main_drift:$(git rev-parse origin/main)"; exit 41; }
          test "$(git rev-parse HEAD:docs/E150/OpenTasks.md)" = "$EXPECTED_BRANCH_OPENTASKS_BLOB" || { echo "branch_opentasks_drift:$(git rev-parse HEAD:docs/E150/OpenTasks.md)"; exit 42; }
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('docs/E150/OpenTasks.md')
          text = p.read_text(encoding='utf-8')
          marker = '## Historischer Katalog und Evidenz'
          if marker not in text:
              raise SystemExit('history_marker_missing')
          head, history = text.split(marker, 1)
          before = hashlib.sha256(history.encode()).hexdigest()
          task = 'PERSONAL-VOXY-CONSENTED-MEMORY-RUNTIME-01'
          lines = head.splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines) if line.startswith(f'| {task} |')]
          if len(matches) != 1:
              raise SystemExit(f'memory_row_count:{len(matches)}')
          i = matches[0]
          line = lines[i]
          if '| codex_ready | P0 |' not in line:
              raise SystemExit('memory_status_not_codex_ready')
          line = line.replace('| codex_ready | P0 |', '| review | P0 |', 1)
          if 'Issue `#1024`;' not in line:
              raise SystemExit('memory_issue_ref_missing')
          line = line.replace(
              'Issue `#1024`;',
              'Issue `#1024`; PR `#1043`; merge `d7f3884455958d65db0e03bc1bf2e0c78e70dd81`;',
              1,
          )
          lines[i] = line
          new_text = ''.join(lines) + marker + history
          if hashlib.sha256(history.encode()).hexdigest() != before:
              raise SystemExit('historical_tail_changed')
          p.write_text(new_text, encoding='utf-8')
          PY
          git diff --check
          grep -q '^| PERSONAL-VOXY-CONSENTED-MEMORY-RUNTIME-01 | review | P0 |' docs/E150/OpenTasks.md
          changed_files="$(git diff --name-only)"
          test "$changed_files" = "docs/E150/OpenTasks.md" || { echo "$changed_files"; exit 43; }
          rm .github/workflows/tmp-close-personal-memory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/E150/OpenTasks.md .github/workflows/tmp-close-personal-memory.yml
          git commit -m "docs(e150): close Personal Voxy memory after merge"
          git push origin HEAD:docs/voxy-civic-activity-relevance-01-ssot
