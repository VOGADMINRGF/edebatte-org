name: One-shot OBSERVABILITY-INVENTORY-01 preflight

on:
  push:
    branches:
      - docs/governance-ssot-sync-05
    paths:
      - .github/workflows/opentasks-observability-inventory-preflight.yml

permissions:
  contents: write

concurrency:
  group: governance-ssot-writer
  cancel-in-progress: false

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout carrier branch
        uses: actions/checkout@v4
        with:
          ref: docs/governance-ssot-sync-05
          path: carrier
          fetch-depth: 2

      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          ref: main
          path: mainrepo
          fetch-depth: 1

      - name: Verify exact main and run task preflight
        shell: bash
        run: |
          set -euo pipefail
          expected="66475776dfae4b5109308269c156ff8ef488bb95"
          actual="$(git -C mainrepo rev-parse HEAD)"
          test "$actual" = "$expected"
          test "$(git -C mainrepo branch --show-current)" = "main"
          test -z "$(git -C mainrepo status --porcelain)"
          (
            cd mainrepo
            node scripts/codex-task-preflight.mjs OBSERVABILITY-INVENTORY-01
          ) | tee preflight.json
          node - <<'NODE'
          const fs = require('fs');
          const p = JSON.parse(fs.readFileSync('preflight.json', 'utf8'));
          if (p.taskId !== 'OBSERVABILITY-INVENTORY-01') throw new Error('unexpected taskId');
          if (p.status !== 'codex_ready') throw new Error(`unexpected status: ${p.status}`);
          if (p.executable !== true) throw new Error('task is not executable');
          if (p.branchCreationAllowed !== true) throw new Error('branch creation not allowed');
          NODE

      - name: Remove one-shot workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cd carrier
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/opentasks-observability-inventory-preflight.yml
          git commit -m "ci(governance): remove observability inventory preflight"
          git push origin HEAD:docs/governance-ssot-sync-05
