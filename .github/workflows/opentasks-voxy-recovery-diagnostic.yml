name: OpenTasks Voxy Recovery Diagnostic

on:
  push:
    branches:
      - docs/governance-ssot-sync-05
    paths:
      - .github/workflows/opentasks-voxy-recovery-diagnostic.yml

permissions:
  contents: write

concurrency:
  group: governance-ssot-writer
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/governance-ssot-sync-05
          fetch-depth: 0

      - name: Read current main OpenTasks without mutation
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          BLOB_SHA="$(git rev-parse origin/main:docs/E150/OpenTasks.md)"
          git show origin/main:docs/E150/OpenTasks.md > /tmp/OpenTasks.md
          python - <<'PY'
          from pathlib import Path
          import hashlib
          p = Path('/tmp/OpenTasks.md')
          text = p.read_text()
          op = '## Kanonischer Operativteil'
          hist = '## Historischer Katalog und Evidenz'
          assert text.count(op) == 1
          assert text.count(hist) == 1
          oi = text.index(op)
          hi = text.index(hist)
          assert oi < hi
          operative = text[oi:hi]
          history = text[hi:]
          ids = [
              'VOXY-LOCAL-COMPOSITION-RECOVERY-01',
              'VOXY-EDITORIAL-COUNCIL-FAIL-CLOSED-01',
              'VOXY-RENDER-APPROVAL-FRESHNESS-01',
              'VOXY-STUDIO-REVIEW-CONSISTENCY-01',
              'VOXY-EU24-MULTILINGUAL-EDITORIAL-01',
              'YOUTUBE-SERVERLESS-SOURCE-RUNTIME-01',
              'VOXY-200PCT-VISUAL-QA-CHECKPOINT-01',
          ]
          print('HISTORY_SHA256=' + hashlib.sha256(history.encode()).hexdigest())
          for task_id in ids:
              lines = [line for line in operative.splitlines() if task_id in line]
              print(f'{task_id}_COUNT={len(lines)}')
              for line in lines:
                  print('ROW=' + line)
          assert 'VOXY-LOCAL-COMPOSITION-RECOVERY-01' not in operative
          for required in [
              'VOXY-EDITORIAL-COUNCIL-FAIL-CLOSED-01',
              'VOXY-RENDER-APPROVAL-FRESHNESS-01',
              'VOXY-STUDIO-REVIEW-CONSISTENCY-01',
              'VOXY-EU24-MULTILINGUAL-EDITORIAL-01',
              'YOUTUBE-SERVERLESS-SOURCE-RUNTIME-01',
              'VOXY-200PCT-VISUAL-QA-CHECKPOINT-01',
          ]:
              assert sum(required in line for line in operative.splitlines()) == 1
          PY
          echo "MAIN_SHA=$MAIN_SHA"
          echo "OPENTASKS_BLOB=$BLOB_SHA"

      - name: Self-delete diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/opentasks-voxy-recovery-diagnostic.yml
          git commit -m 'chore(governance): remove #978 recovery diagnostic'
          git push origin HEAD:docs/governance-ssot-sync-05
