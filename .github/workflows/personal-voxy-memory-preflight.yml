name: Personal Voxy memory audit

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  focused-memory-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check current canonical main authorization
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git checkout -B main origin/main
          echo "main_sha=$(git rev-parse HEAD)"
          test -z "$(git status --porcelain)"
          node scripts/codex-task-preflight.mjs PERSONAL-VOXY-CONSENTED-MEMORY-RUNTIME-01
      - name: Checkout exact implementation head
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin feat/personal-voxy-consented-memory-runtime-01
          git checkout --detach 45a1248c42fb44fd2df1b9a202c2f313d5697a85
          test "$(git rev-parse HEAD)" = "45a1248c42fb44fd2df1b9a202c2f313d5697a85"
          git diff --check 14f2350dd53317088014ccd45ee3687cb117b111...HEAD
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run focused Personal Voxy memory contract
        run: pnpm -C apps/web exec vitest run tests/personal-voxy-consented-memory.contract.test.ts
