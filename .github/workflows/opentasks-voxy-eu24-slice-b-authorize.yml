name: OpenTasks Voxy EU24 Slice B authorize

on:
  push:
    branches:
      - docs/voxy-eu24-slice-b-authorize-01

permissions:
  contents: write

concurrency:
  group: governance-ssot-writer
  cancel-in-progress: false

jobs:
  authorize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/voxy-eu24-slice-b-authorize-01
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Verify exact source state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "8b80990c84d83a89c278b6a8a0ac5f3211b89b9a"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          test "$(git diff --name-only origin/main..HEAD)" = ".github/workflows/opentasks-voxy-eu24-slice-b-authorize.yml"
          test "$(git rev-parse 'HEAD:docs/E150/OpenTasks.md')" = "3f709abd9ba98f50f4e9de065aa58ec7e07c9645"
          test -z "$(git status --porcelain)"

      - name: Serialize and locally commit Slice B only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('docs/E150/OpenTasks.md')
          text = path.read_text(encoding='utf-8')
          start_marker = '## Kanonischer Operativteil'
          end_marker = '## Historischer Katalog und Evidenz'
          target = 'VOXY-EU24-MULTILINGUAL-EDITORIAL-01'
          assert text.count(start_marker) == 1
          assert text.count(end_marker) == 1
          start = text.index(start_marker)
          end = text.index(end_marker)
          history = text[end:]
          historical_hash = hashlib.sha256(history.encode('utf-8')).hexdigest()
          lines = text[start:end].splitlines(keepends=True)
          indexes = [i for i, line in enumerate(lines) if target in line]
          assert len(indexes) == 1, f'operative_target_count={len(indexes)}'
          idx = indexes[0]
          old_line = lines[idx]
          assert '| review |' in old_line, 'target_not_review'
          assert 'Slice A only:' in old_line, 'slice_a_scope_missing'
          assert 'Slices B' in old_line and 'nicht autorisiert' in old_line, 'followup_gate_missing'

          new_line = (
            '| VOXY-EU24-MULTILINGUAL-EDITORIAL-01 | codex_ready | P0 | '
            '`ECOSYSTEM-I18N-CONTRACT-01` / #566; Voxy #310/#567/#568; #570 via #967; Intake #969; Slice A abgeschlossen | '
            '**Slice B only — Language-Variant Revision Contract:** bestehenden `VoxyEditorialStoryPlan`-/Studio-/Evidence-Anschluss ohne zweiten Story-/Translation-Store revisionssicher erweitern; '
            'sprachgebundene Variante muss kanonisch `sourceLanguage`, `targetLanguage`, `translatedFromStoryPlanId`, `translatedFromStoryPlanRevision`, exakte Evidence-/Source-Pack-Bindung, `translationRevision`, deterministischen `translationHash`, `translationStatus` und `reviewRequired=true` führen; '
            'bestehende Draft-/Approval-/Audio-/Caption-/Render-Bindungen wiederverwenden und die Variante an dieselbe Story-/Evidence-Wahrheit binden | '
            'Master-Story-Revision oder Evidence-Fingerprint driftet → Variante stale/reviewpflichtig; `translationRevision`/`translationHash` driftet → Voice/Caption/Render derselben Variante stale; '
            'Übersetzung darf niemals Claim-/Source-/Evidence-IDs oder Truth-/Reviewstatus hochstufen; kein Locale-/Voice-Fallback; kein Provider-/Modell- oder Auto-Translate-Gate; '
            'kein neuer Translation-/Story-/Evidence-/Review-/Voice-/Caption-/Render-Store; fokussierte Provenienz-/Staleness-/Binding-Contracts + bestehender Voxy Runtime/Final-Canon/Web-CI + Typecheck/Lint/Build/`git diff --check`; '
            '**Slices C–E bleiben nicht autorisiert** |\n'
          )
          lines[idx] = new_line
          new_operative = ''.join(lines)
          new_text = text[:start] + new_operative + text[end:]
          new_end = start + len(new_operative)
          assert hashlib.sha256(new_text[new_end:].encode('utf-8')).hexdigest() == historical_hash, 'historical_tail_mutated'
          assert new_text.count(target) == text.count(target), 'target_count_changed'
          path.write_text(new_text, encoding='utf-8')
          print('OLD_ROW=' + old_line.rstrip('\n'))
          print('NEW_ROW=' + new_line.rstrip('\n'))
          PY

          git diff --check
          test "$(git diff --numstat -- docs/E150/OpenTasks.md)" = $'1\t1\tdocs/E150/OpenTasks.md'
          test "$(git diff --name-only)" = "docs/E150/OpenTasks.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/E150/OpenTasks.md
          git commit -m 'docs(e150): authorize Voxy EU24 Slice B'
          test -z "$(git status --porcelain)"

      - name: Verify branch gate is the only preflight blocker
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/codex-task-preflight.mjs VOXY-EU24-MULTILINGUAL-EDITORIAL-01 > /tmp/preflight.txt 2>&1
          rc=$?
          set -e
          cat /tmp/preflight.txt
          test "$rc" -eq 1
          grep -F '"status": "codex_ready"' /tmp/preflight.txt
          grep -F '"executable": false' /tmp/preflight.txt
          grep -F '"reason": "branch_not_main:docs/voxy-eu24-slice-b-authorize-01"' /tmp/preflight.txt
          if grep -F 'branchCreationAllowed' /tmp/preflight.txt; then
            echo 'branchCreationAllowed unexpectedly present before main merge' >&2
            exit 1
          fi
          test -z "$(git status --porcelain)"

      - name: Self-delete writer and push canonical SSOT delta
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/opentasks-voxy-eu24-slice-b-authorize.yml
          git commit -m 'chore(e150): remove Voxy EU24 Slice B writer'
          test "$(git diff --name-only origin/main..HEAD)" = "docs/E150/OpenTasks.md"
          git diff origin/main..HEAD --check
          git push origin HEAD:docs/voxy-eu24-slice-b-authorize-01
