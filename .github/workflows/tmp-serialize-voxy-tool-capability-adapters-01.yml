name: Temporary serialize Voxy tool capability adapters

on:
  push:
    branches:
      - docs/voxy-tool-capability-adapters-01-ssot-v2

permissions:
  contents: write

jobs:
  serialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/voxy-tool-capability-adapters-01-ssot-v2
      - name: Fail closed and serialize exactly one OpenTasks row
        shell: bash
        env:
          EXPECTED_MAIN: 7baf2e465e07d754d998f8a050588971ce8513a0
          EXPECTED_OPENTASKS_BLOB: 982deb4f851e60d5a369b8d471ae95b52b2d3307
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          observed_main="$(git rev-parse origin/main)"
          test "$observed_main" = "$EXPECTED_MAIN" || { echo "main_drift:$observed_main"; exit 41; }
          observed_blob="$(git rev-parse origin/main:docs/E150/OpenTasks.md)"
          test "$observed_blob" = "$EXPECTED_OPENTASKS_BLOB" || { echo "opentasks_blob_drift:$observed_blob"; exit 42; }
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/E150/OpenTasks.md')
          text = p.read_text(encoding='utf-8')
          task_id = 'VOXY-TOOL-CAPABILITY-ADAPTERS-01'
          if task_id in text:
              raise SystemExit('task_already_present')
          memory = '| PERSONAL-VOXY-CONSENTED-MEMORY-RUNTIME-01 |'
          anchor = '| AI-CREATE-ORCHESTRATOR-LIVE-SMOKE-01 |'
          if text.count(memory) != 1:
              raise SystemExit(f'memory_owner_count:{text.count(memory)}')
          if text.count(anchor) != 1:
              raise SystemExit(f'anchor_count:{text.count(anchor)}')
          row = "| VOXY-TOOL-CAPABILITY-ADAPTERS-01 | codex_ready | P0 | Issue `#1027`; `PERSONAL-VOXY-CONSENTED-MEMORY-RUNTIME-01` implemented via PR `#1043`; `SHARED-CONVERSATION-CONTRACT-01`; Alpha2 Risk/Action Gate, Fleet Tool Permissions, Execution Fence/Idempotency; Single-Writer `#447` | Provider- und app-neutralen typed Tool-Capability-Vertrag auf bestehende Alpha2- und Domain-Owner setzen: stabile Capability-ID/Version, Schema-/Owner-Referenz, Action-Klasse, Permission-/Consent-/Connection-Kontext, Preview/Dry-Run, Reversibility/Idempotency, Timeout/Retry und sichere Result-/Trace-Metadaten; kein zweiter Orchestrator oder Action-Owner | Start nur nach positivem taskbezogenen Preflight; erster Pilot ausschließlich bestehende interne eDebatte-Faehigkeiten; unbekannte/stale Capability oder Permission fail-closed; Human-only Actions wie `notify_external`, `merge_code`, `deploy`, `spend_money`, `enter_contract`, Rights/Entitlements, destructive Infra sowie Secret/Security bleiben human-only und nicht herunterstufbar; keine dynamischen Endpoints, keine direkte DB/Provider-Ausfuehrung aus Voxy, keine politische Vote-/Persuasion-Aktion, keine externe App-Autonomie, kein Auto-Publish |\n"
          text = text.replace(anchor, row + anchor, 1)
          if text.count(task_id) != 1:
              raise SystemExit(f'task_count_after:{text.count(task_id)}')
          p.write_text(text, encoding='utf-8')
          PY
          git diff --check
          test "$(git diff --numstat -- docs/E150/OpenTasks.md | awk '{print $1":"$2}')" = "1:0" || { git diff --numstat -- docs/E150/OpenTasks.md; exit 43; }
          rm .github/workflows/tmp-serialize-voxy-tool-capability-adapters-01.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/E150/OpenTasks.md .github/workflows/tmp-serialize-voxy-tool-capability-adapters-01.yml
          git commit -m "docs(e150): serialize Voxy tool capability adapters"
          git push origin HEAD:docs/voxy-tool-capability-adapters-01-ssot-v2
