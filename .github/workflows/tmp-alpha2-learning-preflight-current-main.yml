name: Temporary Alpha2 learning current-main preflight

on:
  push:
    branches:
      - chore/alpha2-learning-preflight-current-main-01

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Verify exact main and task preflight
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "436792e81629fa54624d7863ca0c957e87124b6d"
          git checkout main
          node scripts/codex-task-preflight.mjs ALPHA2-LEARNING-EVALS-01 | tee /tmp/preflight.json
          node - <<'NODE'
          const fs = require('fs');
          const r = JSON.parse(fs.readFileSync('/tmp/preflight.json','utf8'));
          if (r.status !== 'codex_ready' || r.executable !== true || r.branchCreationAllowed !== true) {
            throw new Error(`unexpected preflight: ${JSON.stringify(r)}`);
          }
          NODE
