name: OpenTasks Observability Tail Diagnostic

on:
  push:
    branches:
      - docs/governance-ssot-sync-05
    paths:
      - .github/workflows/opentasks-observability-tail-diagnostic.yml

permissions:
  contents: write

concurrency:
  group: governance-ssot-writer
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/governance-ssot-sync-05
          fetch-depth: 0
      - name: Pin main blob and historical tail hash
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "616ebdc21cd9187a8b1f45410f38a7cd8acdf59f"
          BLOB="$(git rev-parse origin/main:docs/E150/OpenTasks.md)"
          echo "OPENTASKS_BLOB=${BLOB}"
          test "${BLOB}" = "eed4aa5f8fd9b4fa7ee5585611d2946d4e8002bf"
          git show origin/main:docs/E150/OpenTasks.md > /tmp/OpenTasks.md
          python - <<'PY'
          from pathlib import Path
          import hashlib
          text = Path('/tmp/OpenTasks.md').read_text()
          op = '## Kanonischer Operativteil'
          hist = '## Historischer Katalog und Evidenz'
          if text.count(op) != 1 or text.count(hist) != 1:
              raise SystemExit('operative/historical marker uniqueness failed')
          start = text.index(hist)
          tail = text[start:]
          print('HISTORICAL_TAIL_SHA256=', hashlib.sha256(tail.encode()).hexdigest())
          operative = text[text.index(op):start]
          target=[]
          dependent=[]
          for line in operative.splitlines():
              if not line.startswith('|'):
                  continue
              cells=[c.strip() for c in line.strip().strip('|').split('|')]
              if cells and cells[0] == 'OBSERVABILITY-INVENTORY-01': target.append(line)
              if cells and cells[0] == 'PROD-OBSERVABILITY-INCIDENT-SLO-01': dependent.append(line)
          print('TARGET_COUNT=', len(target))
          print('TARGET_ROW=', target[0] if len(target)==1 else target)
          print('DEPENDENT_COUNT=', len(dependent))
          print('DEPENDENT_ROW=', dependent[0] if len(dependent)==1 else dependent)
          if len(target) != 1 or len(dependent) != 1:
              raise SystemExit('target/dependent uniqueness failed')
          PY
      - name: Self-delete diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/opentasks-observability-tail-diagnostic.yml
          git commit -m 'ci(governance): remove #611 tail diagnostic'
          git push origin HEAD:docs/governance-ssot-sync-05
