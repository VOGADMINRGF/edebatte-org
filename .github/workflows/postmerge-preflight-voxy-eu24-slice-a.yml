name: Postmerge preflight Voxy EU24 Slice A

on:
  push:
    branches:
      - chore/voxy-eu24-slice-a-postmerge-preflight-20260924

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/voxy-eu24-slice-a-postmerge-preflight-20260924
          fetch-depth: 0

      - name: Verify post-merge task state
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "9b01fc00b3a4adeaf452a67501d31b97dd091c40"
          git checkout -B main origin/main
          test "$(git rev-parse 'HEAD:docs/E150/OpenTasks.md')" = "42031e2418a4e3255e9a9d0f72646f886c49c0fd"
          set +e
          node scripts/codex-task-preflight.mjs VOXY-EU24-MULTILINGUAL-EDITORIAL-01 > /tmp/preflight.txt 2>&1
          rc=$?
          set -e
          cat /tmp/preflight.txt
          test "$rc" -eq 1
          grep -F '"status": "review"' /tmp/preflight.txt
          grep -F '"executable": false' /tmp/preflight.txt
          grep -F '"reason": "task_status_not_executable:review"' /tmp/preflight.txt
          if grep -F 'branchCreationAllowed' /tmp/preflight.txt; then
            echo 'branchCreationAllowed unexpectedly present' >&2
            exit 1
          fi

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git checkout chore/voxy-eu24-slice-a-postmerge-preflight-20260924
          git rm .github/workflows/postmerge-preflight-voxy-eu24-slice-a.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(governance): remove Voxy EU24 postmerge preflight'
          git push origin HEAD:chore/voxy-eu24-slice-a-postmerge-preflight-20260924
