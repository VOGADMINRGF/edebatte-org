name: OpenTasks Observability Inventory Review Sync

on:
  push:
    branches:
      - docs/governance-ssot-sync-05
    paths:
      - .github/workflows/opentasks-observability-inventory-review-sync.yml

permissions:
  contents: write

concurrency:
  group: governance-ssot-writer
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/governance-ssot-sync-05
          fetch-depth: 0
      - name: Guard and serialize #611 Slice A lifecycle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA="616ebdc21cd9187a8b1f45410f38a7cd8acdf59f"
          BLOB_SHA="eed4aa5f8fd9b4fa7ee5585611d2946d4e8002bf"
          TAIL_SHA="27b444dbc3d2d01e8d2c5f0a1426a0842abfdbc8fa08bd2f97d39c248e51a399"
          test "$(git rev-parse origin/main)" = "${MAIN_SHA}"
          test "$(git rev-parse origin/main:docs/E150/OpenTasks.md)" = "${BLOB_SHA}"
          test "$(git rev-parse HEAD:docs/E150/OpenTasks.md)" = "${BLOB_SHA}"
          mapfile -t NET_FILES < <(git diff --name-only origin/main HEAD)
          test "${#NET_FILES[@]}" -eq 1
          test "${NET_FILES[0]}" = ".github/workflows/opentasks-observability-inventory-review-sync.yml"
          python - <<'PY'
          from pathlib import Path
          import hashlib

          path = Path('docs/E150/OpenTasks.md')
          text = path.read_text()
          op = '## Kanonischer Operativteil'
          hist = '## Historischer Katalog und Evidenz'
          expected_tail = '27b444dbc3d2d01e8d2c5f0a1426a0842abfdbc8fa08bd2f97d39c248e51a399'
          if text.count(op) != 1 or text.count(hist) != 1:
              raise SystemExit('marker uniqueness failed')
          op_start = text.index(op)
          hist_start = text.index(hist, op_start)
          if hist_start <= op_start:
              raise SystemExit('marker order failed')
          before_tail = text[hist_start:]
          if hashlib.sha256(before_tail.encode()).hexdigest() != expected_tail:
              raise SystemExit('historical tail hash mismatch before write')

          operative = text[op_start:hist_start]
          lines = operative.splitlines()
          target_idx = []
          dep_rows = []
          before_rows = {}
          for i, line in enumerate(lines):
              if not line.startswith('|'):
                  continue
              cells = [c.strip() for c in line.strip().strip('|').split('|')]
              if not cells:
                  continue
              task_id = cells[0]
              if task_id and task_id not in ('ID','---'):
                  before_rows[task_id] = line
              if task_id == 'OBSERVABILITY-INVENTORY-01':
                  target_idx.append(i)
              if task_id == 'PROD-OBSERVABILITY-INCIDENT-SLO-01':
                  dep_rows.append(line)
          if len(target_idx) != 1:
              raise SystemExit('expected exactly one target row')
          if len(dep_rows) != 1:
              raise SystemExit('expected exactly one dependent row')
          i = target_idx[0]
          old = lines[i]
          expected_old = '| OBSERVABILITY-INVENTORY-01 | codex_ready | P0 | Issue `#611` | Read-only/tests-first Logger-, Redaction-, Correlation-, Telemetry- und Audit-Inventur | Reuse-Matrix und reale Lücken; kein externer Export, SIEM-Kauf oder Atlas-Auditing-Aktivierung |'
          expected_new = '| OBSERVABILITY-INVENTORY-01 | review | P0 | Issue `#611` | Read-only/tests-first Logger-, Redaction-, Correlation-, Telemetry- und Audit-Inventur | Reuse-Matrix und reale Lücken; kein externer Export, SIEM-Kauf oder Atlas-Auditing-Aktivierung |'
          if old != expected_old:
              raise SystemExit('target row drifted')
          lines[i] = expected_new
          new_operative = '\n'.join(lines)
          if operative.endswith('\n'):
              new_operative += '\n'
          new_text = text[:op_start] + new_operative + text[hist_start:]
          if hashlib.sha256(new_text[new_text.index(hist):].encode()).hexdigest() != expected_tail:
              raise SystemExit('historical tail changed')

          after_op = new_text[new_text.index(op):new_text.index(hist)]
          after_rows = {}
          for line in after_op.splitlines():
              if not line.startswith('|'):
                  continue
              cells=[c.strip() for c in line.strip().strip('|').split('|')]
              if not cells:
                  continue
              task_id=cells[0]
              if task_id and task_id not in ('ID','---'):
                  after_rows[task_id]=line
          if set(before_rows) != set(after_rows):
              raise SystemExit('operative task ID set changed')
          for task_id, before in before_rows.items():
              if task_id == 'OBSERVABILITY-INVENTORY-01':
                  if after_rows[task_id] != expected_new:
                      raise SystemExit('target row not exactly replaced')
              elif after_rows[task_id] != before:
                  raise SystemExit(f'non-target operative row changed: {task_id}')
          if after_rows['PROD-OBSERVABILITY-INCIDENT-SLO-01'] != dep_rows[0]:
              raise SystemExit('dependent SLO row changed')
          path.write_text(new_text)
          PY
          git diff --check
          test "$(git diff --numstat -- docs/E150/OpenTasks.md)" = $'1\t1\tdocs/E150/OpenTasks.md'

          git branch -f main HEAD
          git checkout main
          PREFLIGHT="$(node scripts/codex-task-preflight.mjs OBSERVABILITY-INVENTORY-01)"
          echo "${PREFLIGHT}"
          export PREFLIGHT
          python - <<'PY'
          import json, os
          data=json.loads(os.environ['PREFLIGHT'])
          if data.get('taskId') != 'OBSERVABILITY-INVENTORY-01': raise SystemExit('wrong task id')
          if data.get('status') != 'review': raise SystemExit('expected review')
          if data.get('executable') is not False: raise SystemExit('expected executable=false')
          if data.get('reason') != 'task_status_not_executable:review': raise SystemExit('unexpected reason')
          if 'branchCreationAllowed' in data: raise SystemExit('branchCreationAllowed must be absent')
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/E150/OpenTasks.md
          git rm .github/workflows/opentasks-observability-inventory-review-sync.yml
          mapfile -t STAGED < <(git diff --cached --name-only | sort)
          test "${#STAGED[@]}" -eq 2
          test "${STAGED[0]}" = ".github/workflows/opentasks-observability-inventory-review-sync.yml"
          test "${STAGED[1]}" = "docs/E150/OpenTasks.md"
          git diff --cached --check
          git commit -m 'docs(e150): move #611 inventory slice to review'
          git push origin HEAD:docs/governance-ssot-sync-05
