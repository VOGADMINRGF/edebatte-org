name: CTGN repair closeout single writer

on:
  push:
    branches:
      - docs/governance-ssot-sync-05
    paths:
      - .github/workflows/ctgn-repair-closeout-single-writer.yml

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/governance-ssot-sync-05

      - name: Consume merged CTGN P1 repair authorizations
        shell: bash
        env:
          EXPECTED_MAIN: 1a96b2fe23a3d78684f3ddd18426910afbfbd121
          WORKFLOW_PATH: .github/workflows/ctgn-repair-closeout-single-writer.yml
        run: |
          set -euo pipefail

          git config user.name "VOGADMINRGF"
          git config user.email "rgf@voiceopengov.de"
          git fetch origin main

          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git merge-base origin/main HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD:docs/E150/OpenTasks.md)" = "$(git rev-parse origin/main:docs/E150/OpenTasks.md)"

          changed_before="$(git diff --name-only "$EXPECTED_MAIN"...HEAD | sed '/^$/d')"
          test "$changed_before" = "$WORKFLOW_PATH"

          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const path = 'docs/E150/OpenTasks.md';
          const operativeMarker = '## Kanonischer Operativteil';
          const historyMarker = '## Historischer Katalog und Evidenz';
          const text = fs.readFileSync(path, 'utf8');
          const operativeIndex = text.indexOf(operativeMarker);
          const historyIndex = text.indexOf(historyMarker);
          if (operativeIndex < 0 || historyIndex <= operativeIndex) throw new Error('open_tasks_structure_unclear');
          if (text.indexOf(operativeMarker, operativeIndex + operativeMarker.length) !== -1) throw new Error('duplicate_operative_marker');
          if (text.indexOf(historyMarker, historyIndex + historyMarker.length) !== -1) throw new Error('duplicate_history_marker');
          const historical = text.slice(historyIndex);
          const historicalHash = crypto.createHash('sha256').update(historical).digest('hex');
          const operative = text.slice(operativeIndex, historyIndex);
          const transitions = new Map([
            ['NEWSLETTER-DELIVERY-SEND-TIME-SAFETY-01', ['codex_ready', 'review']],
            ['DOSSIER-REVISION-ATOMIC-WRITER-01', ['codex_ready', 'review']],
          ]);
          const invariants = new Map([
            ['CROSS-LINGUAL-MEDIA-EVENT-RESEARCH-INTAKE-01', 'review'],
            ['GLOBAL-TOPIC-INTELLIGENCE-VERIFICATION-ORCHESTRATION-01', 'blocked'],
            ['PROVENANCE-EVIDENCE-LINEAGE-CROSS-LINGUAL-TOPIC-GRAPH-01', 'blocked'],
          ]);
          function esc(value) {
            return value.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
          }
          function countStatus(region, id, status) {
            const re = new RegExp(`^\\|\\s*${esc(id)}\\s*\\|\\s*${esc(status)}\\s*\\|`, 'gm');
            return (region.match(re) ?? []).length;
          }
          for (const [id, [from]] of transitions) {
            const count = countStatus(operative, id, from);
            if (count !== 1) throw new Error(`unexpected_before_status:${id}:${from}:${count}`);
          }
          for (const [id, status] of invariants) {
            const count = countStatus(operative, id, status);
            if (count !== 1) throw new Error(`unexpected_invariant_before:${id}:${status}:${count}`);
          }
          let next = text;
          for (const [id, [from, to]] of transitions) {
            const re = new RegExp(`^(\\|\\s*${esc(id)}\\s*\\|\\s*)${esc(from)}(\\s*\\|.*)$`, 'gm');
            let count = 0;
            next = next.replace(re, (_whole, prefix, suffix) => {
              count += 1;
              return `${prefix}${to}${suffix}`;
            });
            if (count !== 1) throw new Error(`status_transition_not_unique:${id}:${count}`);
          }
          const nextHistoryIndex = next.indexOf(historyMarker);
          const afterHistorical = next.slice(nextHistoryIndex);
          const afterHistoricalHash = crypto.createHash('sha256').update(afterHistorical).digest('hex');
          if (afterHistorical !== historical || afterHistoricalHash !== historicalHash) throw new Error('historical_tail_changed');
          const afterOperative = next.slice(next.indexOf(operativeMarker), nextHistoryIndex);
          for (const [id, [, to]] of transitions) {
            const count = countStatus(afterOperative, id, to);
            if (count !== 1) throw new Error(`unexpected_after_status:${id}:${to}:${count}`);
            if (countStatus(afterOperative, id, 'codex_ready') !== 0) throw new Error(`stale_authorization_survived:${id}`);
          }
          for (const [id, status] of invariants) {
            const count = countStatus(afterOperative, id, status);
            if (count !== 1) throw new Error(`invariant_changed:${id}:${status}:${count}`);
          }
          fs.writeFileSync(path, next);
          console.log(JSON.stringify({ historicalHash, transitions: Object.fromEntries(transitions), invariants: Object.fromEntries(invariants) }, null, 2));
          NODE

          git diff --check
          test "$(git diff --numstat -- docs/E150/OpenTasks.md)" = $'2\t2\tdocs/E150/OpenTasks.md'

          rm "$WORKFLOW_PATH"
          git add docs/E150/OpenTasks.md "$WORKFLOW_PATH"
          git commit -m "docs(e150): consume merged CTGN P1 repair authorizations"

          candidate_sha="$(git rev-parse HEAD)"
          test "$(git status --porcelain)" = ""
          changed_after="$(git diff --name-only "$EXPECTED_MAIN"...HEAD | sed '/^$/d')"
          test "$changed_after" = "docs/E150/OpenTasks.md"
          test "$(git diff --numstat "$EXPECTED_MAIN"...HEAD -- docs/E150/OpenTasks.md)" = $'2\t2\tdocs/E150/OpenTasks.md'

          git branch -D main 2>/dev/null || true
          git worktree add -b main /tmp/ctgn-closeout "$candidate_sha"
          (
            cd /tmp/ctgn-closeout
            node --input-type=module -e "import { getTaskStatus, runPreflight } from './scripts/codex-task-preflight.mjs'; const consumed=['NEWSLETTER-DELIVERY-SEND-TIME-SAFETY-01','DOSSIER-REVISION-ATOMIC-WRITER-01']; for (const id of consumed) { const {result,exitCode}=await runPreflight({taskId:id}); if (exitCode!==1 || result.status!=='review' || result.executable!==false || result.reason!=='task_status_not_executable:review') throw new Error('consumed_preflight_failed:'+id+':'+JSON.stringify(result)+':'+exitCode); console.log(JSON.stringify(result)); } const expected=new Map([['CROSS-LINGUAL-MEDIA-EVENT-RESEARCH-INTAKE-01','review'],['GLOBAL-TOPIC-INTELLIGENCE-VERIFICATION-ORCHESTRATION-01','blocked'],['PROVENANCE-EVIDENCE-LINEAGE-CROSS-LINGUAL-TOPIC-GRAPH-01','blocked']]); for (const [id,status] of expected) { const actual=await getTaskStatus(id); if (actual!==status) throw new Error(id+':'+actual+'!='+status); console.log(id+'='+actual); }"
            git diff --check
          )
          git worktree remove /tmp/ctgn-closeout
          git branch -D main

          git push origin HEAD:docs/governance-ssot-sync-05
