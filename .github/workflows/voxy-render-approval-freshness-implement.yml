name: Implement Voxy Render Approval Freshness

on:
  push:
    branches:
      - fix/voxy-render-approval-freshness-01
    paths:
      - .github/workflows/voxy-render-approval-freshness-implement.yml

permissions:
  contents: write

concurrency:
  group: voxy-render-approval-freshness-implementation
  cancel-in-progress: false

jobs:
  implement-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/voxy-render-approval-freshness-01

      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Assert exact authorized base
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "ddc9fbbc3df22606c0dddface154028354ace3c0"
          BASE=$(git merge-base HEAD origin/main)
          test "$BASE" = "ddc9fbbc3df22606c0dddface154028354ace3c0"

      - name: Apply bounded #976 repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
