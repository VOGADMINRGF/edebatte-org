          assert pos >= 0
          text = text[:pos] + insertion + text[pos:]
          test.write_text(text)

          ci = Path('.github/workflows/voxy-local-composition-runtime.yml')
          text = ci.read_text()
          old = '''      - "apps/web/src/features/voxyVideo/studioLayoutSafety.ts"\n      - "apps/web/src/features/voxyVideo/studioLocaleReviewMatrix.ts"'''
          new = '''      - "apps/web/src/features/voxyVideo/studioLayoutSafety.ts"\n      - "apps/web/src/features/voxyVideo/studioLocalCompositionFreshness.ts"\n      - "apps/web/src/features/voxyVideo/studioLocaleReviewMatrix.ts"'''
          assert text.count(old) == 1
          text = text.replace(old, new)
          old2 = '''      - "apps/web/tests/voxy-local-composition-runtime.contract.test.ts"\n      - "apps/web/tests/voxy-local-composition-review-bridge.contract.test.ts"'''
