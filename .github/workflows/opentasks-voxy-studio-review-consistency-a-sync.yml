name: One-shot Voxy Studio Review Consistency Slice A SSOT sync

on:
  push:
    branches:
      - docs/governance-ssot-sync-05
    paths:
      - .github/workflows/opentasks-voxy-studio-review-consistency-a-sync.yml

permissions:
  contents: write

concurrency:
  group: governance-ssot-writer
  cancel-in-progress: false

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/governance-ssot-sync-05
          fetch-depth: 0

      - name: Verify fresh canonical writer branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git branch --show-current)" = "docs/governance-ssot-sync-05"
          test "$(git rev-parse origin/main)" = "eec9f6e56b52936d3548268864d847411eb605a9"
          git merge-base --is-ancestor origin/main HEAD
          changed="$(git diff --name-only origin/main...HEAD)"
          test "$changed" = ".github/workflows/opentasks-voxy-studio-review-consistency-a-sync.yml"
          test "$(git rev-parse origin/main:docs/E150/OpenTasks.md)" = "3b29ed9501eb0c9ca8d1bbdc90076e50645a03a3"
          test "$(git rev-parse HEAD:docs/E150/OpenTasks.md)" = "3b29ed9501eb0c9ca8d1bbdc90076e50645a03a3"

      - name: Serialize only #977 Slice A
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from hashlib import sha256

          path = Path('docs/E150/OpenTasks.md')
          text = path.read_text(encoding='utf-8')
          operative_marker = '\n## Kanonischer Operativteil\n'
          historical_marker = '\n## Historischer Katalog und Evidenz\n'
          task_id = 'VOXY-STUDIO-REVIEW-CONSISTENCY-01'

          if text.count(operative_marker) != 1:
              raise SystemExit('operative_marker_not_unique')
          if text.count(historical_marker) != 1:
              raise SystemExit('historical_marker_not_unique')
          if text.index(operative_marker) > text.index(historical_marker):
              raise SystemExit('marker_order_invalid')

          head, historical = text.split(historical_marker, 1)
          if task_id in head:
              raise SystemExit('target_already_present_in_operative_region')

          required_status_fragments = [
              '| VOXY-EU24-MULTILINGUAL-EDITORIAL-01 | review |',
              '| VOXY-EDITORIAL-COUNCIL-FAIL-CLOSED-01 | review |',
              '| VOXY-RENDER-APPROVAL-FRESHNESS-01 | review |',
              '| YOUTUBE-SERVERLESS-SOURCE-RUNTIME-01 | manual_gate |',
              '| AI-SPECIALIST-ORCHESTRATION-COMPOSITION-01 | review |',
              '| VOXY-200PCT-VISUAL-QA-CHECKPOINT-01 | done |',
          ]
          for fragment in required_status_fragments:
              if head.count(fragment) != 1:
                  raise SystemExit(f'preserve_status_missing_or_nonunique:{fragment}')

          historical_blob = historical_marker + historical
          historical_hash_before = sha256(historical_blob.encode('utf-8')).hexdigest()

          block_lines = [
              '',
              '### #977 — Voxy Studio Review Consistency · Slice A',
              '',
              '| ID | Status | Priorität | Abhängigkeiten / Evidence | Scope / Ziel | Akzeptanz / Guardrails |',
              '| --- | --- | --- | --- | --- | --- |',
              '| VOXY-STUDIO-REVIEW-CONSISTENCY-01 | codex_ready | P1 | Issue `#977`; bestehende #570 Studio-/Draft-/Review-Architektur; #975/#976 abgeschlossen; Audit-Evidence auf aktuellem Main | **Slice A only:** bestehende Draft-CAS-Semantik gegen konkurrierende Review-Entscheidungen härten, indem `replaceDraftIfRevision()` zusätzlich den aktuell gelesenen Draft-Status als erwartete State-Predicate bindet; Mongo und In-Memory müssen dieselbe `{revision,status}`-CAS-Semantik haben; keine neue State-Version, Review-SSOT oder Draft-Persistenz | Zwei konkurrierende Operationen auf derselben `needs_review`-Revision: genau ein Commit gewinnt; Approval-vs-Changes in beiden Reihenfolgen, loser Commit fail-closed/stale-safe; normale Einzeloperation unverändert; Audit-/Revision-Bindings erhalten; fokussierte Contract-Tests + Typecheck/Lint/Build/`git diff --check`; **Slices B/C bleiben nicht autorisiert**; keine Provider-, Render-, Publish- oder Deployment-Side-Effects |',
          ]
          block = '\n' + '\n'.join(block_lines) + '\n'
          updated = head + block + historical_blob

          if updated.count(task_id) != 1:
              raise SystemExit('target_not_unique_after_insert')
          if updated.count('| VOXY-STUDIO-REVIEW-CONSISTENCY-01 | codex_ready | P1 |') != 1:
              raise SystemExit('target_codex_ready_row_missing')
          if '**Slice A only:**' not in updated:
              raise SystemExit('slice_a_scope_missing')
          if 'Slices B/C bleiben nicht autorisiert' not in updated:
              raise SystemExit('later_slice_guard_missing')

          for fragment in required_status_fragments:
              if updated.count(fragment) != 1:
                  raise SystemExit(f'preserve_status_changed:{fragment}')

          _, historical_after = updated.split(historical_marker, 1)
          historical_hash_after = sha256((historical_marker + historical_after).encode('utf-8')).hexdigest()
          if historical_hash_before != historical_hash_after:
              raise SystemExit('historical_tail_changed')

          path.write_text(updated, encoding='utf-8')
          print('historical_sha256', historical_hash_after)
          PY

      - name: Diff and self-removal guard
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git rm .github/workflows/opentasks-voxy-studio-review-consistency-a-sync.yml
          git add docs/E150/OpenTasks.md
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' '.github/workflows/opentasks-voxy-studio-review-consistency-a-sync.yml' 'docs/E150/OpenTasks.md' | sort)"
          test "$changed" = "$expected"
          test "$(git diff --cached --numstat -- docs/E150/OpenTasks.md | awk '{print $2}')" = "0"
          git diff --cached -- docs/E150/OpenTasks.md | grep -F '### #977 — Voxy Studio Review Consistency · Slice A'
          git diff --cached -- docs/E150/OpenTasks.md | grep -F '| VOXY-STUDIO-REVIEW-CONSISTENCY-01 | codex_ready | P1 |'
          if git diff --cached -- docs/E150/OpenTasks.md | grep -F -- '-## Historischer Katalog und Evidenz'; then
            echo 'historical_heading_removed'
            exit 1
          fi

      - name: Commit safe SSOT patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(e150): authorize #977 Slice A'
          git push origin HEAD:docs/governance-ssot-sync-05
