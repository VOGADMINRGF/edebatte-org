name: Voxy Freshness Preflight Diagnostic

on:
  push:
    branches:
      - docs/governance-ssot-sync-05
    paths:
      - .github/workflows/voxy-freshness-preflight-diagnostic.yml

permissions:
  contents: write

concurrency:
  group: governance-ssot-writer
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/governance-ssot-sync-05
      - name: Read target row and run exact-main preflight
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA=$(git rev-parse origin/main)
          echo "MAIN_SHA=$MAIN_SHA"
          git show origin/main:docs/E150/OpenTasks.md > /tmp/OpenTasks.md
          python3 - <<'PY'
          from pathlib import Path
          text=Path('/tmp/OpenTasks.md').read_text()
          op='## Kanonischer Operativteil'; hist='## Historischer Katalog und Evidenz'
          operative=text[text.index(op):text.index(hist)]
          target='VOXY-RENDER-APPROVAL-FRESHNESS-01'
          lines=[line for line in operative.splitlines() if target in line]
          assert len(lines)==1, lines
          print('TARGET_ROW=' + lines[0])
          PY
          git switch -C main origin/main
          node scripts/codex-task-preflight.mjs VOXY-RENDER-APPROVAL-FRESHNESS-01
      - name: Self-delete diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git switch docs/governance-ssot-sync-05
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/voxy-freshness-preflight-diagnostic.yml
          git commit -m 'ci(governance): remove #976 preflight diagnostic'
          git push origin HEAD:docs/governance-ssot-sync-05
