name: Newsletter send-time safety convergence

on:
  push:
    branches:
      - fix/newsletter-delivery-send-time-safety-01

permissions:
  contents: write

jobs:
  converge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/newsletter-delivery-send-time-safety-01
          fetch-depth: 0

      - name: Verify current-main task authorization
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          rm -rf /tmp/newsletter-preflight
          git worktree add --detach /tmp/newsletter-preflight origin/main
          cd /tmp/newsletter-preflight
          git switch -c main
          node scripts/codex-task-preflight.mjs NEWSLETTER-DELIVERY-SEND-TIME-SAFETY-01

      - name: Converge canonical newsletter send boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text()

          def write(path, text):
              Path(path).write_text(text)

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          runtime_path = "apps/web/src/features/newsletter/newsletterRuntime.ts"
          runtime = read(runtime_path)
          runtime = replace_once(
              runtime,
              'import { resolveNewsletterDeliveryPolicy } from "@features/notifications/newsletterDeliveryPolicy";\n',
              'import { resolveNewsletterDeliveryPolicy } from "@features/notifications/newsletterDeliveryPolicy";\nimport { newsletterFailureProvenBeforeExternalHandoff } from "@features/notifications/newsletterDeliveryLifecycle";\n',
              "runtime lifecycle import",
          )
          runtime = replace_once(
              runtime,
              '  status: "sending" | "sent" | "failed" | "skipped";\n  attemptCount: number;\n  messageId?: string | null;\n  failureCategory?: string | null;\n  retryable?: boolean | null;\n',
              '  status: "sending" | "sent" | "failed" | "skipped";\n  attemptCount: number;\n  messageId?: string | null;\n  failureCategory?: string | null;\n  retryable?: boolean | null;\n  externalAttemptBoundaryAt?: Date | null;\n  externalAttemptId?: string | null;\n',
              "runtime delivery doc fields",
          )
          runtime = replace_once(
              runtime,
              '''async function loadUserForSubscriber(subscriber: SubscriberDoc): Promise<UserDoc | null> {\n  const users = await getCol<UserDoc>("users");\n  const oid = toObjectId(subscriber.userId);\n  if (oid) {\n    const user = await users.findOne({ _id: oid });\n    if (user) return user;\n  }\n  return users.findOne({ email: subscriber.email });\n}\n''',
              '''async function loadUserForSubscriber(subscriber: SubscriberDoc): Promise<UserDoc | null> {\n  const users = await getCol<UserDoc>("users");\n  const oid = toObjectId(subscriber.userId);\n  if (oid) {\n    const user = await users.findOne({ _id: oid });\n    if (user) return user;\n  }\n  return users.findOne({ email: subscriber.email });\n}\n\nasync function reloadCanonicalSubscriberForSend(subscriber: SubscriberDoc): Promise<SubscriberDoc | null> {\n  const subscribers = await coreCol<SubscriberDoc>(SUBSCRIBERS_COLLECTION);\n  const email = subscriber.email.trim().toLowerCase();\n  if (subscriber.userId) {\n    const byUserId = await subscribers.findOne({ userId: subscriber.userId } as never);\n    if (byUserId) return byUserId;\n  }\n  return subscribers.findOne({ email } as never);\n}\n''',
              "runtime canonical reload helper",
          )
          runtime = replace_once(
              runtime,
              '''  const now = options.now ?? new Date();\n  const preview = await buildNewsletterDigestPreviewForSubscriber(subscriber, {\n    now,\n    candidates: options.candidates,\n  });\n''',
              '''  const now = options.now ?? new Date();\n  let currentSubscriber: SubscriberDoc | null;\n  try {\n    currentSubscriber = await reloadCanonicalSubscriberForSend(subscriber);\n  } catch {\n    return { ok: false as const, status: "blocked" as const, reason: "subscriber_state_unavailable" as const };\n  }\n  if (!currentSubscriber) {\n    return { ok: false as const, status: "blocked" as const, reason: "subscriber_not_found" as const };\n  }\n  const preview = await buildNewsletterDigestPreviewForSubscriber(currentSubscriber, {\n    now,\n    candidates: options.candidates,\n  });\n''',
              "runtime send-time canonical reload",
          )
          runtime = replace_once(
              runtime,
              '''  if (existing?.status === "sending" && now.getTime() - existing.updatedAt.getTime() < 15 * 60 * 1000) {\n    return { ok: true as const, status: "skipped" as const, reason: "delivery_in_progress", preview };\n  }\n''',
              runtime and '''  if (existing?.status === "sending") {\n    return { ok: true as const, status: "skipped" as const, reason: "ambiguous_previous_attempt", preview };\n  }\n''',
              "runtime stale sending replay block",
          )
          runtime = replace_once(
              runtime,
              '''      $set: { status: "sending", updatedAt: now },\n      $inc: { attemptCount: 1 },\n''',
              '''      $set: {\n        status: "sending",\n        retryable: false,\n        externalAttemptBoundaryAt: now,\n        externalAttemptId: crypto.randomUUID(),\n        updatedAt: now,\n      },\n      $unset: { failureCategory: "" },\n      $inc: { attemptCount: 1 },\n''',
              "runtime durable external boundary",
          )
          runtime = runtime.replace('userId: subscriber.userId ?? null,', 'userId: currentSubscriber.userId ?? null,', 1)
          runtime = runtime.replace('locale: String(subscriber.locale ?? "de")', 'locale: String(currentSubscriber.locale ?? "de")', 1)
          runtime = runtime.replace('recipientName: subscriber.name ?? null,', 'recipientName: currentSubscriber.name ?? null,', 1)
          runtime = runtime.replace('locale: subscriber.locale ?? "de",', 'locale: currentSubscriber.locale ?? "de",', 1)
          runtime = replace_once(
              runtime,
              '''  if (!result.ok) {\n    const failure = mailResultFailure(result)!;\n    await ledger.updateOne(\n      { _id: id },\n      {\n        $set: {\n          status: "failed",\n          failureCategory: failure.category,\n          retryable: failure.retryable,\n          messageId: result.messageId,\n          updatedAt: new Date(),\n        },\n      },\n    );\n    return { ok: false as const, status: "failed" as const, reason: result.category, preview, delivery: result };\n  }\n''',
              '''  if (!result.ok) {\n    const failure = mailResultFailure(result)!;\n    const provenPreHandoffFailure =\n      result.attemptedCount === 0 &&\n      result.deliveredCount === 0 &&\n      newsletterFailureProvenBeforeExternalHandoff(failure.category);\n    await ledger.updateOne(\n      { _id: id },\n      {\n        $set: {\n          status: "failed",\n          failureCategory: failure.category,\n          retryable: provenPreHandoffFailure && failure.retryable,\n          messageId: result.messageId,\n          updatedAt: new Date(),\n        },\n      },\n    );\n    return {\n      ok: false as const,\n      status: "failed" as const,\n      reason: provenPreHandoffFailure ? result.category : "ambiguous_delivery_state",\n      preview,\n      delivery: result,\n    };\n  }\n''',
              "runtime failure classification",
          )
          runtime = runtime.replace('...(subscriber.lastDigestKeys ?? [])', '...(currentSubscriber.lastDigestKeys ?? [])', 1)
          runtime = runtime.replace('...(subscriber.lastCandidateIds ?? [])', '...(currentSubscriber.lastCandidateIds ?? [])', 1)
          write(runtime_path, runtime)

          production_path = "apps/web/src/features/newsletter/newsletterProductionRuntime.ts"
          production = read(production_path)
          production = production.replace('  status: "attempting" | "sending" | "sent" | "failed" | "skipped";', '  status: "sending" | "sent" | "failed" | "skipped";', 1)
          production = re.sub(r'\nfunction recipientHash\(email: string\) \{\n  return digest\(email\.trim\(\)\.toLowerCase\(\)\)\.slice\(0, 32\);\n\}\n', '\n', production, count=1)
          production = production.replace('  if (existing.status === "attempting" || existing.status === "sending") {', '  if (existing.status === "sending") {', 1)
          production = replace_once(
              production,
              '''  const result = await ledger.deleteMany({\n    updatedAt: { $lt: cutoff },\n    $or: [\n      { status: { $in: ["sent", "skipped"] } },\n      { status: "failed", externalAttemptBoundaryAt: { $exists: false } },\n    ],\n  } as never);\n''',
              '''  const result = await ledger.deleteMany({\n    status: { $in: ["sent", "failed", "skipped"] },\n    updatedAt: { $lt: cutoff },\n  } as never);\n''',
              "production retention cleanup",
          )
          start = production.find('    const boundaryAt = new Date();')
          end_marker = '      return { ok: false as const, status: "blocked" as const, reason: "ambiguous_delivery_state" as const };\n    }'
          end = production.find(end_marker, start)
          if start == -1 or end == -1:
              raise SystemExit("production external-boundary block not found")
          end += len(end_marker)
          replacement = '''    try {\n      const result = await sendNewsletterDigestForSubscriber(freshSubscriber, { now, candidates });\n      if (result.status === "failed" && "delivery" in result) {\n        await maybeSuppressHardFailure(freshSubscriber, result.delivery.category);\n      }\n      return result;\n    } catch {\n      // The canonical sender persists the durable `sending` boundary before SMTP.\n      // Any exception here is therefore reconciled conservatively and never auto-replayed.\n      return { ok: false as const, status: "blocked" as const, reason: "ambiguous_delivery_state" as const };\n    }'''
          production = production[:start] + replacement + production[end:]
          production = production.replace('{ status: { $in: ["attempting", "sending"] } },', '{ status: "sending" },', 1)
          write(production_path, production)

          lifecycle_path = "features/notifications/newsletterDeliveryLifecycle.ts"
          lifecycle = read(lifecycle_path)
          # Existing helper is intentionally the single classification truth used by both runtime layers.
          if 'newsletterFailureProvenBeforeExternalHandoff' not in lifecycle:
              raise SystemExit('lifecycle classification helper missing')

          acceptance_path = "apps/web/tests/newsletter-n8-n9-acceptance.test.ts"
          acceptance = read(acceptance_path)
          anchor = '''  it("bounds retries and preserves a single canonical subscriber truth", () => {\n    expect(production).toContain('SUBSCRIBERS_COLLECTION = "public_updates_subscribers"');\n    expect(production).toContain("resolveNewsletterRetryDecision");\n    expect(production).toContain("NEWSLETTER_MAX_ATTEMPTS");\n    expect(production).toContain("cleanupNewsletterDeliveryLedger");\n    expect(production).not.toContain("users.newsletterOptIn");\n  });\n'''
          addition = anchor + '''\n  it("revalidates canonical consent under the lease and never auto-replays ambiguous handoff", () => {\n    expect(production).toContain("const lease = await acquireNewsletterDeliveryLease");\n    expect(production).toContain("freshSubscriber = await subscribers.findOne");\n    expect(production).toContain('reason: "subscriber_state_unavailable"');\n    expect(production).toContain('reason: "subscriber_state_changed"');\n    expect(runtime).toContain("reloadCanonicalSubscriberForSend");\n    expect(runtime).toContain("externalAttemptBoundaryAt: now");\n    expect(runtime).toContain("externalAttemptId: crypto.randomUUID()");\n    expect(runtime).toContain('existing?.status === "sending"');\n    expect(runtime).not.toContain('existing?.status === "sending" && now.getTime() - existing.updatedAt.getTime()');\n    expect(runtime).toContain("newsletterFailureProvenBeforeExternalHandoff");\n    expect(runtime).toContain('reason: provenPreHandoffFailure ? result.category : "ambiguous_delivery_state"');\n  });\n'''
          acceptance = replace_once(acceptance, anchor, addition, "newsletter N9 safety acceptance")
          write(acceptance_path, acceptance)
          PY

          rm -f .github/workflows/newsletter-send-time-safety-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/src/features/newsletter/newsletterRuntime.ts \
                  apps/web/src/features/newsletter/newsletterProductionRuntime.ts \
                  apps/web/tests/newsletter-n8-n9-acceptance.test.ts \
                  .github/workflows/newsletter-send-time-safety-once.yml
          git diff --cached --check
          git commit -m "fix(newsletter): centralize durable send boundary"
          git push origin HEAD:fix/newsletter-delivery-send-time-safety-01
