name: Voxy audit F2 recovery generation authorize v4

on:
  push:
    branches:
      - docs/voxy-audit-f2-recovery-generation-authorize-v4

permissions:
  contents: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact main and OpenTasks blob
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "438740daf95e5bbcc95605fe5bb5421405cfb7ae"
          test "$(git rev-parse origin/main:docs/E150/OpenTasks.md)" = "0ec14dcbb3b13f529fdf1c06dd83b152bd24cd5d"
          test "$(git merge-base HEAD origin/main)" = "438740daf95e5bbcc95605fe5bb5421405cfb7ae"
      - name: Authorize F2 losslessly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/E150/OpenTasks.md')
          text = p.read_text()
          old = '''| VOXY-LOCAL-COMPOSITION-RECOVERY-01 | review | P2 | Issue `#978`; `VOXY-LOCAL-COMPOSITION-RUNTIME-01` / #568 + PR #965; `VOXY-RENDER-APPROVAL-FRESHNESS-01` / #976 umgesetzt via PR #995 und operativ `review` | Bestehendes persistentes Local-Composition-Job-/Output-Modell um begrenzte Crash-Recovery härten: ausschließlich verwaiste `rendering`-Jobs kontrolliert claimen; bereits persistiertes `rendered`-Output vollständig gegen Job/Input-/Review-Bindings und Media-Hashes validieren und idempotent zu `review_ready` finalisieren; nur falls echte erneute Renderarbeit nötig ist, #976-Freshness unmittelbar vor Executor erneut anwenden | aktive Ownership verhindert zweite Ausführung; verwaiste Recovery höchstens einmal; valides vorhandenes Output => kein Doppelrender; stale Approval/Evidence/Gate => Executor Invocation Count `0`; bestehende Job-/Output-Identity, Attempt-/Audit- und Review-Bindings bleiben erhalten; keine neue Queue/Store/Renderer-SSOT, keine Reapproval, kein Auto-Publish |'''
          new = '''| VOXY-LOCAL-COMPOSITION-RECOVERY-01 | codex_ready | P2 | Issue `#978`; Work closeout audit F2 on `main@a4293c05cc6ff417609fe52540b8d68e1d048e33`; existing `VOXY-LOCAL-COMPOSITION-RUNTIME-01` / #568 + PR #965; prior recovery via #1006/#1007; F1 already closed via #1062 | **Audit repair F2 only — execution generation CAS:** bind every queued→rendering claim, recovery transition and rendering/rendered completion transition to the exact execution generation/attempt read by the caller, so a delayed orphan recovery or stale worker can never overwrite a newly acquired execution; apply the same generation guard in Mongo and in-memory repositories; preserve deterministic job/output identity and existing recovery/freshness authority | Deterministic interleaving must prove: Recovery A reads stale rendering attempt, Recovery B requeues and Worker B reacquires, then A cannot requeue; stale worker success/failure completion cannot mutate the newer attempt; Memory + Mongo-CAS coverage; existing real render/recovery gate, typecheck, diff guard; no second queue/store/renderer, no provider/upload/scheduling/social/auto-publish; F3/F4 not authorized |'''
          if text.count(old) != 1:
              raise SystemExit(f'expected exact old row once, got {text.count(old)}')
          text2 = text.replace(old, new, 1)
          if text2.count(new) != 1:
              raise SystemExit('new row not unique')
          p.write_text(text2)
          PY
          git diff --check
          test "$(git diff --name-only origin/main -- | wc -l | tr -d ' ')" = "1"
          test "$(git diff --name-only origin/main --)" = "docs/E150/OpenTasks.md"
          git diff --numstat origin/main -- docs/E150/OpenTasks.md | grep -Eq '^1[[:space:]]+1[[:space:]]+'
      - name: Commit authorization and self-delete writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/voxy-audit-f2-recovery-generation-authorize-v4.yml
          git add docs/E150/OpenTasks.md .github/workflows/voxy-audit-f2-recovery-generation-authorize-v4.yml
          git commit -m 'docs(e150): authorize Voxy recovery generation audit repair'
          git push origin HEAD
