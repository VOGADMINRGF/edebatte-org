name: Temporary close civic and authorize realtime voice

on:
  push:
    branches:
      - docs/voxy-realtime-voice-01-ssot

permissions:
  contents: write

jobs:
  serialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: docs/voxy-realtime-voice-01-ssot
      - name: Fail closed and mutate only intended OpenTasks rows
        shell: bash
        env:
          EXPECTED_MAIN: a4293c05cc6ff417609fe52540b8d68e1d048e33
          EXPECTED_OPENTASKS_BLOB: f2f56a38041be5e79dd5d883e04f24017c8d0ddf
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          observed_main="$(git rev-parse origin/main)"
          test "$observed_main" = "$EXPECTED_MAIN" || { echo "main_drift:$observed_main"; exit 41; }
          observed_blob="$(git rev-parse origin/main:docs/E150/OpenTasks.md)"
          test "$observed_blob" = "$EXPECTED_OPENTASKS_BLOB" || { echo "opentasks_blob_drift:$observed_blob"; exit 42; }
          python - <<'PY'
          from pathlib import Path
          import hashlib

          p = Path('docs/E150/OpenTasks.md')
          text = p.read_text(encoding='utf-8')
          marker = '## Historischer Katalog und Evidenz'
          if marker not in text:
              raise SystemExit('history_marker_missing')
          head, history = text.split(marker, 1)
          before_hash = hashlib.sha256(history.encode()).hexdigest()
          civic_id = 'VOXY-CIVIC-ACTIVITY-RELEVANCE-01'
          voice_id = 'VOXY-REALTIME-CONVERSATION-VOICE-01'
          lines = head.splitlines(keepends=True)
          civic_rows = [i for i, line in enumerate(lines) if line.startswith(f'| {civic_id} |')]
          voice_rows = [i for i, line in enumerate(lines) if line.startswith(f'| {voice_id} |')]
          if len(civic_rows) != 1:
              raise SystemExit(f'civic_row_count:{len(civic_rows)}')
          if voice_rows:
              raise SystemExit(f'voice_row_already_present:{len(voice_rows)}')
          idx = civic_rows[0]
          civic = lines[idx]
          if '| codex_ready | P0 |' not in civic:
              raise SystemExit('civic_status_not_codex_ready')
          civic = civic.replace('| codex_ready | P0 |', '| review | P0 |', 1)
          civic = civic.replace(
              'Issue `#1050`;',
              'Issue `#1050`; PR `#1053`; merge `a4293c05cc6ff417609fe52540b8d68e1d048e33`; Web CI `#3525` + Voxy canon lock `#361` green;',
              1,
          )
          lines[idx] = civic
          voice = "| VOXY-REALTIME-CONVERSATION-VOICE-01 | codex_ready | P0 | Issue `#1025`; `SHARED-CONVERSATION-CONTRACT-01`; `PERSONAL-VOXY-CONSENTED-MEMORY-RUNTIME-01` via PR `#1043`; `VOXY-TOOL-CAPABILITY-ADAPTERS-01` via PR `#1051`; existing Voxy Voice/Caption/Language owners; Alpha2 Risk/Tool/Run owners; Single-Writer `#447` | Providerneutralen Realtime-Session-/Turn-Vertrag als Ein-/Ausgabemodalitaet desselben Voxy auf Shared Conversation umsetzen: lifecycle, Mic-/Audio-Consent, interim/final transcript, barge-in/cancel/reconnect, text/caption fallback und sichere provenance; keine zweite Conversation-/Voice-/Orchestrator-SSOT | Start nur nach positivem taskbezogenen Preflight; erster Slice ausschließlich typed Contract + Tests, keine Provider-/Secret-/Production-Aktivierung; interim transcript darf keine Tool-/Side-Effect-Execution starten; nur finaler actor-/conversation-gebundener Turn darf Intent-Verarbeitung freigeben; Barge-in invalidiert stale Output/Action-Candidates; kein Raw-Audio-/Transcript-Dauerstore per Default, keine politische Profilierung/Persuasion/Vote-Aktion, kein Auto-Publish/externe Nachricht, keine Truth-/Evidence-Hochstufung |\n"
          lines.insert(idx + 1, voice)
          new_head = ''.join(lines)
          if len([line for line in new_head.splitlines() if line.startswith(f'| {civic_id} |')]) != 1:
              raise SystemExit('post_civic_row_count_invalid')
          if len([line for line in new_head.splitlines() if line.startswith(f'| {voice_id} |')]) != 1:
              raise SystemExit('post_voice_row_count_invalid')
          if hashlib.sha256(history.encode()).hexdigest() != before_hash:
              raise SystemExit('historical_tail_changed')
          p.write_text(new_head + marker + history, encoding='utf-8')
          PY
          git diff --check
          changed_files="$(git diff --name-only)"
          test "$changed_files" = "docs/E150/OpenTasks.md" || { echo "$changed_files"; exit 43; }
          grep -q '^| VOXY-CIVIC-ACTIVITY-RELEVANCE-01 | review | P0 |' docs/E150/OpenTasks.md
          grep -q '^| VOXY-REALTIME-CONVERSATION-VOICE-01 | codex_ready | P0 |' docs/E150/OpenTasks.md
          rm .github/workflows/tmp-close-civic-authorize-realtime-voice.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/E150/OpenTasks.md .github/workflows/tmp-close-civic-authorize-realtime-voice.yml
          git commit -m "docs(e150): close civic relevance and authorize realtime voice"
          git push origin HEAD:docs/voxy-realtime-voice-01-ssot
