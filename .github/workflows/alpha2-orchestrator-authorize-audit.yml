name: Alpha2 orchestrator authorize writer

on:
  push:
    branches: [ docs/alpha2-orchestrator-authorize-01 ]

permissions:
  contents: write

jobs:
  single-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/alpha2-orchestrator-authorize-01
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Apply exact guarded OpenTasks transition
        env:
          EXPECTED_MAIN: 362a1e4f7f55badd939dbde4684d0d95c0d75711
          EXPECTED_BLOB: 881a8e841821291207ebd1fa3a5360ee075d890d
          TASK_ID: ALPHA2-ORCHESTRATOR-LOOP-01
          HISTORICAL_TAIL_SHA256: 27b444dbc3d2d01e8d2c5f0a1426a0842abfdbc8fa08bd2f97d39c248e51a399
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD:docs/E150/OpenTasks.md)" = "$EXPECTED_BLOB"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, re

          path = Path('docs/E150/OpenTasks.md')
          text = path.read_text()
          task = os.environ['TASK_ID']
          row_re = re.compile(rf'^\| {re.escape(task)} \| blocked \| P0 \|.*$', re.MULTILINE)
          matches = list(row_re.finditer(text))
          if len(matches) != 1:
              raise SystemExit(f'expected exactly one blocked P0 operative row, found {len(matches)}')
          match = matches[0]

          marker_re = re.compile(r'^##\s+.*(?:Histor|Archiv).*$' , re.MULTILINE | re.IGNORECASE)
          tail_match = marker_re.search(text, match.end())
          if not tail_match:
              raise SystemExit('historical tail marker not found')
          tail_before = text[tail_match.start():]
          expected_hash = os.environ['HISTORICAL_TAIL_SHA256']
          if hashlib.sha256(tail_before.encode()).hexdigest() != expected_hash:
              raise SystemExit('historical tail hash mismatch before mutation')

          old_row = match.group(0)
          new_row = old_row.replace('| blocked |', '| codex_ready |', 1)
          updated = text[:match.start()] + new_row + text[match.end():]
          updated_tail_match = marker_re.search(updated, match.start() + len(new_row))
          if not updated_tail_match:
              raise SystemExit('historical tail marker disappeared after mutation')
          tail_after = updated[updated_tail_match.start():]
          if tail_after != tail_before:
              raise SystemExit('historical tail bytes changed')
          if hashlib.sha256(tail_after.encode()).hexdigest() != expected_hash:
              raise SystemExit('historical tail hash mismatch after mutation')
          path.write_text(updated)
          PY
          git diff --check
          test "$(git diff --name-only)" = "docs/E150/OpenTasks.md"

      - name: Commit and prove task preflight
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/E150/OpenTasks.md
          git commit -m "docs(e150): authorize Alpha2 orchestrator loop"
          node scripts/codex-task-preflight.mjs ALPHA2-ORCHESTRATOR-LOOP-01 | tee /tmp/preflight.json
          node - <<'NODE'
          const fs = require('fs');
          const result = JSON.parse(fs.readFileSync('/tmp/preflight.json','utf8'));
          if (result.status !== 'codex_ready' || result.executable !== true || result.branchCreationAllowed !== true) {
            throw new Error(`unexpected orchestrator preflight: ${JSON.stringify(result)}`);
          }
          NODE

      - name: Self-delete writer and push final candidate
        run: |
          set -euo pipefail
          git rm .github/workflows/alpha2-orchestrator-authorize-audit.yml
          git commit -m "chore(alpha2): remove orchestrator one-shot writer"
          test "$(git diff --name-only origin/main...HEAD)" = "docs/E150/OpenTasks.md"
          git diff --check origin/main...HEAD
          git push origin HEAD:docs/alpha2-orchestrator-authorize-01
