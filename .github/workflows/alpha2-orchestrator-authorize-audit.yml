name: Alpha2 orchestrator authorize audit

on:
  push:
    branches: [ docs/alpha2-orchestrator-authorize-01 ]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Audit exact main and task row
        env:
          EXPECTED_MAIN: 362a1e4f7f55badd939dbde4684d0d95c0d75711
          EXPECTED_BLOB: 881a8e841821291207ebd1fa3a5360ee075d890d
          TASK_ID: ALPHA2-ORCHESTRATOR-LOOP-01
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD:docs/E150/OpenTasks.md)" = "$EXPECTED_BLOB"
          node <<'NODE'
          const fs = require('fs');
          const crypto = require('crypto');
          const task = process.env.TASK_ID;
          const text = fs.readFileSync('docs/E150/OpenTasks.md','utf8');
          const lines = text.split(/\r?\n/);
          const hits = [];
          for (let i=0;i<lines.length;i++) if (lines[i].includes(task)) hits.push(i);
          console.log(JSON.stringify({task, lineCount: lines.length, hits: hits.map(i => ({line:i+1,text:lines[i],before:lines[i-1]||'',after:lines[i+1]||''}))}, null, 2));
          if (!hits.length) process.exit(41);
          const first = hits[0];
          if (!/\|/.test(lines[first]) || !/blocked/.test(lines[first])) process.exit(42);
          const tailStart = lines.findIndex((l,i) => i>first && /^##\s+/.test(l) && /histor|archiv/i.test(l));
          console.log(JSON.stringify({firstOperativeCandidate:first+1, historicalTailStart:tailStart >= 0 ? tailStart+1 : null, historicalTailSha256:tailStart >= 0 ? crypto.createHash('sha256').update(lines.slice(tailStart).join('\n')).digest('hex') : null}, null, 2));
          NODE
          node scripts/codex-task-preflight.mjs "$TASK_ID" || true
