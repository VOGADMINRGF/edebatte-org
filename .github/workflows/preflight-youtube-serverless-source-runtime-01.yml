name: One-shot #644 task preflight

on:
  push:
    branches:
      - chore/youtube-serverless-source-runtime-01-preflight-20260923
    paths:
      - .github/workflows/preflight-youtube-serverless-source-runtime-01.yml

permissions:
  contents: write

jobs:
  preflight:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/youtube-serverless-source-runtime-01-preflight-20260923
          fetch-depth: 0

      - name: Run task preflight on exact current main
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "3dd345b53fde4e8979d20e9e865ccad320fee460"
          git checkout -B main origin/main
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          node scripts/codex-task-preflight.mjs YOUTUBE-SERVERLESS-SOURCE-RUNTIME-01 | tee /tmp/preflight.json
          grep -F '"status": "codex_ready"' /tmp/preflight.json
          grep -F '"executable": true' /tmp/preflight.json
          grep -F '"branchCreationAllowed": true' /tmp/preflight.json

      - name: Remove temporary workflow
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git checkout chore/youtube-serverless-source-runtime-01-preflight-20260923
          git rm .github/workflows/preflight-youtube-serverless-source-runtime-01.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(governance): remove one-shot #644 preflight workflow'
          git push origin HEAD:chore/youtube-serverless-source-runtime-01-preflight-20260923
