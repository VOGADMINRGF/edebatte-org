name: Alpha2 GitHub close and writer authorize

on:
  push:
    branches:
      - docs/alpha2-github-close-writer-authorize-01

permissions:
  contents: write

jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/alpha2-github-close-writer-authorize-01
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Fail-closed reconcile
        env:
          EXPECTED_MAIN: 3a7441533823b32af627bd03b6b05d751572d85a
          EXPECTED_OPENTASKS_BLOB: a99127571cee563d991d22e3f9cd4c149fd8baac
        run: |
          set -euo pipefail
          git fetch origin main
          observed_main="$(git rev-parse origin/main)"
          test "$observed_main" = "$EXPECTED_MAIN" || { echo "main_drift:$observed_main"; exit 41; }
          observed_blob="$(git rev-parse origin/main:docs/E150/OpenTasks.md)"
          test "$observed_blob" = "$EXPECTED_OPENTASKS_BLOB" || { echo "opentasks_blob_drift:$observed_blob"; exit 42; }
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/E150/OpenTasks.md')
          text = p.read_text()
          lines = text.splitlines(keepends=True)
          a_old = '| ALPHA2-GITHUB-STATE-ADAPTER-01 | codex_ready | P0 |'
          a_new = '| ALPHA2-GITHUB-STATE-ADAPTER-01 | review | P0 |'
          w_old = '| ALPHA2-OPENTASKS-SINGLE-WRITER-01 | blocked | P0 |'
          w_new = '| ALPHA2-OPENTASKS-SINGLE-WRITER-01 | codex_ready | P0 |'
          a_idx = [i for i,l in enumerate(lines) if l.startswith(a_old)]
          w_idx = [i for i,l in enumerate(lines) if l.startswith(w_old)]
          if len(a_idx) != 1:
              raise SystemExit(f'github_adapter_row_count:{len(a_idx)}')
          if len(w_idx) != 1:
              raise SystemExit(f'writer_row_count:{len(w_idx)}')
          lines[a_idx[0]] = lines[a_idx[0]].replace(a_old, a_new, 1)
          lines[w_idx[0]] = lines[w_idx[0]].replace(w_old, w_new, 1)
          p.write_text(''.join(lines))
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 1
          test "$(git diff --name-only)" = "docs/E150/OpenTasks.md"
          stats="$(git diff --numstat -- docs/E150/OpenTasks.md)"
          test "$stats" = $'2\t2\tdocs/E150/OpenTasks.md' || { echo "unexpected_diff:$stats"; exit 43; }
          grep -Fq '| ALPHA2-GITHUB-STATE-ADAPTER-01 | review | P0 |' docs/E150/OpenTasks.md
          grep -Fq '| ALPHA2-OPENTASKS-SINGLE-WRITER-01 | codex_ready | P0 |' docs/E150/OpenTasks.md
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/E150/OpenTasks.md
          git commit -m 'docs(alpha2): close GitHub adapter and authorize single writer'
          git push origin HEAD:docs/alpha2-github-close-writer-authorize-01
          git rm .github/workflows/alpha2-github-close-writer-authorize.yml
          git commit -m 'chore(alpha2): remove one-shot writer'
          git push origin HEAD:docs/alpha2-github-close-writer-authorize-01
