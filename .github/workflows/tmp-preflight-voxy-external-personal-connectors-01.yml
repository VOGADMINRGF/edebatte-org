name: Temporary Voxy external personal connectors preflight
on:
  push:
    branches:
      - chore/preflight-voxy-external-personal-connectors-01
permissions:
  contents: read
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main
      - name: Verify exact main and run canonical task preflight
        env:
          EXPECTED_MAIN: 8ccf47ef4c8d9ff52ae3e379ab463111ab4fd617
        run: |
          set -euo pipefail
          observed="$(git rev-parse HEAD)"
          test "$observed" = "$EXPECTED_MAIN" || { echo "main_drift:$observed"; exit 41; }
          node scripts/codex-task-preflight.mjs VOXY-EXTERNAL-PERSONAL-CONNECTORS-01
