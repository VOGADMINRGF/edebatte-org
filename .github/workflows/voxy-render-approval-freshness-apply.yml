name: Apply Voxy Render Approval Freshness

on:
  push:
    branches:
      - fix/voxy-render-approval-freshness-01
    paths:
      - .github/workflows/voxy-render-approval-freshness-apply.yml

permissions:
  contents: write

concurrency:
  group: voxy-render-approval-freshness-implementation
  cancel-in-progress: false

jobs:
  apply-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: fix/voxy-render-approval-freshness-01
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Assert current authorized base and clean product scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "616ebdc21cd9187a8b1f45410f38a7cd8acdf59f"
          test "$(git merge-base HEAD origin/main)" = "616ebdc21cd9187a8b1f45410f38a7cd8acdf59f"
          git diff --quiet origin/main -- apps/web/src apps/web/scripts apps/web/tests
      - name: Apply bounded repair
        run: python3 .github/voxy-freshness-apply.py
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Focused freshness and existing runtime contracts
        run: >-
          pnpm -C apps/web exec vitest run
          tests/voxy-local-composition-freshness.contract.test.ts
          tests/voxy-local-composition-runtime.contract.test.ts
      - name: Typecheck and diff guard
        run: |
          pnpm -C apps/web run typecheck
          git diff --check
      - name: Commit only verified product and test files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            apps/web/scripts/run-voxy-local-composition-worker.ts \
            apps/web/src/features/voxyVideo/localCompositionRuntimeService.ts \
            apps/web/src/features/voxyVideo/studioLocalCompositionFreshness.ts \
            apps/web/tests/voxy-local-composition-runtime.contract.test.ts \
            apps/web/tests/voxy-local-composition-freshness.contract.test.ts
          git diff --cached --check
          git commit -m 'fix(voxy): revalidate render approval at worker start'
          git push origin HEAD:fix/voxy-render-approval-freshness-01
