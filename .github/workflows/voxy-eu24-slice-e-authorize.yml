name: Voxy EU24 Slice E authorize

on:
  push:
    branches:
      - docs/voxy-eu24-slice-e-authorization
    paths:
      - .github/workflows/voxy-eu24-slice-e-authorize.yml

permissions:
  contents: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/voxy-eu24-slice-e-authorization
          fetch-depth: 0
      - name: Replace exactly the Slice D authorization row
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('docs/E150/OpenTasks.md')
          text = p.read_text()
          old = '''| VOXY-EU24-MULTILINGUAL-EDITORIAL-01 | codex_ready | P0 | `ECOSYSTEM-I18N-CONTRACT-01` / #566; Voxy #310/#567/#568; #570 via #967; Intake #969; Slices A–C abgeschlossen, Slice C via #1030 / Merge `864366d7cc06410c0f6f601fe4f05e72e382341e` | **Slice D only — Voice/Caption EU-24 Readiness:** bestehenden Locale-/`voiceLocaleMatrix`-/Story-Plan-/Language-Variant-/Voice-/Caption-/#568-Local-Composition-Stack für alle 24 EU-Amtssprachen plus bestehende Zusatzlocales readiness-seitig schließen; pro Output-Locale nur explizit freigegebenes `voiceProfileId`, kein stiller Locale-/Voice-Fallback; fehlende geeignete Stimme bleibt sichtbar `voice_unavailable` und render-blockierend, während Text-/Caption-Arbeit fortgesetzt werden darf; Voice, Caption-Timeline, Language Variant und Story Plan müssen dieselbe Target-Locale und Revision tragen; Translation-Revision-Drift invalidiert Audio-/Caption-/Renderbindung; Caption-/Layout-/Unicode-/Timing-Contracts decken insbesondere `bg/da/et/ga/hr/hu/lv/lt/mt/sk/sl`, vorhandenes `ar`/RTL, lange europäische Texte, diakritische/griechische/kyrillische Zeichen sowie `16:9`, `9:16`, `1:1` ab | Keine Provider-Aktivierung oder Auswahl neuer TTS-/Translation-Provider; kein neuer Voice-/Caption-/Render-/Translation-Store; kein Fallback; fehlende Voice darf niemals still grün werden; Final Canon und bestehende Review-/Evidence-Wahrheit bleiben unverändert; fokussierte Readiness-/No-Fallback-/Staleness-/Caption-/Layout-/Unicode-/Timing-Contracts + bestehender Voxy Runtime/Final-Canon/Visual-QA/Web-CI + Typecheck/Lint/Build/`git diff --check`; **Slice E bleibt nicht autorisiert** |'''
          new = '''| VOXY-EU24-MULTILINGUAL-EDITORIAL-01 | codex_ready | P0 | `ECOSYSTEM-I18N-CONTRACT-01` / #566; Voxy #310/#567/#568; #570 via #967; Intake #969; Slices A–D abgeschlossen, Slice D via #1039 / Merge `e683a746236a5a53dea182511f7b862b39bf2905` | **Slice E only — Multilingual Editorial E2E:** auf den bestehenden Dossier-/Evidence-/Story-Plan-/Language-Variant-/Semantic-Guard-/Voice-/Caption-/#568-Local-Composition-/Preview-Review-Verträgen mehrere echte Cross-Language-Ketten revisionsgebunden nachweisen; mindestens Ketten der Form `Quelle PL → Dossier DE → Video FR`, `Quelle ET + EN + DE → gemeinsames Dossier → Video IT` und `Master DE → geprüfte Variante BG → Voice/Captions → 9:16 / 16:9 / 1:1`; Claims/Sources/Findings/Evidence/Open-Question-IDs bleiben über alle Sprachfassungen identisch referenziert, nur zulässige Darstellungsfelder variieren; Master-/Evidence-/Translation-Drift muss bestehende Sprach-/Voice-/Caption-/Renderfreigaben fail-closed stale machen | Kein neuer i18n-/Translation-/Story-/Evidence-/Review-/Voice-/Caption-/Render-/Media-Store; kein neuer Renderer und keine Provider-Aktivierung; Übersetzung bleibt Lesefassung und keine Evidence; `uncertain`/`needs_review`/`voice_unavailable`/stale Bindings bleiben render-/publish-blockierend; dieselbe Final-Canon-/Review-Wahrheit für alle Locales; fokussierte mehrsprachige E2E-Contracts + bestehender Voice-Caption-/Voxy Runtime/Final-Canon/Visual-QA/Web-CI + Typecheck/Lint/Build/`git diff --check`; keine externe Veröffentlichung, kein Upload, Scheduling oder Auto-Publish |'''
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one Slice D row, got {count}')
          p.write_text(text.replace(old, new, 1))
          PY
          test "$(git diff --name-only)" = "docs/E150/OpenTasks.md"
          git diff --check
      - name: Commit the single-writer delta
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/E150/OpenTasks.md
          test "$(git diff --cached --name-only)" = "docs/E150/OpenTasks.md"
          git commit -m "docs(e150): authorize Voxy EU24 Slice E"
          git push origin HEAD:docs/voxy-eu24-slice-e-authorization
