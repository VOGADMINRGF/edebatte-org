name: Voxy EU24 Slice B Preflight

on:
  push:
    branches:
      - docs/voxy-eu24-slice-b-preflight-01

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
      - name: Verify exact main and run task preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "56b9ef51b84b65048deb5665235b932a865c48ce"
          test "$(git branch --show-current)" = "main"
          test -z "$(git status --porcelain)"
          node scripts/codex-task-preflight.mjs VOXY-EU24-MULTILINGUAL-EDITORIAL-01 | tee /tmp/preflight.txt
          grep -F '"status": "codex_ready"' /tmp/preflight.txt
          grep -F '"executable": true' /tmp/preflight.txt
          grep -F '"branchCreationAllowed": true' /tmp/preflight.txt
