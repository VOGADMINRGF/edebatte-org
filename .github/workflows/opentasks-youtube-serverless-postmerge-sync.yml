name: One-shot #644 post-merge SSOT sync

on:
  push:
    branches:
      - docs/governance-ssot-sync-05
    paths:
      - .github/workflows/opentasks-youtube-serverless-postmerge-sync.yml

permissions:
  contents: read

concurrency:
  group: governance-ssot-writer
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/governance-ssot-sync-05
          fetch-depth: 0

      - name: Guard exact main and source blob
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "f7b50407f338ffdaf4dccdb72df24024d4b2e080"
          test "$(git merge-base HEAD origin/main)" = "$(git rev-parse origin/main)"
          test "$(git rev-parse HEAD:docs/E150/OpenTasks.md)" = "dc4db45602b9cad9a72d5ce503fea5d641ce69fb"
          test "$(git rev-parse origin/main:docs/E150/OpenTasks.md)" = "dc4db45602b9cad9a72d5ce503fea5d641ce69fb"

      - name: Diagnose current tail and preserve truths without writing
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import hashlib

          text = Path('docs/E150/OpenTasks.md').read_text(encoding='utf-8')
          operative_marker = '## Kanonischer Operativteil'
          history_marker = '## Historischer Katalog und Evidenz'
          task_id = 'YOUTUBE-SERVERLESS-SOURCE-RUNTIME-01'
          old = '| YOUTUBE-SERVERLESS-SOURCE-RUNTIME-01 | codex_ready | preflight_only | #644 | P0 Media-/YouTube-Acquisition-Owner; erster Produkt-Slice nur `MediaSourceArtifact` + sichere Failure Taxonomy + credential-freie Fixtures; `sourceLoaded=true` nur mit realer Segment-/Timestamp-Evidence; keine Provider-/Secret-Aktivierung, kein zweiter Media-/Create-Store, keine #629-Komposition, kein Auto-Publish/Production-Write. |'

          assert text.count(operative_marker) == 1
          assert text.count(history_marker) == 1
          op_pos = text.index(operative_marker)
          hist_pos = text.index(history_marker)
          assert op_pos < hist_pos
          operative = text[op_pos:hist_pos]
          tail = text[hist_pos:]

          print('ACTUAL_HISTORICAL_TAIL_SHA=' + hashlib.sha256(tail.encode()).hexdigest())
          print('OPERATIVE_TARGET_COUNT=' + str(operative.count(task_id)))
          print('EXACT_OLD_ROW_COUNT=' + str(operative.count(old)))

          preserve = (
              'CROSS-LINGUAL-MEDIA-EVENT-RESEARCH-INTAKE-01',
              'GLOBAL-TOPIC-INTELLIGENCE-VERIFICATION-ORCHESTRATION-01',
              'PROVENANCE-EVIDENCE-LINEAGE-CROSS-LINGUAL-TOPIC-GRAPH-01',
              'VOXY-EU24-MULTILINGUAL-EDITORIAL-01',
              'VOXY-200PCT-VISUAL-QA-CHECKPOINT-01',
          )
          for task in preserve:
              lines = [line for line in operative.splitlines() if task in line]
              print(f'PRESERVE_{task}=' + str(len(lines)))
              for line in lines:
                  print('PRESERVE_LINE=' + line)

          assert operative.count(task_id) == 1
          assert operative.count(old) == 1
          for task in preserve:
              assert operative.count(task) >= 1
          visual_line = next(line for line in operative.splitlines() if 'VOXY-200PCT-VISUAL-QA-CHECKPOINT-01' in line)
          assert 'done' in visual_line
          PY

      - name: Prove diagnostic did not mutate repository
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
