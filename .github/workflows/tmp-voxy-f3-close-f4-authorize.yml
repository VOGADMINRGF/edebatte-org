name: Temporary Voxy F3 close F4 authorize

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  single-writer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/voxy-f3-close-f4-authorize-01
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify exact main and OpenTasks blob
        env:
          EXPECTED_MAIN: a55ee8f04d45e67ce8074dc0093b54e1891d43a4
          EXPECTED_BLOB: 0d1c67966f76269bc00e85434ff639ddea8af3a7
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_MAIN"
          test "$(git rev-parse HEAD:docs/E150/OpenTasks.md)" = "$EXPECTED_BLOB"

      - name: Apply exact guarded SSOT transition
        run: |
          set -euo pipefail
          python3 scripts/tmp-voxy-f3-close-f4-authorize.py
          git diff --check
          test "$(git diff --name-only)" = "docs/E150/OpenTasks.md"

      - name: Commit and validate preflights
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/E150/OpenTasks.md
          git commit -m "docs(e150): close Voxy F3 and authorize F4"

          git branch -f main HEAD
          git switch main

          set +e
          node scripts/codex-task-preflight.mjs VOXY-EU24-MULTILINGUAL-EDITORIAL-01 >/tmp/f3.json 2>&1
          f3_code=$?
          set -e
          test "$f3_code" -eq 1
          node scripts/codex-task-preflight.mjs VOXY-STUDIO-REVIEW-CONSISTENCY-01 >/tmp/f4.json
          cat /tmp/f3.json
          cat /tmp/f4.json
          node - <<'NODE'
          const fs = require('fs');
          const f3 = JSON.parse(fs.readFileSync('/tmp/f3.json', 'utf8'));
          const f4 = JSON.parse(fs.readFileSync('/tmp/f4.json', 'utf8'));
          if (f3.status !== 'review' || f3.executable !== false || f3.reason !== 'task_status_not_executable:review') {
            throw new Error('F3 authorization was not consumed fail-closed');
          }
          if (f4.status !== 'codex_ready' || f4.executable !== true || f4.branchCreationAllowed !== true) {
            throw new Error('F4 task did not become executable on candidate tree');
          }
          NODE

      - name: Self-delete writer and push final candidate
        run: |
          set -euo pipefail
          git rm .github/workflows/tmp-voxy-f3-close-f4-authorize.yml scripts/tmp-voxy-f3-close-f4-authorize.py
          git commit -m "chore(governance): remove one-shot Voxy F4 writer"
          test "$(git diff --name-only origin/main...HEAD)" = "docs/E150/OpenTasks.md"
          git diff --check origin/main...HEAD
          git push origin HEAD:docs/voxy-f3-close-f4-authorize-01
