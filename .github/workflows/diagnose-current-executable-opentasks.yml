name: Diagnose current executable OpenTasks

on:
  push:
    branches:
      - chore/opentasks-current-executable-diagnose-20260924

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/opentasks-current-executable-diagnose-20260924
          fetch-depth: 0

      - name: List operative codex-ready rows
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "9b01fc00b3a4adeaf452a67501d31b97dd091c40"
          git checkout -B main origin/main
          test "$(git rev-parse 'HEAD:docs/E150/OpenTasks.md')" = "42031e2418a4e3255e9a9d0f72646f886c49c0fd"
          python3 - <<'PY'
          from pathlib import Path
          text = Path('docs/E150/OpenTasks.md').read_text(encoding='utf-8')
          start_marker = '## Kanonischer Operativteil'
          end_marker = '## Historischer Katalog und Evidenz'
          assert text.count(start_marker) == 1
          assert text.count(end_marker) == 1
          start = text.index(start_marker)
          end = text.index(end_marker)
          assert start < end
          operative = text[start:end]
          rows = [line for line in operative.splitlines() if line.startswith('| ') and '| codex_ready |' in line]
          print(f'CODEX_READY_COUNT={len(rows)}')
          for i, row in enumerate(rows, 1):
              print(f'CODEX_READY_{i}={row}')
          PY

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git checkout chore/opentasks-current-executable-diagnose-20260924
          git rm .github/workflows/diagnose-current-executable-opentasks.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(governance): remove executable OpenTasks diagnostic'
          git push origin HEAD:chore/opentasks-current-executable-diagnose-20260924
