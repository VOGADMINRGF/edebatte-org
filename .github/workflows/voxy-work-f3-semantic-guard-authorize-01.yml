name: Voxy Work F3 semantic guard authorize

on:
  push:
    branches:
      - docs/voxy-work-f3-semantic-guard-authorize-01

permissions:
  contents: write

jobs:
  authorize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact main and OpenTasks blob
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          test "$(git rev-parse origin/main)" = "3a7441533823b32af627bd03b6b05d751572d85a"
          test "$(git rev-parse origin/main:docs/E150/OpenTasks.md)" = "a99127571cee563d991d22e3f9cd4c149fd8baac"
          test "$(git merge-base HEAD origin/main)" = "3a7441533823b32af627bd03b6b05d751572d85a"
      - name: Close F2 and authorize F3 losslessly
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/E150/OpenTasks.md')
          lines = p.read_text().splitlines()

          def find_row(task):
              hits = [(i, line) for i, line in enumerate(lines) if line.startswith(f'| {task} |')]
              if len(hits) != 1:
                  raise SystemExit(f'{task}: expected one row, got {len(hits)}')
              return hits[0]

          i978, r978 = find_row('VOXY-LOCAL-COMPOSITION-RECOVERY-01')
          if '| codex_ready | P2 |' not in r978 or 'Audit repair F2 only' not in r978:
              raise SystemExit('F2 row no longer matches expected executable audit-repair state')
          r978 = r978.replace('| codex_ready | P2 |', '| review | P2 |', 1)
          if '#1074' not in r978:
              parts = r978.split('|')
              parts[4] = parts[4].rstrip() + '; F2 implemented via PR #1074 / merge `97f9b5c6ca2f1d93cda32014015c3ddb5d99e57c` '
              r978 = '|'.join(parts)
          lines[i978] = r978

          i969, r969 = find_row('VOXY-EU24-MULTILINGUAL-EDITORIAL-01')
          if '| codex_ready |' not in r969:
              raise SystemExit('F3 owner is not in expected executable state')
          if 'F1' not in r969 and '#1062' not in r969:
              raise SystemExit('F3 owner row does not carry prior F1 audit context')
          lines[i969] = (
              '| VOXY-EU24-MULTILINGUAL-EDITORIAL-01 | codex_ready | P2 | '
              'Issue `#969`; EU24 Slices A–E previously completed; Work closeout audit F3 on `main@a4293c05cc6ff417609fe52540b8d68e1d048e33`; '
              'F1 closed via PR #1062; F2 closed separately via PR #1074 | '
              '**Audit repair F3 only — locale-aware numeric semantic guard:** preserve numeric magnitude and decimal/grouping semantics instead of stripping all non-digits; '
              'detect material number drift such as `1,5 km -> 15 km`; treat locale-ambiguous numeric forms fail-closed/review-required; reuse the existing Semantic Translation Guard / Language Variant binding and existing Evidence identity model | '
              '`1,5 -> 15` and equivalent percent/currency/unit regressions must trigger review; genuinely equivalent locale decimal/grouping forms remain accepted only when unambiguous; '
              'approved translation must be downgraded to review-required on numeric semantic drift; existing multilingual E2E + Web typecheck + Voxy runtime/canon gates green; '
              'no second translation engine/store/provider/evidence truth; F4 not authorized |'
          )

          p.write_text('\n'.join(lines) + '\n')
          PY
          git diff --check
          python - <<'PY'
          from pathlib import Path
          text = Path('docs/E150/OpenTasks.md').read_text()
          assert text.count('| VOXY-LOCAL-COMPOSITION-RECOVERY-01 | review | P2 |') == 1
          assert text.count('| VOXY-EU24-MULTILINGUAL-EDITORIAL-01 | codex_ready | P2 |') == 1
          assert '**Audit repair F3 only — locale-aware numeric semantic guard:**' in text
          PY
          changed="$(git diff --name-only origin/main -- | sort)"
          printf '%s\n' "$changed"
          test "$changed" = $'.github/workflows/voxy-work-f3-semantic-guard-authorize-01.yml\ndocs/E150/OpenTasks.md'
          git diff --numstat origin/main -- docs/E150/OpenTasks.md | grep -Eq '^2[[:space:]]+2[[:space:]]+'
      - name: Commit authorization and self-delete writer
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm .github/workflows/voxy-work-f3-semantic-guard-authorize-01.yml
          git add docs/E150/OpenTasks.md .github/workflows/voxy-work-f3-semantic-guard-authorize-01.yml
          git commit -m 'docs(e150): close Voxy F2 and authorize Work F3'
          git push origin HEAD
