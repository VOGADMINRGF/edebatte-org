name: OpenTasks Observability Inventory Diagnostic

on:
  push:
    branches:
      - docs/governance-ssot-sync-05
    paths:
      - .github/workflows/opentasks-observability-inventory-diagnostic.yml

permissions:
  contents: write

concurrency:
  group: governance-ssot-writer
  cancel-in-progress: false

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/governance-ssot-sync-05
          fetch-depth: 0
      - name: Inspect current main task row and preflight
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          MAIN_SHA="$(git rev-parse origin/main)"
          echo "MAIN_SHA=${MAIN_SHA}"
          git show origin/main:docs/E150/OpenTasks.md > /tmp/OpenTasks.md
          python - <<'PY'
          from pathlib import Path
          text = Path('/tmp/OpenTasks.md').read_text()
          start = text.index('## Kanonischer Operativteil')
          end = text.index('## Historischer Katalog und Evidenz', start)
          operative = text[start:end]
          matches = []
          for line in operative.splitlines():
              if not line.startswith('|'):
                  continue
              cells = [cell.strip() for cell in line.strip().strip('|').split('|')]
              if cells and cells[0] == 'OBSERVABILITY-INVENTORY-01':
                  matches.append(line)
          print('MATCH_COUNT=', len(matches))
          for line in matches:
              print('TASK_ROW=', line)
          if len(matches) != 1:
              raise SystemExit('expected exactly one operative task row')
          PY
          git checkout --detach origin/main
          node scripts/codex-task-preflight.mjs OBSERVABILITY-INVENTORY-01
          git checkout docs/governance-ssot-sync-05
      - name: Self-delete diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/opentasks-observability-inventory-diagnostic.yml
          git commit -m 'ci(governance): remove #611 lifecycle diagnostic'
          git push origin HEAD:docs/governance-ssot-sync-05
