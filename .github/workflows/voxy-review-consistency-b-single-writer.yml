name: Voxy review consistency Slice B single writer

on:
  push:
    branches:
      - docs/voxy-review-consistency-b-authorize-01

permissions:
  contents: write

jobs:
  authorize-slice-b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2

      - name: Verify exact source state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "9c99d7fc557c4eac30121184888dd6ca4631f6b9"
          test "$(git hash-object docs/E150/OpenTasks.md)" = "f02dd5ef2205a28dfaf6be243008b74a2d322351"

      - name: Serialize Slice B authorization atomically
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path("docs/E150/OpenTasks.md")
          text = path.read_text(encoding="utf-8")
          prefix = "| VOXY-STUDIO-REVIEW-CONSISTENCY-01 |"
          lines = text.splitlines()
          matches = [i for i, line in enumerate(lines) if line.startswith(prefix)]
          if len(matches) != 1:
              raise SystemExit(f"expected exactly one operative row, found {len(matches)}")

          old = lines[matches[0]]
          required = [
              "| review | P1 |",
              "**Slice A only:**",
              "**Slices B/C bleiben nicht autorisiert**",
          ]
          for token in required:
              if token not in old:
                  raise SystemExit(f"unexpected existing row; missing {token!r}")

          lines[matches[0]] = (
              "| VOXY-STUDIO-REVIEW-CONSISTENCY-01 | codex_ready | P1 | "
              "Issue `#977`; Slice A via PR `#1001` / Merge `fa5dcdcdc04d94740433f572f48946bc9946727f` abgeschlossen; "
              "bestehende #570 Studio-/Draft-/Review-Architektur; #975/#976 abgeschlossen; aktueller Main-Audit bestätigt stale Locale-Approval-Projektion | "
              "**Slice B only:** die bereits in der Admin-Route aufgelöste aktuelle Evidence-/Decision-Gate-Freshness als schmale per-Draft-Projektion in `buildVoxyStudioLocaleReviewMatrices()` einspeisen; "
              "`exactLocaleApprovalPresent`, `translationStatus`, RTL-Freigabe und `approvedLocales` dürfen nur bei revisionsgültiger **und** aktueller Evidence-/Gate-Freigabe grün sein; historische Draft-/Render-Zustände bleiben sichtbar; keine neue Evidence-/Review-Authority | "
              "Approved revision + current gate bleibt approved; gleiche Revision mit stale Evidence/Gate zählt nicht als aktuelle Freigabe; stale Approval erfüllt RTL explicit approval nicht; historisch gerenderter Draft bleibt auditierbar, aber nicht current-approved; fokussierte Contract-Tests + Typecheck/Lint/Build/`git diff --check`; **Slice C bleibt nicht autorisiert**; keine neue Queue/SSOT, keine Provider-, Render-, Publish- oder Deployment-Side-Effects |"
          )
          path.write_text("\n".join(lines) + ("\n" if text.endswith("\n") else ""), encoding="utf-8")
          PY

          node --input-type=module <<'NODE'
          import fs from "node:fs/promises";
          import { extractOperativeHead, parseOperativeTaskStatuses } from "./scripts/codex-task-preflight.mjs";
          const text = await fs.readFile("docs/E150/OpenTasks.md", "utf8");
          const statuses = parseOperativeTaskStatuses(extractOperativeHead(text));
          if (statuses.get("VOXY-STUDIO-REVIEW-CONSISTENCY-01") !== "codex_ready") {
            throw new Error("slice_b_status_not_codex_ready");
          }
          NODE

          git diff --check

      - name: Commit canonical SSOT delta and remove writer
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/voxy-review-consistency-b-single-writer.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/E150/OpenTasks.md .github/workflows/voxy-review-consistency-b-single-writer.yml
          git commit -m "docs(e150): authorize Voxy review consistency Slice B"
          git push origin HEAD:docs/voxy-review-consistency-b-authorize-01
