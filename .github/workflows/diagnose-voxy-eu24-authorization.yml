name: Diagnose Voxy EU24 authorization

on:
  push:
    branches:
      - chore/voxy-eu24-authorization-diagnose-20260924

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/voxy-eu24-authorization-diagnose-20260924
          fetch-depth: 0

      - name: Diagnose current-main authorization
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --no-tags
          test "$(git rev-parse origin/main)" = "8f19ad8baac19ad3ebb95e6026c8fd5dffcfc628"
          git checkout -B main origin/main
          test -z "$(git status --porcelain)"
          test "$(git rev-parse 'HEAD:docs/E150/OpenTasks.md')" = "4bb0b0f8fda4849f254c797294b3b27c814e51f6"
          python3 - <<'PY'
          from pathlib import Path
          text = Path('docs/E150/OpenTasks.md').read_text(encoding='utf-8')
          start_marker = '## Kanonischer Operativteil'
          end_marker = '## Historischer Katalog und Evidenz'
          assert text.count(start_marker) == 1, f'operative_marker_count={text.count(start_marker)}'
          assert text.count(end_marker) == 1, f'historical_marker_count={text.count(end_marker)}'
          start = text.index(start_marker)
          end = text.index(end_marker)
          assert start < end
          operative = text[start:end]
          target = 'VOXY-EU24-MULTILINGUAL-EDITORIAL-01'
          lines = [line for line in operative.splitlines() if target in line]
          print(f'operative_target_count={len(lines)}')
          for line in lines:
              print('OPERATIVE_ROW=' + line)
          assert len(lines) == 1
          PY
          node scripts/codex-task-preflight.mjs VOXY-EU24-MULTILINGUAL-EDITORIAL-01

      - name: Remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git checkout chore/voxy-eu24-authorization-diagnose-20260924
          git rm .github/workflows/diagnose-voxy-eu24-authorization.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(governance): remove Voxy EU24 authorization diagnostic'
          git push origin HEAD:chore/voxy-eu24-authorization-diagnose-20260924
